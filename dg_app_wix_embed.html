function chevronSvg() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function emptyStateHtml(title, desc) {
  return `<div class="empty-state">${emptyIcon()}<div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div></div>`;
}

function initDashboardCharts() {
  if (typeof Chart === "undefined") {
    const region = document.getElementById("charts-region");
    if (region) {
      region.style.gridTemplateColumns = "1fr";
      region.innerHTML = `<div class="card">${emptyStateHtml("Charts unavailable offline", "The charting library couldn't load (no internet access). Everything else in this app still works fully offline.")}</div>`;
    }
    return;
  }
  const stats = getDashboardStats();
  const palette = ["#8f2a3c", "#2261b0", "#a06a12", "#1e7d4b", "#6b7182", "#b3312c", "#4c3b8f", "#0f766e", "#9a3412", "#334155"];
  Chart.defaults.font.family = "Inter, system-ui, sans-serif";
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = "#6b7182";

  const recCtx = document.getElementById("chart-records-by-tab");
  if (recCtx) {
    activeCharts.push(new Chart(recCtx, {
      type: "bar",
      data: {
        labels: stats.perSheet.map((s) => SHEET_BY_ID[s.id].shortLabel),
        datasets: [{ data: stats.perSheet.map((s) => s.total), backgroundColor: "#8f2a3c", borderRadius: 4, maxBarThickness: 22 }],
      },
      options: baseBarOptions(),
    }));
  }
  const compCtx = document.getElementById("chart-completion-by-tab");
  if (compCtx) {
    const trackable = stats.perSheet.filter((s) => s.sheetStatus !== "untracked");
    activeCharts.push(new Chart(compCtx, {
      type: "bar",
      data: {
        labels: trackable.map((s) => SHEET_BY_ID[s.id].shortLabel),
        datasets: [{ data: trackable.map((s) => s.pct), backgroundColor: "#2261b0", borderRadius: 4, maxBarThickness: 22 }],
      },
      options: { ...baseBarOptions(), scales: { ...baseBarOptions().scales, y: { max: 100, ticks: { callback: (v) => v + "%" } } } },
    }));
  }
  const dxCtx = document.getElementById("chart-diagnosis");
  if (dxCtx) {
    const counts = {};
    for (const cfg of SHEET_CONFIG) {
      if (!cfg.diagnosisLabel) continue;
      counts[cfg.diagnosisLabel] = getSheetStats(cfg.id).total;
    }
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    activeCharts.push(new Chart(dxCtx, {
      type: "doughnut",
      data: { labels: entries.map((e) => e[0]), datasets: [{ data: entries.map((e) => e[1]), backgroundColor: palette, borderWidth: 2, borderColor: "#fff" }] },
      options: { plugins: { legend: { position: "right", labels: { boxWidth: 10, padding: 8 } } }, cutout: "62%" },
    }));
  }
  const dupCtx = document.getElementById("chart-dup-by-tab");
  if (dupCtx) {
    const withDups = stats.perSheet.filter((s) => s.dupCount > 0);
    if (withDups.length) {
      activeCharts.push(new Chart(dupCtx, {
        type: "bar",
        data: { labels: withDups.map((s) => SHEET_BY_ID[s.id].shortLabel), datasets: [{ data: withDups.map((s) => s.dupCount), backgroundColor: "#b3312c", borderRadius: 4, maxBarThickness: 22 }] },
        options: baseBarOptions(),
      }));
    } else {
      dupCtx.parentElement.innerHTML = `<div class="section-title" style="margin-bottom:12px">Duplicate Records by Tab</div>` + emptyStateHtml("No duplicates", "No duplicate records were detected in any tab.");
    }
  }
}
function baseBarOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: "#eceef2" } } },
  };
}
function wireDashboard() {}

// ============================================================================
// SHEET PAGE (generic, used for every worksheet tab)
// ============================================================================
const sheetPageState = {}; // sheetId -> { search, sort:{field,dir}, page, pageSize }

function getSheetPageState(sheetId) {
  if (!sheetPageState[sheetId]) sheetPageState[sheetId] = { search: "", sort: null, page: 1, pageSize: 25 };
  return sheetPageState[sheetId];
}

function renderSheetPage(cfg) {
  const stats = getSheetStats(cfg.id);
  const dupGroups = getDuplicateGroupsForSheet(cfg.id);
  const untracked = cfg.completion.mode === "manual";

  return `
    <div class="page-header">
      <div>
        <div class="page-title">${esc(cfg.label)}</div>
        <div class="page-subtitle">${esc(sheetDescription(cfg))}</div>
      </div>
      <div class="page-header-actions">
        ${!cfg.isReference ? `<button class="btn" id="btn-completion-criteria">${gearIconSvg()} Completion Criteria</button>` : ""}
        ${!cfg.isReference ? `<button class="btn" id="btn-add-row">+ Add Row</button>` : ""} <button class="btn" id="btn-export-sheet">${downloadIconSvg()} Export</button>
        ${!cfg.isReference ? `<a class="btn primary" href="#/import-export?target=${cfg.id}">${uploadIconSvg()} Import Records</a>` : ""}
      </div>
    </div>

    ${!cfg.isReference ? `
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
      ${kpiCard({ label: "Total Records", value: fmtNum(stats.total), icon: "records", sub: cfg.label })}
      ${untracked
        ? kpiCard({ label: "Manually Tracked", value: `${stats.complete}/${stats.total}`, icon: "check", sub: "No source status field" })
        : kpiCard({ label: "Complete", value: fmtNum(stats.complete), icon: "check", sub: `${stats.pct}% of records`, cls: "positive" })}
      ${cfg.completion.mode === "flag-blank-is-complete"
        ? kpiCard({ label: "Needs Attention", value: fmtNum(stats.needsAttention), icon: "records", sub: cfg.completion.label, cls: stats.needsAttention ? "warn" : "positive" })
        : kpiCard({ label: "Remaining", value: fmtNum(stats.remaining), icon: "records", sub: "Not yet complete" })}
      ${kpiCard({ label: "Duplicates", value: fmtNum(stats.dupCount), icon: "copy", sub: stats.dupCount ? "Review duplicates in this tab" : "None found", cls: stats.dupCount ? "warn" : "positive" })}
    </div>` : ""}

    ${dupGroups.length ? `<div class="card" style="padding:12px 16px;margin-bottom:20px;border-color:var(--status-attention-bg);background:var(--status-attention-bg)">
      <span style="color:var(--status-attention);font-weight:600;font-size:13px">⚠ ${dupUniqueCount(dupGroups)} record(s) in this tab are part of a duplicate group.</span>
      <a class="link-inline" href="#/duplicates/${esc(cfg.id)}" style="margin-left:8px;font-size:12.5px">Review duplicates in this tab →</a>
    </div>` : ""}

    <div id="sheet-table-region"></div>
  `;
}

function sheetDescription(cfg) {
  if (cfg.isReference) return "Reference lookup table from the source workbook — not a patient roster.";
  const c = cfg.completion;
  return c.mode === "manual" ? "No status field exists in the source data for this tab — completion is tracked manually below." : `Completion is derived from: "${c.field}" (${c.label}).`;
}

function wireSheetPage(cfg) {
  renderSheetTable(cfg);
  document.getElementById("btn-add-row")?.addEventListener("click", () => openAddRowModal(cfg)); document.getElementById("btn-export-sheet")?.addEventListener("click", () => exportSheetToExcel(cfg.id));
  document.getElementById("btn-completion-criteria")?.addEventListener("click", () => openCompletionCriteriaModal(cfg));
}

function getSheetColumns(cfg) {
  const headers = RAW_SHEETS[cfg.id]?.headers || [];
  return headers;
}

function renderSheetTable(cfg) {
  const state = getSheetPageState(cfg.id);
  const allRecords = getAllRecords().filter((r) => r.sheetId === cfg.id);
  const columns = getSheetColumns(cfg);

  let filtered = allRecords;
  if (state.search) {
    const q = state.search.toLowerCase();
    const fields = cfg.searchFields || columns;
    filtered = filtered.filter((r) => fields.some((f) => String(r.data[f] || "").toLowerCase().includes(q)));
  }
  if (state.statusFilter) {
    filtered = filtered.filter((r) => r.status === state.statusFilter);
  }
  if (state.sort) {
    const { field, dir } = state.sort;
    filtered = [...filtered].sort((a, b) => {
      const va = field === "__status" ? a.status : a.data[field] || "";
      const vb = field === "__status" ? b.status : b.data[field] || "";
      const da = parseDateLoose(va), db = parseDateLoose(vb);
      let cmp;
      if (da && db) cmp = da - db;
      else cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return dir === "asc" ? cmp : -cmp;
    });
  }

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const pageStart = (state.page - 1) * state.pageSize;
  const pageRows = filtered.slice(pageStart, pageStart + state.pageSize);

  const showStatusCol = !cfg.isReference;
  // Every column from the source sheet is shown — nothing from the original
  // Excel file is hidden or dropped, even on wide sheets (those just scroll
  // horizontally; see .data-table-wrap).
  const displayCols = columns;

  const region = document.getElementById("sheet-table-region");
  region.innerHTML = `
    <div class="table-toolbar">
      <div class="table-search">
        <span class="icon">${searchIconSvg()}</span>
        <input type="text" id="sheet-search-input" placeholder="Search ${esc(cfg.label)}…" value="${esc(state.search)}" />
      </div>
      ${showStatusCol ? `
      <select class="filter-select" id="sheet-status-filter">
        <option value="">All statuses</option>
        ${Object.keys(STATUS_META).map((s) => `<option value="${s}" ${state.statusFilter === s ? "selected" : ""}>${STATUS_META[s].label}</option>`).join("")}
      </select>` : ""}
      <button class="btn sm ghost" id="reset-filters" title="Clear search, filters, and sorting; go back to page 1">${resetIconSvg()} Reset</button>
      <span class="text-muted" style="margin-left:auto;font-size:12.5px">${fmtNum(total)} record${total === 1 ? "" : "s"}</span>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          ${displayCols.map((c) => `<th data-field="${esc(c)}">${esc(c)}${sortArrow(state, c)}</th>`).join("")}
          ${showStatusCol ? `<th data-field="__status">Status${sortArrow(state, "__status")}</th>` : ""}
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map((r) => sheetRowHtml(cfg, r, displayCols, showStatusCol)).join("") : `<tr><td colspan="${displayCols.length + 2}"><div class="empty-state">${emptyIcon()}<div class="title">No records match your filters</div><div class="desc">Try clearing search or status filters.</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${state.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${state.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${state.page + 1}" ${state.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${state.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;

  region.querySelector("#sheet-search-input").addEventListener("input", debounce((e) => {
    state.search = e.target.value;
    state.page = 1;
    renderSheetTable(cfg);
  }, 220));
  region.querySelector("#sheet-status-filter")?.addEventListener("change", (e) => {
    state.statusFilter = e.target.value || null;
    state.page = 1;
    renderSheetTable(cfg);
  });
  region.querySelector("#reset-filters")?.addEventListener("click", () => {
    state.search = ""; state.statusFilter = null; state.sort = null; state.page = 1;
    renderSheetTable(cfg);
    toast("Filters and sorting reset");
  });
  region.querySelectorAll("thead th[data-field]").forEach((th) => {
    th.addEventListener("click", () => {
      const field = th.dataset.field;
      if (state.sort?.field === field) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
      else state.sort = { field, dir: "asc" };
      renderSheetTable(cfg);
    });
  });
  region.querySelectorAll(".pager-btns button").forEach((b) => {
    b.addEventListener("click", () => { state.page = +b.dataset.page; renderSheetTable(cfg); });
  });
  region.querySelectorAll("[data-action='toggle-expand']").forEach((el) => {
    el.addEventListener("click", () => {
      const uid = el.dataset.uid;
      if (expandedRows.has(uid)) expandedRows.delete(uid);
      else expandedRows.add(uid);
      renderSheetTable(cfg);
    });
  });
  region.querySelectorAll("[data-action='edit-record']").forEach((el) => {
    el.addEventListener("click", () => openEditModal(el.dataset.uid, () => renderSheetTable(cfg)));
  });
  region.querySelectorAll("[data-action='mark-complete']").forEach((el) => {
    el.addEventListener("click", () => { setManualStatus(el.dataset.uid, "complete"); toast("Marked complete"); renderSheetTable(cfg); renderSidebar(); });
  });
  region.querySelectorAll("[data-action='mark-pending']").forEach((el) => {
    el.addEventListener("click", () => { setManualStatus(el.dataset.uid, "pending"); toast("Marked pending"); renderSheetTable(cfg); renderSidebar(); });
  });
  region.querySelectorAll("[data-action='delete-record']").forEach((el) => {
    el.addEventListener("click", () => confirmDialog(
      "Archive this record?",
      "It will be hidden from all views but can be restored later. This does not modify the original workbook.",
      () => { softDeleteRecord(el.dataset.uid); toast("Record archived"); renderSheetTable(cfg); renderSidebar(); }
    ));
  });
  region.querySelectorAll(".inline-edit-input").forEach((input) => {
    const commit = () => {
      const uid = input.dataset.uid;
      const field = input.dataset.field;
      const newVal = input.value;
      const rec = getAllRecords().find((r) => r.uid === uid);
      if (!rec || (rec.data[field] || "") === newVal) return;
      updateRecord(uid, { [field]: newVal });
      // editing the field that drives this sheet's completion should let the source field
      // speak for itself again, rather than leaving a stale manual override in place
      if (cfg.completion?.field === field) setManualStatus(uid, null);
      toast(`Saved "${field}"`);
      renderSheetTable(cfg);
      renderSidebar();
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = getAllRecords().find((r) => r.uid === input.dataset.uid)?.data[input.dataset.field] || ""; input.blur(); }
    });
  });
  region.querySelectorAll(".cal-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const textInput = btn.parentElement.querySelector(".inline-edit-input");
      openDatePickerFor(textInput);
    });
  });
}
function sortArrow(state, field) {
  if (state.sort?.field !== field) return "";
  return `<span class="sort-arrow">${state.sort.dir === "asc" ? "▲" : "▼"}</span>`;
}
// Rows expanded to show the "just below it" detail panel (profile/history
// links). Transient — resets on a full page reload, not persisted.
const expandedRows = new Set();

function sheetRowHtml(cfg, r, displayCols, showStatusCol) {
  const dateFieldsSet = new Set(cfg.dateFields || []);
  const totalCols = displayCols.length + (showStatusCol ? 1 : 0) + 1;
  const isExpanded = expandedRows.has(r.uid);

  const mainRow = `<tr data-row-for="${r.uid}">
    ${displayCols.map((c) => {
      const val = r.data[c] || "";
      const isDate = dateFieldsSet.has(c);
      const isNameCol = c === cfg.nameField;
      return `<td class="inline-cell${isNameCol ? " name-col" : ""}">
        <div class="inline-cell-wrap">
          <input type="text" class="inline-edit-input" data-uid="${r.uid}" data-field="${esc(c)}" value="${esc(val)}" placeholder="—" title="${esc(val)}" />
          ${isDate ? `<button type="button" class="cal-btn" data-uid="${r.uid}" data-field="${esc(c)}" title="Pick a date">${calendarIconSvg()}</button>` : ""}
        </div>
      </td>`;
    }).join("")}
    ${showStatusCol ? `<td>${statusBadge(r.status)}</td>` : ""}
    <td class="actions-cell">
      <button class="btn sm ghost" data-action="toggle-expand" data-uid="${r.uid}" title="${isExpanded ? "Hide details" : "View details"}">${isExpanded ? chevronUpSvg() : chevronDownSvg()}</button>
      <button class="btn sm ghost" data-action="edit-record" data-uid="${r.uid}" title="Edit in a form">${editIconSvg()}</button>
      ${!cfg.isReference && r.status !== "complete" ? `<button class="btn sm ghost" data-action="mark-complete" data-uid="${r.uid}" title="Mark complete">${checkIconSvg()}</button>` : ""}
      ${!cfg.isReference && r.status === "complete" ? `<button class="btn sm ghost" data-action="mark-pending" data-uid="${r.uid}" title="Mark pending">${undoIconSvg()}</button>` : ""}
      <button class="btn sm ghost" data-action="delete-record" data-uid="${r.uid}" title="Archive">${trashIconSvg()}</button>
    </td>
  </tr>`;

  if (!isExpanded) return mainRow;

  return mainRow + `<tr class="expand-row" data-expand-for="${r.uid}"><td colspan="${totalCols}">
    <div class="expand-panel">
      <strong>${esc(r.displayName || "This record")}</strong>
      <span class="text-muted" style="margin-left:8px">${esc(cfg.label)}${r.isImported ? " · Imported" : ""}</span>
      <div class="flex gap-3 mt-2" style="flex-wrap:wrap">
        ${r.identityKey ? `<a class="link-inline" href="#/patient/${encodeURIComponent(r.identityKey)}">View full patient profile across all tabs →</a>` : ""}
        <a class="link-inline" href="#/history?uid=${encodeURIComponent(r.uid)}">View change history for this record →</a>
      </div>
    </div>
  </td></tr>`;
}
function searchIconSvg() { return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`; }
function calendarIconSvg() { return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 3v4M8 3v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`; }
function chevronDownSvg() { return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function chevronUpSvg() { return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 15l-6-6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

// ---------------------------------------------------------------------------
// Shared native date picker — one hidden <input type="date"> reused for every
// calendar button, positioned right under whichever text field was clicked.
// Selecting a date writes "M/D/YYYY" back into that field and fires the same
// blur-triggered save the field already has, so no separate save path is needed.
// ---------------------------------------------------------------------------
let sharedDateInput = null;
function getSharedDateInput() {
  if (sharedDateInput) return sharedDateInput;
  sharedDateInput = document.createElement("input");
  sharedDateInput.type = "date";
  sharedDateInput.className = "shared-date-picker";
  document.body.appendChild(sharedDateInput);
  sharedDateInput.addEventListener("blur", () => sharedDateInput.classList.remove("active"));
  return sharedDateInput;
}
function toISODateInput(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dgCloseCalendar() {
  const el = document.getElementById("dg-cal-pop");
  if (el) el.remove();
  if (window.__dgCalOff) { window.__dgCalOff(); window.__dgCalOff = null; }
}

function openDatePickerFor(textInput) {
  if (!textInput) return;
  dgCloseCalendar();
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const parsed = parseDateLoose(textInput.value);
  const sel = parsed ? new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate()) : null;
  // "Date/Time" columns also carry a time of day; keep whatever time is already in the cell.
  const withTime = /time/i.test((textInput.dataset && textInput.dataset.field) || "");
  const p2 = (n) => String(n).padStart(2, "0");
  let timeVal = parsed && /\d{1,2}:\d{2}/.test(textInput.value) ? `${p2(parsed.getHours())}:${p2(parsed.getMinutes())}` : "";
  let viewY = (sel || today).getFullYear();
  let viewM = (sel || today).getMonth();
  const pop = document.createElement("div");
  pop.id = "dg-cal-pop";
  pop.className = "dg-cal";
  pop.setAttribute("role", "dialog");
  pop.setAttribute("aria-label", "Choose a date");
  const same = (a, b) => !!a && !!b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const commit = (d) => {
    let out = d ? `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}` : "";
    if (d && withTime && timeVal) { const [th, tm] = timeVal.split(":"); out += ` ${+th}:${tm}`; }
    textInput.value = out;
    dgCloseCalendar();
    textInput.dispatchEvent(new Event("blur"));
  };
  const place = () => {
    const rect = textInput.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.min(Math.max(8, rect.left), Math.max(8, window.innerWidth - w - 8));
    let top = rect.bottom + 4;
    if (top + h > window.innerHeight - 8) top = rect.top - h - 4;
    if (top < 8) top = Math.max(8, window.innerHeight - h - 8);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  };
  const draw = () => {
    const first = new Date(viewY, viewM, 1);
    const start = new Date(viewY, viewM, 1 - first.getDay());
    const yMin = Math.min(1900, viewY), yMax = Math.max(today.getFullYear() + 10, viewY);
    let years = "";
    for (let y = yMax; y >= yMin; y--) years += `<option value="${y}"${y === viewY ? " selected" : ""}>${y}</option>`;
    let days = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const cls = ["dg-cal-day"];
      if (d.getMonth() !== viewM) cls.push("other");
      if (same(d, today)) cls.push("today");
      if (same(d, sel)) cls.push("sel");
      days += `<button type="button" class="${cls.join(" ")}" data-ts="${d.getTime()}" aria-label="${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}"${same(d, today) ? ' aria-current="date"' : ""}>${d.getDate()}</button>`;
    }
    pop.innerHTML = `<div class="dg-cal-head"><button type="button" class="dg-cal-nav" data-nav="-1" aria-label="Previous month">&#8249;</button><select data-month aria-label="Month">${MONTHS.map((m, i) => `<option value="${i}"${i === viewM ? " selected" : ""}>${m}</option>`).join("")}</select><select data-year aria-label="Year">${years}</select><button type="button" class="dg-cal-nav" data-nav="1" aria-label="Next month">&#8250;</button></div><div class="dg-cal-grid">${DOW.map((x) => `<div class="dg-cal-dow">${x}</div>`).join("")}${days}</div>${withTime ? `<div class="dg-cal-time"><label for="dg-cal-time-in">Time</label><input type="time" id="dg-cal-time-in" data-time value="${timeVal}" /><span>Then pick a day</span></div>` : ""}<div class="dg-cal-foot"><button type="button" data-today="1">${withTime ? "Now" : "Today"}</button><button type="button" data-clear="1">Clear</button></div>`;
    place();
  };
  pop.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.ts) { commit(new Date(+b.dataset.ts)); return; }
    if (b.dataset.nav) {
      viewM += +b.dataset.nav;
      if (viewM < 0) { viewM = 11; viewY--; } else if (viewM > 11) { viewM = 0; viewY++; }
      draw();
      return;
    }
    if (b.dataset.today) {
      if (withTime) { const n = new Date(); timeVal = `${p2(n.getHours())}:${p2(n.getMinutes())}`; commit(new Date(n.getFullYear(), n.getMonth(), n.getDate())); }
      else commit(new Date(today));
      return;
    }
    if (b.dataset.clear) commit(null);
  });
  pop.addEventListener("change", (e) => {
    if (e.target.matches("[data-time]")) { timeVal = e.target.value || ""; return; }
    if (e.target.matches("[data-month]")) viewM = +e.target.value;
    else if (e.target.matches("[data-year]")) viewY = +e.target.value;
    else return;
    draw();
  });
  pop.addEventListener("mousedown", (e) => { if (!e.target.closest("select, input")) e.preventDefault(); });
  document.body.appendChild(pop);
  draw();
  const onDown = (e) => { if (!pop.contains(e.target) && !(e.target.closest && e.target.closest(".cal-btn"))) dgCloseCalendar(); };
  const onKey = (e) => { if (e.key === "Escape") dgCloseCalendar(); };
  const onScroll = (e) => { if (!pop.contains(e.target)) dgCloseCalendar(); };
  setTimeout(() => {
    if (!document.body.contains(pop)) return;
    document.addEventListener("mousedown", onDown, true);
    document.addEventListener("keydown", onKey, true);
    window.addEventListener("scroll", onScroll, true);
    window.addEventListener("resize", dgCloseCalendar);
    window.addEventListener("hashchange", dgCloseCalendar);
  }, 0);
  window.__dgCalOff = () => {
    document.removeEventListener("mousedown", onDown, true);
    document.removeEventListener("keydown", onKey, true);
    window.removeEventListener("scroll", onScroll, true);
    window.removeEventListener("resize", dgCloseCalendar);
    window.removeEventListener("hashchange", dgCloseCalendar);
  };
}

function openModal(innerHtml, opts = {}) {
  closeModal();
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.id = "active-modal";
  backdrop.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}">${innerHtml}</div>`;
  document.body.appendChild(backdrop);
  requestAnimationFrame(() => backdrop.classList.add("open"));
  backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", escCloseHandler);
  return backdrop;
}
function escCloseHandler(e) { if (e.key === "Escape") closeModal(); }
function closeModal() {
  const m = document.getElementById("active-modal");
  if (!m) return;
  m.id = ""; // free up the id immediately so a modal opened right after this one is unambiguous during the fade-out
  m.classList.remove("open");
  document.removeEventListener("keydown", escCloseHandler);
  setTimeout(() => m.remove(), 180);
}
function confirmDialog(title, desc, onConfirm, opts) {
  opts = opts || {};
  const modal = openModal(`
    <div class="modal-header"><div><h3>${esc(title)}</h3><p>${esc(desc)}</p></div></div>

  modal.querySelector("#confirm-cancel").addEventListener("click", closeModal);
  modal.querySelector("#confirm-ok").addEventListener("click", () => { onConfirm(); closeModal(); });
}

function renderRawDataTable() {
  let records = getAllRecords();
  if (rawDataState.groupFilter !== "all") {
    records = records.filter((r) => SHEET_BY_ID[r.sheetId].group === rawDataState.groupFilter);
  }
  if (rawDataState.sourceFilter) {
    records = records.filter((r) => r.sheetId === rawDataState.sourceFilter);
  }
  if (rawDataState.search) {
    const q = rawDataState.search.toLowerCase();
    records = records.filter((r) => {
      const cfg = SHEET_BY_ID[r.sheetId];
      return (cfg.searchFields || Object.keys(r.data)).some((f) => String(r.data[f] || "").toLowerCase().includes(q));
    });
  }
  if (rawDataState.sort) {
    const { field, dir } = rawDataState.sort;
    const valueOf = {
      __name: (r) => r.displayName || "",
      __source: (r) => SHEET_BY_ID[r.sheetId].label,
      __status: (r) => r.status,
    }[field];
    records = [...records].sort((a, b) => {
      const cmp = String(valueOf(a)).localeCompare(String(valueOf(b)), undefined, { numeric: true });
      return dir === "asc" ? cmp : -cmp;
    });
  }

  const sourceOptions = [...new Set(getAllRecords().map((r) => r.sheetId))].filter((id) => rawDataState.groupFilter === "all" || SHEET_BY_ID[id].group === rawDataState.groupFilter);

  const total = records.length;
  const totalPages = Math.max(1, Math.ceil(total / rawDataState.pageSize));
  rawDataState.page = Math.min(rawDataState.page, totalPages);
  const pageRows = records.slice((rawDataState.page - 1) * rawDataState.pageSize, rawDataState.page * rawDataState.pageSize);

  const region = document.getElementById("raw-data-table-region");
  region.innerHTML = `
    <div class="table-toolbar">
      <div class="table-search"><span class="icon">${searchIconSvg()}</span><input type="text" id="raw-search" placeholder="Search all records…" value="${esc(rawDataState.search)}" /></div>
      <select class="filter-select" id="raw-source-filter">
        <option value="">All source tabs</option>
        ${sourceOptions.map((id) => `<option value="${id}" ${rawDataState.sourceFilter === id ? "selected" : ""}>${esc(SHEET_BY_ID[id].label)}</option>`).join("")}
      </select>
      <button class="btn sm ghost" id="reset-raw-filters" title="Clear search, filters, and sorting; go back to page 1">${resetIconSvg()} Reset</button>
      <span class="text-muted" style="margin-left:auto;font-size:12.5px">${fmtNum(total)} records</span>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th data-field="__name">Patient / Record${sortArrow(rawDataState, "__name")}</th>
          <th data-field="__source">Source Tab${sortArrow(rawDataState, "__source")}</th>
          <th>Identifier</th>
          <th data-field="__status">Status${sortArrow(rawDataState, "__status")}</th>
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map(rawRowHtml).join("") : `<tr><td colspan="5"><div class="empty-state">${emptyIcon()}<div class="title">No records match your filters</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${rawDataState.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${rawDataState.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${rawDataState.page - 1}" ${rawDataState.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${rawDataState.page + 1}" ${rawDataState.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${rawDataState.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;
  region.querySelector("#raw-search").addEventListener("input", debounce((e) => { rawDataState.search = e.target.value; rawDataState.page = 1; renderRawDataTable(); }, 220));
  region.querySelector("#raw-source-filter").addEventListener("change", (e) => { rawDataState.sourceFilter = e.target.value; rawDataState.page = 1; renderRawDataTable(); });
  region.querySelector("#reset-raw-filters").addEventListener("click", () => {
    rawDataState.search = ""; rawDataState.sourceFilter = ""; rawDataState.sort = null; rawDataState.page = 1; rawDataState.groupFilter = "all";
    render();
    toast("Filters and sorting reset");
  });
  region.querySelectorAll("thead th[data-field]").forEach((th) => {
    th.addEventListener("click", () => {
      const field = th.dataset.field;
      if (rawDataState.sort?.field === field) rawDataState.sort.dir = rawDataState.sort.dir === "asc" ? "desc" : "asc";
      else rawDataState.sort = { field, dir: "asc" };
      renderRawDataTable();
    });
  });
  region.querySelectorAll(".pager-btns button").forEach((b) => b.addEventListener("click", () => { rawDataState.page = +b.dataset.page; renderRawDataTable(); }));
  wireGenericTableClicks();

// ============================================================================
// DUPLICATE MANAGEMENT
// ============================================================================
function dupScope() {
  const { view, param } = parseHash();
  return view === "duplicates" && param && SHEET_BY_ID[param] ? param : null;
}
function dupUniqueCount(groups) {
  return new Set(groups.flatMap((g) => g.records.map((r) => r.uid))).size;
}
function dupGroupsFor(scope) {
  const idx = computeDuplicateIndex();
  return {
    exact: scope ? idx.exactDuplicates.filter((g) => g.sheetId === scope) : idx.exactDuplicates,
    potential: scope ? idx.potentialDuplicates.filter((g) => g.sheetId === scope) : idx.potentialDuplicates,
    cross: scope ? [] : idx.crossTabGroups,
  };
}

function renderDuplicates() {
  const scope = dupScope();
  const idx = computeDuplicateIndex();
  const g = dupGroupsFor(scope);
  const tabs = [
    { id: "exact", label: "Exact Duplicates", groups: g.exact },
    { id: "potential", label: "Potential Duplicates", groups: g.potential },
  ];
  if (!scope) tabs.push({ id: "cross-tab", label: "Same Patient, Multiple Tabs", groups: g.cross });

  const seenKey = scope || "*";
  if (window.__dupScopeSeen !== seenKey) {
    window.__dupScopeSeen = seenKey;
    window.__dupTab = !g.exact.length && g.potential.length ? "potential" : "exact";
  }
  if (scope && window.__dupTab === "cross-tab") window.__dupTab = "exact";
  if (window.__dupAutoTab) {
    window.__dupAutoTab = false;
    const cur = tabs.find((t) => t.id === window.__dupTab);
    if (cur && !cur.groups.length) { const nx = tabs.find((t) => t.groups.length); if (nx) window.__dupTab = nx.id; }
  }
  if (!window.__dupTab) window.__dupTab = "exact";

  const sheets = SHEET_CONFIG.filter((c) => !c.isReference);
  const cnt = (id) => dupUniqueCount([...idx.exactDuplicates, ...idx.potentialDuplicates].filter((x) => x.sheetId === id));
  const scopeSel = `<select class="filter-select" id="dup-scope" aria-label="Show duplicates for one tab">
      <option value="">All tabs (${dupUniqueCount([...idx.exactDuplicates, ...idx.potentialDuplicates])})</option>
      ${sheets.map((c) => `<option value="${esc(c.id)}" ${scope === c.id ? "selected" : ""}>${esc(c.label)} (${cnt(c.id)})</option>`).join("")}
    </select>`;
  const scopeLabel = scope ? SHEET_BY_ID[scope].label : "";

  return `
    <div class="page-header">
      <div>
        <div class="page-title">${scope ? "Duplicates in " + esc(scopeLabel) : "Duplicate Management"}</div>
        <div class="page-subtitle">${scope
          ? "Only duplicates found inside this tab are shown. Nothing is deleted automatically."
          : "Nothing is deleted automatically. Review each group, compare records, and decide what to keep."}
          Patient name and account # are compared together, even when both are typed in the same cell.</div>
      </div>
      <div class="page-header-actions">
        ${scopeSel}
        ${scope ? `<a class="btn" href="#/sheet/${esc(scope)}">← Back to ${esc(scopeLabel)}</a> <a class="btn" href="#/duplicates">All tabs</a>` : ""}
      </div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(${scope ? 2 : 3},1fr)">
      ${kpiCard({ label: "Exact Duplicates", value: fmtNum(g.exact.length), icon: "copy", sub: fmtNum(dupUniqueCount(g.exact)) + " records", cls: g.exact.length ? "warn" : "positive" })}
      ${kpiCard({ label: "Potential Duplicates", value: fmtNum(g.potential.length), icon: "copy", sub: fmtNum(dupUniqueCount(g.potential)) + " records" })}

// ---- side-by-side comparison --------------------------------------------------
function dupCols(cfg) {
  return clWith(cfg.id, () => clColumns(cfg)).filter((c) => !String(c).startsWith("__"));
}
function dupNormVal(cfg, col, v) {
  const t = String(v == null ? "" : v).trim();
  if (!t) return "";
  if (col === cfg.nameField) return nameTokens(splitAcctAndName(t).text).join(" ");
  if (col === cfg.acctField || ACCT_HDR.test(col)) { const sp = splitAcctAndName(t); return normalizeAcct(/[A-Za-z]/.test(t) ? sp.acct : t); }
  if (col === cfg.dobField) return normalizeDob(t) || t.toLowerCase();
  return t.toLowerCase().replace(/\s+/g, " ");
}
// 'match' (same in every row) | 'diff' (different values) | 'gap' (filled in some rows, empty in others) | 'empty'
function dupColClass(cfg, col, values) {
  const filled = values.filter((v) => String(v == null ? "" : v).trim());
  if (!filled.length) return "empty";
  const norm = filled.map((v) => dupNormVal(cfg, col, v));
  let same = new Set(norm).size === 1;
  if (!same && col === cfg.nameField) {
    const tk = filled.map((v) => nameTokens(splitAcctAndName(v).text));
    same = tk.every((x) => tk.every((y) => { const r = nameRel(x, y); return r === "same" || r === "close"; }));
  }
  if (!same) return "diff";
  return filled.length === values.length ? "match" : "gap";
}
function dupCompareTable(g) {
  const cfg = SHEET_BY_ID[g.sheetId];
  const all = dupCols(cfg);
  const idCols = new Set([cfg.nameField, cfg.acctField, cfg.dobField].filter(Boolean));
  const cls = {};
  all.forEach((c) => { cls[c] = dupColClass(cfg, c, g.records.map((r) => r.data[c])); });
  const shown = all.filter((c) => window.__dupAllCols || cls[c] !== "empty" || idCols.has(c));
  const uids = g.records.map((r) => r.uid);
  return `<div class="dup-wrap"><table class="dup-cmp" data-sheet="${esc(g.sheetId)}">
    <thead><tr><th class="dup-act">Row</th>${shown.map((c) => `<th class="dup-${cls[c]}" data-col="${esc(c)}">${esc(clColLabel(c))}</th>`).join("")}</tr></thead>
    <tbody>${g.records.map((r, i) => `<tr data-uid="${esc(r.uid)}">
      <td class="dup-act"><span class="dup-rowtag">#${i + 1}${r.isImported ? " · imported" : ""}</span>
        <button class="btn sm primary" data-action="keep-row" data-uid="${esc(r.uid)}" data-group="${esc(uids.join(","))}" title="Keep this row and archive the others">Keep</button>
        <button class="btn sm ghost" data-action="archive-from-group" data-uid="${esc(r.uid)}">Archive</button>
        <button class="btn sm ghost" data-action="view-record" data-uid="${esc(r.uid)}">View</button></td>
      ${shown.map((c) => `<td class="dup-${cls[c]}" data-col="${esc(c)}"><input type="text" class="inline-edit-input" data-uid="${esc(r.uid)}" data-field="${esc(c)}" value="${esc(r.data[c] == null ? "" : r.data[c])}" placeholder="—" title="${esc(r.data[c] == null ? "" : r.data[c])}" /></td>`).join("")}
    </tr>`).join("")}</tbody></table></div>`;
}
// Re-colour one comparison table from what is currently typed in its cells (no re-render, so focus is kept).
function dupRepaint(table) {
  const cfg = SHEET_BY_ID[table.dataset.sheet];
  const cols = [...table.querySelectorAll("thead th[data-col]")].map((th) => th.dataset.col);
  cols.forEach((c) => {
    const cells = [...table.querySelectorAll("tbody td[data-col]")].filter((td) => td.dataset.col === c);
    const cl = dupColClass(cfg, c, cells.map((td) => td.querySelector("input").value));
    const cellCls = cl === "empty" ? "dup-empty" : "dup-" + cl;
    cells.forEach((td) => { td.className = cellCls; });
    const th = [...table.querySelectorAll("thead th[data-col]")].find((x) => x.dataset.col === c);
    if (th) th.className = cellCls;
  });
}
function dupKeepRow(keepUid, uids) {
  const recs = uids.map((u) => getAllRecords().find((r) => r.uid === u)).filter(Boolean);
  const keep = recs.find((r) => r.uid === keepUid);
  const others = recs.filter((r) => r.uid !== keepUid);
  if (!keep) return;
  const fields = new Set();
  recs.forEach((r) => Object.keys(r.data).forEach((f) => { if (!String(f).startsWith("__")) fields.add(f); }));
  const patch = {};
  fields.forEach((f) => {
    if (String(keep.data[f] == null ? "" : keep.data[f]).trim()) return;
    const o = others.find((r) => String(r.data[f] == null ? "" : r.data[f]).trim());
    if (o) patch[f] = o.data[f];
  });
  if (Object.keys(patch).length) updateRecord(keepUid, patch);
  others.forEach((r) => softDeleteRecord(r.uid));
  toast(`Kept 1 row, archived ${others.length}${Object.keys(patch).length ? `, filled ${Object.keys(patch).length} blank cell(s)` : ""}`);
}

function renderDupList() {
  const scope = dupScope();
  const g = dupGroupsFor(scope);
  const groups = { exact: g.exact, potential: g.potential, "cross-tab": g.cross }[window.__dupTab] || [];
  const region = document.getElementById("dup-list-region");
  if (!groups.length) {
    region.innerHTML = `<div class="card">${emptyStateHtml("Nothing here", scope ? `No ${window.__dupTab === "potential" ? "potential" : "exact"} duplicates found in ${SHEET_BY_ID[scope].label}.` : "No groups found in this category.")}</div>`;
    return;
  }
  const legend = window.__dupTab === "cross-tab" ? "" : `<div class="dup-legend">
      <span><i style="background:var(--status-complete-bg);border:1px solid var(--status-complete)"></i>Same in every row (why they match)</span>
      <span><i style="background:var(--status-pending-bg);border:1px solid var(--status-pending)"></i>Different, or filled in only some rows</span>
      <span>Click any cell to edit it. <strong>Keep</strong> archives the other rows and fills blanks from them.</span></div>`;
  region.innerHTML = legend + groups.map((x) => dupGroupCard(x, !!scope)).join("");
  region.querySelectorAll("[data-action='review-group']").forEach((el) => {
    el.addEventListener("click", () => { setGroupReview(el.dataset.key, { reviewed: true }); toast("Marked as reviewed"); render(); });
  });
  region.querySelectorAll("[data-action='unreview-group']").forEach((el) => {
    el.addEventListener("click", () => { setGroupReview(el.dataset.key, { reviewed: false }); render(); });
  });
  region.querySelectorAll("[data-action='view-record']").forEach((el) => el.addEventListener("click", () => openRecordModal(el.dataset.uid)));
  region.querySelectorAll("[data-action='archive-from-group']").forEach((el) => {
    el.addEventListener("click", () => confirmDialog("Archive this record?", "It will be hidden from all views but can be restored later.", () => {
      softDeleteRecord(el.dataset.uid); invalidateDupCache(); toast("Record archived"); window.__dupAutoTab = true; render();
    }));
  });
  region.querySelectorAll("[data-action='keep-row']").forEach((el) => {
    el.addEventListener("click", () => {
      const uids = el.dataset.group.split(",");
      confirmDialog("Keep this row?", `The other ${uids.length - 1} row(s) will be archived (they can be restored later). Any empty cells in the row you keep are first filled in from the archived rows.`, () => { dupKeepRow(el.dataset.uid, uids); window.__dupAutoTab = true; render(); }, { okClass: "primary", okLabel: "Keep this row" });
    });
  });
}
// inline editing inside the comparison tables (bound once per page render)
function wireDupEditing() {
  const region = document.getElementById("dup-list-region");
  if (!region) return;
  region.addEventListener("blur", (e) => {
    const input = e.target;
    if (!input.classList?.contains("inline-edit-input")) return;
    const uid = input.dataset.uid, field = input.dataset.field;
    const rec = getAllRecords().find((r) => r.uid === uid);
    if (!rec || String(rec.data[field] == null ? "" : rec.data[field]) === input.value) return;
    updateRecord(uid, { [field]: input.value });
    toast(`Saved "${field}"`);
    const table = input.closest("table.dup-cmp");
    if (table) {
      dupRepaint(table);
      const uids = new Set([...table.querySelectorAll("tbody tr")].map((tr) => tr.dataset.uid));
      const idx = computeDuplicateIndex();
      const still = [...idx.exactDuplicates, ...idx.potentialDuplicates].some((gr) => gr.sheetId === table.dataset.sheet && gr.records.filter((r) => uids.has(r.uid)).length >= 2);
      const card = table.closest(".dup-card");
      const note = card && card.querySelector(".dup-resolved");
      if (card && !still && !note) {
        const div = document.createElement("div");
        div.className = "dup-resolved";
        div.textContent = "These rows no longer match, so this group is no longer a duplicate. It will disappear next time this page loads.";
        table.parentElement.insertAdjacentElement("beforebegin", div);
      } else if (note && still) note.remove();
    }
    renderSidebar();
  }, true);
  region.addEventListener("keydown", (e) => {
    const input = e.target;
    if (!input.classList?.contains("inline-edit-input")) return;
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { const rec = getAllRecords().find((r) => r.uid === input.dataset.uid); input.value = rec && rec.data[input.dataset.field] != null ? rec.data[input.dataset.field] : ""; input.blur(); }
  });
}
function dupGroupCard(g, scoped) {
  const reviewed = isGroupReviewed(g.key);
  const isCross = g.type === "cross-tab";
  const label = isCross ? `Found in: ${g.sheets.map((s) => SHEET_BY_ID[s].label).join(", ")}` : `${g.records.length} rows${scoped ? "" : " in " + SHEET_BY_ID[g.sheetId].label}`;
  const reasonHtml = g.reasons && g.reasons.length
    ? `<div class="text-muted" style="font-size:12px;margin-bottom:8px"><strong>Why flagged:</strong> ${g.reasons.map(esc).join(" · ")}</div>`
    : "";
  const body = isCross
    ? `<div class="src-field-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      ${g.records.map((r) => `<div class="card" style="padding:10px;background:var(--bg-sunken)">
        <div class="flex justify-between items-center" style="margin-bottom:6px">
          <span class="badge outline">${esc(SHEET_BY_ID[r.sheetId].label)}</span>
          ${statusBadge(r.status)}
        </div>
        ${r.displayName ? `<div style="font-size:12.5px;font-weight:600;margin-bottom:2px">${esc(r.displayName)}</div>` : ""}
        <div style="font-size:12px;color:var(--text-secondary)">${r.acct ? "Acct #" + esc(r.acct) : ""} ${r.rawDob ? "· DOB " + esc(r.rawDob) : ""}</div>
        <div class="flex gap-2 mt-2">
          <button class="btn sm ghost" data-action="view-record" data-uid="${r.uid}">View</button>
          <button class="btn sm ghost" data-action="archive-from-group" data-uid="${r.uid}">Archive</button>
        </div>
      </div>`).join("")}
    </div>`
    : dupCompareTable(g);
  return `<div class="card dup-card" style="padding:var(--space-4);margin-bottom:var(--space-3)">
    <div class="flex justify-between items-center" style="margin-bottom:10px">
      <div>
        <strong>${esc(g.records[0].displayName || "(no name)")}</strong>
        <span class="text-muted" style="margin-left:8px;font-size:12px">${esc(label)}</span>
      </div>
      <div class="flex gap-2">
        ${reviewed ? `<span class="badge status-complete">Reviewed</span><button class="btn sm ghost" data-action="unreview-group" data-key="${esc(g.key)}">Undo</button>`
          : `<button class="btn sm" data-action="review-group" data-key="${esc(g.key)}" title="Not a duplicate, or already handled">Mark Reviewed</button>`}
      </div>
    </div>
    ${reasonHtml}
    ${body}
  </div>`;
}

function renderHistoryList() {
  let entries = Store.changeLog;
  if (historyState.uidFilter) entries = entries.filter((e) => e.uid === historyState.uidFilter);
  if (historyState.sheetFilter) entries = entries.filter((e) => e.sheetId === historyState.sheetFilter);
  if (historyState.actionFilter) entries = entries.filter((e) => e.action === historyState.actionFilter);

  const total = entries.length;
  const totalPages = Math.max(1, Math.ceil(total / historyState.pageSize));
  historyState.page = Math.min(historyState.page, totalPages);
  const pageRows = entries.slice((historyState.page - 1) * historyState.pageSize, historyState.page * historyState.pageSize);

  document.getElementById("hist-count").textContent = `${fmtNum(total)} change${total === 1 ? "" : "s"}`;

  const region = document.getElementById("history-list-region");

    region.innerHTML = `<div class="card">${emptyStateHtml("No changes yet", "Once someone edits a record, marks something complete, imports data, or reviews a duplicate, it'll show up here.")}</div>`;

  }
  region.innerHTML = `

}
function formatHistoryTs(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return sameDay ? `Today, ${time}` : `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}, ${time}`;
}

function exportSheetToExcel(sheetId) {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const cfg = SHEET_BY_ID[sheetId];
  const rows = getAllRecords().filter((r) => r.sheetId === sheetId).map((r) => r.data);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  XLSX.writeFile(wb, `${cfg.label.replace(/[^\w\- ]/g, "")}.xlsx`);
  toast("Exported " + cfg.label);
}
function exportRawDataToExcel() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  let records = getAllRecords();
  if (rawDataState.groupFilter !== "all") records = records.filter((r) => SHEET_BY_ID[r.sheetId].group === rawDataState.groupFilter);
  if (rawDataState.sourceFilter) records = records.filter((r) => r.sheetId === rawDataState.sourceFilter);
  const rows = records.map((r) => ({ "Source Tab": SHEET_BY_ID[r.sheetId].label, ...r.data, Status: STATUS_META[r.status].label }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Raw Data Export");
  XLSX.writeFile(wb, "raw_data_export.xlsx");
  toast("Exported raw data");
}
function exportAllToExcel() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const wb = XLSX.utils.book_new();
  for (const cfg of SHEET_CONFIG) {
    const rows = getAllRecords().filter((r) => r.sheetId === cfg.id).map((r) => r.data);
    if (!rows.length) continue;
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  }
  XLSX.writeFile(wb, "dg_master_pt_list_export.xlsx");
  toast("Exported full workbook");
}
function exportAllToCsv() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const rows = getAllRecords().map((r) => ({ "Source Tab": SHEET_BY_ID[r.sheetId].label, ...r.data, Status: STATUS_META[r.status].label }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const csv = XLSX.utils.sheet_to_csv(ws);
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dg_master_pt_list_export.csv";
  a.click();
  toast("Exported CSV");
}

const importWizard = { step: 1, workbook: null, sheetNames: [], selectedSheet: null, targetId: null, incomingHeaders: [], incomingRows: [], mapping: {}, fileName: "" };

function resetWizard() {
  Object.assign(importWizard, { step: 1, workbook: null, sheetNames: [], selectedSheet: null, targetId: null, incomingHeaders: [], incomingRows: [], mapping: {}, fileName: "" });
}

function openImportWizard() {
  resetWizard();
  const { view, query } = parseHash();
  if (query.target) importWizard.targetId = query.target;
  renderWizardModal();
}

function renderWizardModal() {
  const steps = ["Choose File", "Select Sheet & Target", "Map Columns", "Preview & Confirm"];
  const modal = openModal(`
    <div class="modal-header">
      <div><h3>Import Records from Excel</h3><p>Step ${importWizard.step} of 4</p></div>
    </div>
    <div class="modal-body">
      <div class="wizard-steps">
        ${steps.map((s, i) => `
          <div class="wizard-step ${importWizard.step === i + 1 ? "active" : importWizard.step > i + 1 ? "done" : ""}">
            <span class="num">${importWizard.step > i + 1 ? "✓" : i + 1}</span><span>${esc(s)}</span>
          </div>
          ${i < steps.length - 1 ? `<div class="wizard-connector"></div>` : ""}
        `).join("")}
      </div>
      <div id="wizard-step-body"></div>
    </div>
    <div class="modal-footer" id="wizard-footer"></div>
  `, { wide: true });
  renderWizardStep();
}

function renderWizardStep() {
  const body = document.getElementById("wizard-step-body");
  const footer = document.getElementById("wizard-footer");
  if (importWizard.step === 1) {
    body.innerHTML = `
      <div class="dropzone" id="dropzone">
        ${uploadIconIllus()}
        <div style="font-weight:600;color:var(--text-primary);margin-bottom:4px">Click to choose an Excel file</div>
        <div style="font-size:12px">.xlsx or .xls — the file never leaves your browser</div>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none" />
      </div>
      <div id="file-status" class="mt-4"></div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-cancel">Cancel</button><button class="btn primary" id="wiz-next" disabled>Next</button>`;
    footer.querySelector("#wiz-cancel").addEventListener("click", closeModal);
    const dz = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    dz.addEventListener("click", () => fileInput.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag-over"); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener("change", (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

    function handleFile(file) {
      if (typeof XLSX === "undefined") { toast("Excel library did not load (no internet access?)", "error"); return; }
      importWizard.fileName = file.name;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const wb = XLSX.read(ev.target.result, { type: "array", cellDates: true });
          importWizard.workbook = wb;
          importWizard.sheetNames = wb.SheetNames;
          document.getElementById("file-status").innerHTML = `<div class="badge status-complete">✓ ${esc(file.name)} — ${wb.SheetNames.length} worksheet(s) found</div>`;
          footer.querySelector("#wiz-next").disabled = false;
        } catch (err) {
          document.getElementById("file-status").innerHTML = `<div class="badge status-needs-attention">Could not read this file: ${esc(err.message)}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    }
    footer.querySelector("#wiz-next").addEventListener("click", () => { importWizard.step = 2; renderWizardStep(); updateWizardChrome(); });
  }

  else if (importWizard.step === 2) {
    body.innerHTML = `
      <div class="form-group">
        <label>Which worksheet has the data you want to import?</label>
        <select id="wiz-sheet-select">
          <option value="">— choose a worksheet —</option>
          ${importWizard.sheetNames.map((n) => `<option value="${esc(n)}" ${importWizard.selectedSheet === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
        </select>
      </div>
      <div class="form-group">
        <label>Which tab should these records be added to?</label>
        <select id="wiz-target-select">
          <option value="">— choose a destination tab —</option>
          ${SHEET_CONFIG.filter((s) => !s.isReference).map((s) => `<option value="${s.id}" ${importWizard.targetId === s.id ? "selected" : ""}>${esc(s.label)}</option>`).join("")}
        </select>
      </div>
      <div id="wiz-preview-mini"></div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-back">Back</button><button class="btn primary" id="wiz-next" disabled>Next</button>`;
    footer.querySelector("#wiz-back").addEventListener("click", () => { importWizard.step = 1; renderWizardStep(); updateWizardChrome(); });
    const checkReady = () => { footer.querySelector("#wiz-next").disabled = !(importWizard.selectedSheet && importWizard.targetId); };
    document.getElementById("wiz-sheet-select").addEventListener("change", (e) => {
      importWizard.selectedSheet = e.target.value || null;
      if (importWizard.selectedSheet) {
        const ws = importWizard.workbook.Sheets[importWizard.selectedSheet];
        // cellDates:true (set at XLSX.read) turns date-formatted cells into real JS Date
        // objects here instead of raw Excel serial numbers — format them to plain
        // M/D/YYYY text now so nothing downstream ever sees a number like "45932".
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" }).map((row) => {
          const out = {};
          for (const [k, v] of Object.entries(row)) out[k] = v instanceof Date ? formatJsDate(v) : v;
          return out;
        });
        importWizard.incomingRows = rows;
        importWizard.incomingHeaders = rows.length ? Object.keys(rows[0]) : [];
        document.getElementById("wiz-preview-mini").innerHTML = `<p class="form-hint">${rows.length} row(s) found, ${importWizard.incomingHeaders.length} column(s): ${importWizard.incomingHeaders.slice(0, 8).map(esc).join(", ")}${importWizard.incomingHeaders.length > 8 ? "…" : ""}</p>`;
      }
      checkReady();
    });
    document.getElementById("wiz-target-select").addEventListener("change", (e) => { importWizard.targetId = e.target.value || null; checkReady(); });
    // If the sheet/target dropdowns already show a value when this step first
    // renders (auto-picked, or pre-filled via a "?target=" link), no native
    // "change" event fires for it, so the state above never gets populated
    // and Next stays stuck disabled. Force both listeners to run once for
    // whatever's currently showing, so this works whether the user actually
    // clicks a dropdown option or it was already selected for them.
    ["wiz-sheet-select", "wiz-target-select"].forEach((id) => {
      const el = document.getElementById(id);
      if (el.value) el.dispatchEvent(new Event("change"));
    });
    checkReady();
    footer.querySelector("#wiz-next").addEventListener("click", () => {
      // Falls back to the incoming file's own headers when the target sheet
      // has no base data loaded yet (e.g. importing before the one-time
      // roster seed has run) — 1:1 column mapping instead of a hard crash.
      importWizard.mapping = importAutoMap(importWizard.targetId, importWizard.incomingHeaders, importWizard.incomingHeaders);
      importWizard.step = 3;
      renderWizardStep();
      updateWizardChrome();
    });
  }

  else if (importWizard.step === 3) {
    const targets = importTargets(importWizard.targetId, importWizard.incomingHeaders);
    const matchedCount = Object.values(importWizard.mapping).filter(Boolean).length;
    body.innerHTML = `
      <p class="form-hint" style="margin-bottom:12px">${matchedCount} / ${importWizard.incomingHeaders.length} incoming columns matched automatically. Review and adjust below — columns set to "Do not import" are skipped.</p>
      <table class="mapping-table">
        <thead><tr><th>Incoming Column</th><th></th><th>Maps To</th><th>Status</th></tr></thead>
        <tbody>
          ${importWizard.incomingHeaders.map((h) => `
            <tr>
              <td>${esc(h)}</td>
              <td>→</td>
              <td>
                <select data-map-col="${esc(h)}">
                  <option value="">Do not import</option>
                  ${targets.map((t) => `<option value="${esc(t.key)}" ${importWizard.mapping[h] === t.key ? "selected" : ""}>${esc(importTargetText(t))}</option>`).join("")}
                </select>
              </td>
              <td>${importWizard.mapping[h] ? `<span class="badge status-complete">Matched</span>` : `<span class="badge status-not-started">Skipped</span>`}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      <div class="mt-4">
        ${targets.filter((t) => !Object.values(importWizard.mapping).includes(t.key)).length ? `<p class="form-hint">Target columns with no incoming match (will stay blank for imported rows): ${targets.filter((t) => !Object.values(importWizard.mapping).includes(t.key)).map((t) => esc(t.label)).join(", ")}</p>` : ""}
      </div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-back">Back</button><button class="btn primary" id="wiz-next">Next: Preview</button>`;
    footer.querySelector("#wiz-back").addEventListener("click", () => { importWizard.step = 2; renderWizardStep(); updateWizardChrome(); });
    body.querySelectorAll("[data-map-col]").forEach((sel) => {
      sel.addEventListener("change", (e) => {
        importWizard.mapping[sel.dataset.mapCol] = e.target.value;
        renderWizardStep();
      });
    });
    footer.querySelector("#wiz-next").addEventListener("click", () => { importWizard.step = 4; renderWizardStep(); updateWizardChrome(); });
  }

  else if (importWizard.step === 4) {
    const cfg = SHEET_BY_ID[importWizard.targetId];
    const mappedRows = importWizard.incomingRows.map((row) => {
      const out = {};
      for (const [src, dest] of Object.entries(importWizard.mapping)) {
        if (dest) out[dest] = String(row[src] ?? "");
      }
      return out;
    });
    const existing = getExistingIdentitySetForSheet(importWizard.targetId);
    let dupCount = 0;
    for (const row of mappedRows) {
      const identity = computeImportRowIdentity(cfg, row);
      if (identity && existing.has(identity)) dupCount++;
    }
    const newCount = mappedRows.length - dupCount;
    body.innerHTML = `
      <div class="import-summary-grid">
        <div class="summary-stat"><div class="num">${mappedRows.length}</div><div class="lbl">Records Found</div></div>
        <div class="summary-stat good"><div class="num">${newCount}</div><div class="lbl">New Records</div></div>
        <div class="summary-stat ${dupCount ? "warn" : ""}"><div class="num">${dupCount}</div><div class="lbl">Potential Duplicates</div></div>
        <div class="summary-stat"><div class="num">${Object.values(importWizard.mapping).filter(Boolean).length}</div><div class="lbl">Columns Matched</div></div>
      </div>
      ${dupCount ? `
      <div class="form-group">
        <label>How should duplicates be handled?</label>
        <select id="dup-handling">
          <option value="skip">Skip exact duplicates (import ${newCount} new only)</option>
          <option value="all">Import all ${mappedRows.length} records anyway</option>
        </select>
      </div>` : ""}
      <p class="form-hint">Preview of the first 5 mapped rows:</p>
      <div class="data-table-wrap" style="max-height:220px">
        <table class="data-table">
          <thead><tr>${Object.values(importWizard.mapping).filter(Boolean).map((h) => `<th>${esc(colLabelFor(importWizard.targetId, h))}</th>`).join("")}</tr></thead>
          <tbody>${mappedRows.slice(0, 5).map((r) => `<tr>${Object.values(importWizard.mapping).filter(Boolean).map((h) => `<td>${esc(r[h])}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-back">Back</button><button class="btn danger" id="wiz-do-cancel">Cancel Import</button><button class="btn primary" id="wiz-confirm">Import ${newCount || mappedRows.length} Record(s)</button>`;
    footer.querySelector("#wiz-back").addEventListener("click", () => { importWizard.step = 3; renderWizardStep(); updateWizardChrome(); });
    footer.querySelector("#wiz-do-cancel").addEventListener("click", closeModal);
    footer.querySelector("#wiz-confirm").addEventListener("click", () => {
      const skipDup = document.getElementById("dup-handling") ? document.getElementById("dup-handling").value === "skip" : true;
      const result = commitImport(importWizard.targetId, mappedRows, { skipDuplicates: skipDup, fileName: importWizard.fileName });
      toast(`Imported ${result.added} record(s)${result.skipped ? `, skipped ${result.skipped} duplicate(s)` : ""}`);
      closeModal();
      render();
    });
  }
}
function updateWizardChrome() {
  const modal = document.querySelector("#active-modal .modal");
  if (!modal) return;
  modal.querySelector(".modal-header p").textContent = `Step ${importWizard.step} of 4`;
  modal.querySelectorAll(".wizard-step").forEach((el, i) => {
    el.classList.toggle("active", importWizard.step === i + 1);
    el.classList.toggle("done", importWizard.step > i + 1);
    el.querySelector(".num").textContent = importWizard.step > i + 1 ? "✓" : String(i + 1);
  });
}
function uploadIconIllus() { return `<div class="icon">${'<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M6 10l6-6 6 6M4 20h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'}</div>`; }

// ============================================================================
// CALL LIST – UPCOMING APPOINTMENT (workflow view)
//
// Everything on this page is derived from the record data itself, so totals,
// percentages, statuses, flags and reminders can never drift out of sync:
//   Action (existing column)  -> Call / Called & Confirmed / Called & Refused / Resched / In Progress
//   Call Attempt, Call Note   -> only used while Action = In Progress
//   Reminder Date             -> only used when Call Note = For Callback
//   Resched Date              -> only used when Action = Resched
//   Team Member (existing)    -> blank = Pending Assignment, filled = Assigned
//   Next Scheduled Visit      -> within 7 days and no completed outcome = Needs Attention
// These extra fields are saved through the same shared "edited row" channel as
// every other inline edit, so they sync to all users with no backend change.
// ============================================================================
let CALL_SHEET_ID = "call_list_upcoming";
let clLastSheet = "call_list_upcoming";
function clPageTitle(cfg) { return cfg.subOf && SHEET_BY_ID[cfg.subOf] ? SHEET_BY_ID[cfg.subOf].label : cfg.label; }
function clToggleIds(cfg) {
  const root = cfg.subOf || cfg.id;
  const ids = [root].concat(SHEET_CONFIG.filter((c) => c.subOf === root).map((c) => c.id));
  return ids.length > 1 ? ids : [];
}
function clToggleHtml(cfg) {
  const ids = clToggleIds(cfg);
  if (!ids.length) return "";
  const counts = {};
  getAllRecords().forEach((r) => { counts[r.sheetId] = (counts[r.sheetId] || 0) + 1; });
  return `<div class="cl-days cl-view-toggle" id="cl-view-toggle" role="group" aria-label="Switch between insurance types">${ids.map((id) => `<button type="button" class="cl-day" data-view-sheet="${esc(id)}" aria-pressed="${id === cfg.id}"><span>${esc(SHEET_BY_ID[id].toggleLabel || SHEET_BY_ID[id].label)}</span><b>${fmtNum(counts[id] || 0)}</b></button>`).join("")}</div>`;
}
function isInfusionId(id) { return id === "dg_infusion_pas" || id === "dg_infusion_other"; }
function isCallSheet(id) { return id === "call_list_upcoming" || id === "call_list_no_upcoming" || isInfusionId(id) || !!ASSIGN_TABS[id] || id === "dg_osteoporosis_pas"; }
// Tabs whose Status is simply Assigned (data in the column) / Unassigned (blank). Value = the assignment column.
const ASSIGN_TABS = { dg_pharmacy: "Assigned To", ra: "Assigned to", seronegative_ra: "Assigned to", psoriatic_arthritis: "Assigned to", psoriasis: "Assigned to", pmr: "Assigned to", gca: "Assigned to", pseudogout: "REFER TO USMANI AND APPS", polymyositis: "REFER TO USMANI", psa_and_psoriasis: "Assigned To", osteoporosis: "Assigned to", gout: "REFER TO AFD AND APPS", all_other_dx: "Refer To", pts_0908_0911: "Assigned to" };
// Tabs whose "assigned" state is a referral column. yes = only a Yes counts (blank/No = Unassigned).
const ASSIGN_META = {
  pseudogout: { yes: true, label: "Referred to Usmani and Apps", short: "referred", suggest: ["Yes", "No"],
    desc: "Enter Yes in REFER TO USMANI AND APPS for each patient referred. Status: Assigned when Yes; Unassigned when blank or No." },
  psa_and_psoriasis: { yes: false, label: "Assigned", short: "assigned", suggest: ["AFD", "APPS"],
    desc: "Enter AFD or APPS in Assigned To; use Split unassigned to divide the blank ones between AFD and APPS. Highlights: a row is yellow when it is high priority or not yet assigned." },
  pts_0908_0911: { yes: false, label: "Assigned", short: "assigned", suggest: [],
    desc: "Use the day buttons to split the list by clinic day (Tuesday 9/8, Wednesday 9/9 ...). Enter a name in Assigned to; status follows it. If DEXA >1year is Yes, add a DEXA to the appointment." },
  all_other_dx: { yes: false, label: "Assigned", short: "assigned", suggest: [], noun: "Diagnoses",
    desc: "Enter who to refer to for each diagnosis in Refer To. Status: Assigned once Refer To has data; Unassigned while blank." },
  gout: { yes: false, label: "Assigned", short: "assigned", suggest: [],
    desc: "Enter data in REFER TO AFD AND APPS for each patient. Status: Assigned once it has data; Unassigned while blank." },
  polymyositis: { yes: false, label: "Referred to Usmani", short: "referred", suggest: [],
    desc: "Enter data in REFER TO USMANI for each patient referred. Status: Assigned once it has data; Unassigned while blank." },
};
function clAssignMeta() { return ASSIGN_META[CALL_SHEET_ID] || null; }
function clIsPsa() { return CALL_SHEET_ID === "psa_and_psoriasis"; }
function psaInsuranceNote(data) {
  if (!clIsPsa()) return "";
  const insurance = String(data?.["current insurance"] || "").trim();
  if (/\bmedicare\b/i.test(insurance)) return "Note: Refer to Usmani";
  if (/\bregence\b/i.test(insurance)) return "Note: DO NOT ASSIGN TO USMANI";
  return "";
}
function clIsDays() { return !!(SHEET_BY_ID[CALL_SHEET_ID] && SHEET_BY_ID[CALL_SHEET_ID].dayGroups); }
function clIsDexaCol(c) { const t = String(c).trim().toLowerCase(); return clIsDays() && biList("dexa", "col").some((w) => t.startsWith(w)); }
function clDexaYes(v) { return biMatch("dexa", "yes", "lead", v); }
// Clinic month & year (e.g. "October 2026"), worked out from a date column. Built in for DG Osteoporosis PAs (NEXT APPT);
// the Admin page can point any tab at any date column, or switch it off.
const CL_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function clMonthCol() {
  const r = ((AC().rules || {})[CALL_SHEET_ID]) || {};
  if (r.monthCol === "none") return "";
  if (r.monthCol) return r.monthCol;
  return clIsOsteo() ? OP.NEXT : "";
}
function clMonthInfo(data) {
  const col = clMonthCol();
  if (!col) return null;
  const d = parseDateLoose(data[col]);
  if (!d) return null;
  return { key: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), label: CL_MONTHS[d.getMonth()] + " " + d.getFullYear(), sort: d.getFullYear() * 12 + d.getMonth() };
}
function clMonthScoped(rows) {
  if (!clState.month || !clMonthCol()) return rows;
  if (clState.month === "none") return rows.filter((r) => !clMonthInfo(r.data));
  return rows.filter((r) => { const m = clMonthInfo(r.data); return !!m && m.key === clState.month; });
}
function clMonthList() {
  const map = new Map();
  let none = 0;
  const recs = clRecords();
  recs.forEach((r) => {
    const m = clMonthInfo(r.data);
    if (!m) { none++; return; }
    const cur = map.get(m.key);
    if (cur) cur.n++; else map.set(m.key, { key: m.key, label: m.label, sort: m.sort, n: 1 });
  });
  return { months: [...map.values()].sort((a, b) => a.sort - b.sort), none, total: recs.length };
}
function clMonthsHtml() {
  if (!clMonthCol()) return "";
  const { months, none, total } = clMonthList();
  const btn = (key, label, n) => `<button type="button" class="cl-day" data-month="${esc(key)}" aria-pressed="${clState.month === key}"><span>${esc(label)}</span><b>${fmtNum(n)}</b></button>`;
  return btn("", "All months", total) + months.map((m) => btn(m.key, m.label, m.n)).join("") + (none ? btn("none", "No date", none) : "");
}
function clDayScoped(rows) {
  rows = clMonthScoped(rows);
  if (!clIsDays() || !clState.day) return rows;
  if (clState.day === "none") return rows.filter((r) => !r.day);
  return rows.filter((r) => r.day && r.day.key === clState.day);
}
function clDayList() {
  const map = new Map();
  let none = 0;
  const recs = clRecords();
  recs.forEach((r) => {
    if (!r.day) { none++; return; }

function callInfo(data) {

    const a = opAssign(data[CL.TEAM]);

    const assigned = !cancelled && a.key !== "none";
    const nd = parseDateLoose(data[OP.NEXT]);
    const days = nd ? clDaysFromToday(nd) : null;

    const status = cancelled ? "o-cancelled" : assigned ? "o-assigned" : flagged ? "attention" : "o-unassigned";

  }

    const own = String(data[CL_CORR_FIELD] || "").trim();
    const auto = own ? "" : acAutoText(data);
    const corrText = own || auto;
    const cst = String(data[CL_CORR_STATUS] || "").trim().toLowerCase();
    const corr = corrText ? (biMatch("corr", "notresolved", "has", cst) ? "notresolved" : biMatch("corr", "resolved", "has", cst) ? "resolved" : biMatch("corr", "progress", "has", cst) ? "progress" : "pending") : "";

    if (/prior auth|pa initiated/i.test(col)) return 220;
    if (col === cfg.acctField) return 110;
    if (col === cfg.nameField) return 220;
    if (/provider/i.test(col)) return 150;
    if (/appt/i.test(col)) return 175;
    if (col === CL.TEAM) return 150;
  }
  if (col === "__status") return 175;
  if (col === CL.ACTION) return 285;
  if (col === cfg.nameField) return 190;
  if (col === CL.TEAM) return 150;
  if (/note/i.test(col)) return 210;
  if (clIsDateCol(cfg, col)) return 140;

function clIsDateCol(cfg, col) {
  return (cfg.dateFields || []).includes(col) || clCustomColumns().some((c) => c.name === col && c.type === "date");
}
function clMoveColumn(cfg, from, to, after) {
  const cols = clColumns(cfg);
  const i = cols.indexOf(from);
  if (i < 0 || from === to) return;
  cols.splice(i, 1);
  let j = cols.indexOf(to);
  if (j < 0) return;
  if (after) j++;
  cols.splice(j, 0, from);
  const l = clLayoutLoad(); l.order = cols; clLayoutSave(l);
}

function clSortValue(r, col) {

  if (col === "__infusion") return gcaOnInfusion(r) ? "Yes" : "No";
  if (col === "__month") { const m = clMonthInfo(r.data); return m ? m.sort : 1e9; }
  if (col === CL.ACTION) return callPill(r.data).label;

      fields.some((f) => String(r.data[f] || "").toLowerCase().includes(q)) ||
      (clIsGeneric()
        ? String((STATUS_META[r.status] || {}).label || "").toLowerCase().includes(q)
        : callPill(r.data).label.toLowerCase().includes(q) || clAssignSt(r.data).label.toLowerCase().includes(q)));
  }
  if (clState.statusFilter) rows = rows.filter((r) => (String(clState.statusFilter).startsWith("cx-") ? acCardMatch(String(clState.statusFilter).slice(3), r.data) : clIsGeneric() ? r.status === clState.statusFilter : clStatusMatch(r.data, clState.statusFilter)));
  if (clState.remindFilter) rows = rows.filter((r) => callReminder(r.data)?.state === clState.remindFilter);
