<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DG Master Patient List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root {
  --burgundy-50: #fbf2f3;
  --burgundy-100: #f3dde0;
  --burgundy-200: #e5b7bd;
  --burgundy-500: #8f2a3c;
  --burgundy-600: #7a2233;
  --burgundy-700: #641b29;
  --burgundy-900: #3d0f18;

  --ink-900: #1a1d23;
  --ink-800: #262a33;
  --ink-700: #3a3f4b;
  --ink-600: #565c6a;
  --ink-500: #6b7182;
  --ink-400: #8b90a0;
  --ink-300: #b0b4c0;
  --ink-200: #d8dae1;
  --ink-100: #eceef2;
  --ink-50: #f6f7f9;

  --white: #ffffff;

  --status-complete: #1e7d4b;
  --status-complete-bg: #e5f5ec;
  --status-pending: #a06a12;
  --status-pending-bg: #fbf0dc;
  --status-attention: #b3312c;
  --status-attention-bg: #fbe6e5;
  --status-progress: #2261b0;
  --status-progress-bg: #e6effa;
  --status-neutral: #6b7182;
  --status-neutral-bg: #eceef2;

  --bg-app: #f5f4f6;
  --bg-surface: var(--white);
  --bg-sunken: var(--ink-50);
  --border-subtle: var(--ink-200);
  --border-strong: var(--ink-300);

  --text-primary: var(--ink-900);
  --text-secondary: var(--ink-600);
  --text-tertiary: var(--ink-400);
  --text-on-accent: var(--white);
  --accent: var(--burgundy-600);
  --accent-hover: var(--burgundy-700);
  --accent-soft: var(--burgundy-50);
  --accent-soft-border: var(--burgundy-200);

  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-sm: 0 1px 2px rgba(26, 29, 35, 0.06);
  --shadow-md: 0 4px 16px rgba(26, 29, 35, 0.08), 0 1px 2px rgba(26, 29, 35, 0.06);
  --shadow-lg: 0 12px 32px rgba(26, 29, 35, 0.14), 0 2px 6px rgba(26, 29, 35, 0.08);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  --sidebar-w: 280px;
  --topbar-h: 60px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg-app);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
button { font-family: inherit; }
::selection { background: var(--accent-soft-border); }

a { color: var(--accent); text-decoration: none; }
a.link-inline { text-decoration: underline; }
a.link-inline:hover { color: var(--accent-hover); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-400); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
#app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  height: 100vh;
  grid-template-areas: "sidebar topbar" "sidebar main";
}

.topbar {
  grid-area: topbar;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-5);
  z-index: 5;
}

.topbar-search {
  flex: 1;
  max-width: 520px;
  position: relative;
}
.topbar-search input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-sunken);
  font-size: 13.5px;
  color: var(--text-primary);
  transition: border-color 160ms var(--ease-out), background 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
}
.topbar-search input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.topbar-search .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}

.topbar-right { display: flex; align-items: center; gap: var(--space-3); margin-left: auto; }

.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 140ms var(--ease-out), transform 160ms var(--ease-out), color 140ms var(--ease-out);
  position: relative;
}
.icon-btn:hover { background: var(--ink-100); color: var(--text-primary); }
.icon-btn:active { transform: scale(0.93); }
.icon-btn .badge-dot {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--status-attention);
  border: 1.5px solid var(--bg-surface);
}

.sidebar {
  grid-area: sidebar;
  background: var(--ink-900);
  color: var(--ink-200);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-brand {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-5);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.sidebar-brand .mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--burgundy-500), var(--burgundy-700));
  display: grid; place-items: center;
  color: white; font-weight: 700; font-size: 14px;
  flex-shrink: 0;
}
.sidebar-brand .name { font-weight: 600; font-size: 14.5px; color: white; letter-spacing: -0.01em; }
.sidebar-brand .subname { font-size: 11px; color: var(--ink-400); }

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-3) var(--space-3) var(--space-6);
}

.nav-group { margin-top: var(--space-5); }
.nav-group:first-child { margin-top: var(--space-2); }
.nav-group-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-500);
  padding: 0 var(--space-3);
  margin-bottom: var(--space-2);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 8px var(--space-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-200);
  font-size: 13px;
  transition: background 140ms var(--ease-out), color 140ms var(--ease-out);
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
.nav-item.active {
  background: rgba(143, 42, 60, 0.35);
  color: white;
  border-color: rgba(191, 90, 107, 0.4);
}
.nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
.nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .nav-count {
  font-size: 10.5px;
  color: var(--ink-400);
  background: rgba(255,255,255,0.08);
  padding: 1px 6px;
  border-radius: 20px;
  flex-shrink: 0;
}
.nav-item.active .nav-count { background: rgba(255,255,255,0.18); color: white; }
.nav-item .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

main.content {
  grid-area: main;
  overflow-y: auto;
  padding: var(--space-6) var(--space-8) var(--space-10);
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 12.5px;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
}
.breadcrumbs a { color: var(--text-tertiary); text-decoration: none; cursor: pointer; }
.breadcrumbs a:hover { color: var(--accent); }
.breadcrumbs .sep { color: var(--ink-300); }
.breadcrumbs .current { color: var(--text-secondary); font-weight: 500; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; color: var(--text-primary); }
.page-subtitle { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; max-width: 640px; }
.page-header-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 160ms var(--ease-out), background 140ms var(--ease-out), border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  white-space: nowrap;
}
.btn:hover { background: var(--ink-50); border-color: var(--border-strong); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--status-attention); border-color: var(--status-attention-bg); }
.btn.danger:hover { background: var(--status-attention-bg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--ink-100); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
.btn svg { flex-shrink: 0; }

/* ==========================================================================
   CARDS / KPI
   ========================================================================== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}
@media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

/* Compact summary cards: tightened padding/gaps/type so the summary row takes
   noticeably less vertical space, leaving more of the table below visible
   without scrolling. */
.kpi-card {
  padding: 10px var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: box-shadow 180ms var(--ease-out), transform 180ms var(--ease-out);
}
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.kpi-card .kpi-top { display: flex; align-items: center; justify-content: space-between; }
.kpi-card .kpi-icon {
  width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  flex-shrink: 0;
}
.kpi-card .kpi-icon svg { width: 14px; height: 14px; }
.kpi-card .kpi-label { font-size: 10.5px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.kpi-card .kpi-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.15; }
.kpi-card .kpi-sub { font-size: 11px; color: var(--text-tertiary); }
.kpi-card .kpi-sub.positive { color: var(--status-complete); }
.kpi-card .kpi-sub.warn { color: var(--status-attention); }

.section {
  margin-bottom: var(--space-6);
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}
.section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.section-title .count { color: var(--text-tertiary); font-weight: 500; }

.two-col {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--space-5);
  align-items: start;
}
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }

/* ==========================================================================
   PROGRESS BARS / BADGES
   ========================================================================== */
.progress-track {
  height: 8px;
  background: var(--ink-100);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  border-radius: 20px;
  background: var(--accent);
  transition: width 400ms var(--ease-in-out);
}
.progress-fill.complete { background: var(--status-complete); }
.progress-fill.attention { background: var(--status-attention); }
.progress-fill.progress-mid { background: var(--status-progress); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.badge.status-complete { background: var(--status-complete-bg); color: var(--status-complete); }
.badge.status-pending { background: var(--status-pending-bg); color: var(--status-pending); }
.badge.status-needs-attention { background: var(--status-attention-bg); color: var(--status-attention); }
.badge.status-not-started { background: var(--status-neutral-bg); color: var(--status-neutral); }
.badge.status-in-progress { background: var(--status-progress-bg); color: var(--status-progress); }
.badge.status-needs-review { background: var(--status-attention-bg); color: var(--status-attention); }
.badge.neutral { background: var(--ink-100); color: var(--text-secondary); }
.badge.outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-secondary); }

/* ==========================================================================
   TAB OVERVIEW TABLE (dashboard)
   ========================================================================== */
.tab-overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tab-overview-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  font-weight: 700;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; background: var(--bg-surface);
}
.tab-overview-table td { padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.tab-overview-table tr:last-child td { border-bottom: none; }
.tab-overview-table tr.clickable { cursor: pointer; transition: background 120ms var(--ease-out); }
.tab-overview-table tr.clickable:hover { background: var(--bg-sunken); }
.tab-overview-table .tab-name-cell { font-weight: 600; color: var(--text-primary); }
.tab-overview-table .mini-progress { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.tab-overview-table .mini-progress .progress-track { flex: 1; }
.tab-overview-table .mini-progress .pct-label { font-size: 12px; font-weight: 600; width: 34px; text-align: right; color: var(--text-secondary); }

/* ==========================================================================
   ACTION ITEMS
   ========================================================================== */
.action-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out);
  margin-bottom: var(--space-2);
}
.action-item:last-child { margin-bottom: 0; }
.action-item:hover { background: var(--bg-sunken); border-color: var(--border-strong); }
.action-item .sev-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.action-item .sev-dot.high { background: var(--status-attention); }
.action-item .sev-dot.medium { background: var(--status-pending); }
.action-item .sev-dot.low { background: var(--status-progress); }
.action-item .text { flex: 1; font-size: 13px; color: var(--text-primary); }
.action-item .chevron { color: var(--text-tertiary); flex-shrink: 0; }

/* ==========================================================================
   EMPTY STATES
   ========================================================================== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-10) var(--space-6);
  color: var(--text-secondary);
}
.empty-state .icon { color: var(--ink-300); margin-bottom: var(--space-3); }
.empty-state .title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.empty-state .desc { font-size: 12.5px; color: var(--text-tertiary); max-width: 360px; }

/* ==========================================================================
   DATA TABLE (generic, used across sheet pages / raw data / search)
   ========================================================================== */
.table-toolbar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}
.table-search { position: relative; flex: 1; min-width: 220px; max-width: 340px; }
.table-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  font-size: 13px;
  background: var(--bg-surface);
  transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.table-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.table-search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }

.filter-select {
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  font-size: 12.5px;
  color: var(--text-secondary);
  cursor: pointer;
  max-width: 180px;
}
.filter-select:focus { outline: none; border-color: var(--accent); }

.data-table-wrap {
  overflow: auto;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  max-height: 62vh;
}
table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data-table th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg-sunken);
  text-align: left;
  padding: 7px 10px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-tertiary);
  font-weight: 700;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
table.data-table th:hover { color: var(--text-secondary); }
table.data-table th .sort-arrow { margin-left: 4px; opacity: 0.5; }
table.data-table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-primary);
  white-space: nowrap;
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
}
table.data-table tbody tr { transition: background 100ms var(--ease-out); }
table.data-table tbody tr:hover { background: var(--bg-sunken); }
table.data-table tbody tr:last-child td { border-bottom: none; }
table.data-table td.name-cell { font-weight: 600; cursor: pointer; color: var(--text-primary); }
table.data-table td.name-cell:hover { color: var(--accent); text-decoration: underline; }
table.data-table td.inline-cell { padding: 4px 6px; }
.inline-edit-input {
  width: 100%;
  min-width: 110px;
  border: 1px solid transparent;
  background: transparent;
  font: inherit;
  color: inherit;
  padding: 5px 7px;
  border-radius: var(--radius-sm);
  transition: border-color 140ms var(--ease-out), background 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.inline-edit-input:hover { background: var(--bg-sunken); border-color: var(--border-subtle); }
.inline-edit-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.inline-edit-input.just-saved { animation: inline-save-flash 900ms var(--ease-out); }
@keyframes inline-save-flash {
  0% { background: var(--status-complete-bg); }
  100% { background: transparent; }
}
table.data-table td.actions-cell { white-space: nowrap; }
table.data-table td.actions-cell .btn { padding: 4px 8px; }

/* Inline cell = text input + optional calendar-picker button, side by side */
.inline-cell-wrap { display: flex; align-items: center; gap: 2px; }
.inline-cell-wrap .inline-edit-input { min-width: 90px; }
td.inline-cell.name-col { max-width: 220px; }
td.inline-cell.name-col .inline-edit-input { min-width: 150px; font-weight: 600; }
.cal-btn {
  flex-shrink: 0;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border: none; background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  cursor: pointer;

//   1. Standalone (double-click index.html): everything saves to localStorage,

//      inside a Wix iframe.
//   2. Embedded on a Wix page (inside an HTML iframe / Custom Element widget):
//      writes are also sent up to the parent Wix page via postMessage, which
//      Velo page code relays to backend .jsw functions that persist to a
//      shared Wix Data collection — so every user sees the same data.
//
// store.js calls WixBridge.save(type, payload) instead of touching
// localStorage directly when WixBridge.enabled is true, and WixBridge.init()
// resolves with the shared server-side state on boot (or null if standalone).
// ============================================================================

  _reqId: 0,
  _pending: new Map(),
  _pollHandle: null,

  async init() {

    // (e.g. previewing the raw HTML file inside some other iframe), fall back
    // to plain localStorage rather than hanging forever.
    const state = await Promise.race([
      this._call("wixapp:init", {}),
      new Promise((resolve) => setTimeout(() => resolve(undefined), 2500)),

  // logged and surfaced as a toast, but never block the local UI since the
  // local copy (localStorage) is already the source of truth for this session.
  async save(type, payload) {

  _call(type, payload) {

      const reqId = ++this._reqId;

      window.parent.postMessage({ source: "dg-app", type, reqId, payload }, "*");

    ? parseAcctFromColonName(nameRaw)

  let skipped = 0;

  for (const row of rows) {
    const identity = computeImportRowIdentity(cfg, row);
    if (options.skipDuplicates && identity && existing.has(identity)) {
      skipped++;
      continue;

    toAdd.push(row);
    if (identity) existing.add(identity);

  invalidateDupCache();

    sheetId, action: "import",
    summary: `Imported ${toAdd.length} record(s) into ${cfg.label}${options.fileName ? ` from "${options.fileName}"` : ""}${skipped ? ` (${skipped} skipped as duplicates)` : ""}`,

  invalidateCache();
  invalidateDupCache();
  WixBridge.save("editedRow", { uid, patch: Store.editedRows[uid] });

  const label = SHEET_BY_ID[sheetId]?.label || sheetId;

  invalidateDupCache();
  WixBridge.save("deletedRow", { uid, deleted: false });

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------

function getDashboardStats() {
  const records = getAllRecords();
  const patientSheets = SHEET_CONFIG.filter((s) => !s.isReference);
  const totalRecords = records.length;

  const identityKeys = new Set(records.filter((r) => r.identityKey).map((r) => r.identityKey));
  const totalUniquePatients = identityKeys.size;

  const dupIdx = computeDuplicateIndex();
  const duplicateRecordCount =

    dupIdx.potentialDuplicates.reduce((s, g) => s + g.records.length, 0);

    totalRecords,
    totalUniquePatients,
    duplicateRecordCount,
    totalTabs: patientSheets.length,
    completedTabs,

}

    items.push({
      id: "dup-exact",
      severity: "high",
      text: `${unreviewedExact.reduce((s, g) => s + g.records.length, 0)} exact duplicate record(s) across ${unreviewedExact.length} group(s) need review`,
      route: { view: "duplicates" },

  }
  if (unreviewedPotential.length) {
    items.push({
      id: "dup-potential",
      severity: "medium",
      text: `${unreviewedPotential.reduce((s, g) => s + g.records.length, 0)} potential duplicate record(s) across ${unreviewedPotential.length} group(s) need review`,
      route: { view: "duplicates" },
    });
  }

  const specialPendingText = {
    call_list_upcoming: (n) => `${n} patient(s) with an upcoming appointment have not been called yet`,
    call_list_no_upcoming: (n) => `${n} patient(s) with no upcoming appointment still need a letter or follow-up`,
  };

  for (const cfg of SHEET_CONFIG) {
    if (cfg.isReference) continue;
    const stats = getSheetStats(cfg.id);
    if (stats.needsAttention > 0) {
      items.push({

        text: `${stats.needsAttention} record(s) in ${cfg.label} are flagged and need attention`,
        route: { view: "sheet", sheetId: cfg.id },

    if ((cfg.completion.mode === "nonblank" || cfg.completion.mode === "value-not-equal") && stats.remaining > 0) {

      items.push({
        id: "pending-" + cfg.id,
        severity: cfg.id === "call_list_upcoming" ? "high" : "medium",
        text,
        route: { view: "sheet", sheetId: cfg.id },
      });

    const cfg = SHEET_BY_ID[r.sheetId];
    return cfg.phoneField && cfg.nameField && r.displayName && !r.data[cfg.phoneField];

      text: `${missingPhone.length} patient record(s) are missing a phone number`,

        <div class="section">

        <div class="card chart-card"><div class="section-title" style="margin-bottom:12px">Completion % by Tab</div><canvas id="chart-completion-by-tab"></canvas></div>

        <div class="card chart-card"><div class="section-title" style="margin-bottom:12px">Duplicate Records by Tab</div><canvas id="chart-dup-by-tab"></canvas></div>

}
function kpiCard(k) {

    <div class="kpi-top"><span class="kpi-label">${esc(k.label)}</span><span class="kpi-icon">${kpiIconSvg(k.icon)}</span></div>

}
function kpiIconSvg(name) {

    users: '<circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 8.5a3 3 0 1 1 3.8 2.9M21 20c0-2.5-1.7-4.6-4-5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="2"/>',
    check: '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M8.5 12.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  };
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none">${paths[name] || ""}</svg>`;
}
function uploadIconSvg() { return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M6 10l6-6 6 6M4 20h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function dbIconSvg() { return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="2"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" stroke="currentColor" stroke-width="2"/></svg>`; }

function tabOverviewRow(s) {
  const cfg = SHEET_BY_ID[s.id];
  const untracked = s.sheetStatus === "untracked";
  const barClass = s.pct === 100 ? "complete" : s.pct >= 60 ? "progress-mid" : "";
  return `<tr class="clickable" onclick="navigate('sheet/${s.id}')">
    <td class="tab-name-cell">${esc(cfg.label)}</td>
    <td>${s.total}</td>
    <td>
      <div class="mini-progress">

        <span class="pct-label">${untracked ? "—" : s.pct + "%"}</span>
      </div>
    </td>
    <td>${s.dupCount ? `<span class="badge status-needs-attention">${s.dupCount}</span>` : `<span class="text-muted">0</span>`}</td>
    <td>${tabStatusBadge(s.sheetStatus)}</td>
  </tr>`;
}
function tabStatusBadge(status) {
  const map = {
    complete: ["status-complete", "Complete"],
    "in-progress": ["status-in-progress", "In Progress"],
    "needs-attention": ["status-needs-attention", "Needs Attention"],
    untracked: ["status-not-started", "Manual Tracking"],
    reference: ["neutral", "Reference"],
  };
  const [cls, label] = map[status] || map.untracked;
  return `<span class="badge ${cls}">${label}</span>`;
}
function actionItemRow(item) {
  const href = item.route.view === "sheet" ? `#/sheet/${item.route.sheetId}` : `#/${item.route.view}`;
  return `<a class="action-item" href="${href}" style="text-decoration:none">
    <span class="sev-dot ${item.severity}"></span>
    <span class="text">${esc(item.text)}</span>
    <span class="chevron">${chevronSvg()}</span>
  </a>`;
}
function chevronSvg() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function emptyStateHtml(title, desc) {
  return `<div class="empty-state">${emptyIcon()}<div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div></div>`;
}

function initDashboardCharts() {
  if (typeof Chart === "undefined") {
    const region = document.getElementById("charts-region");
    if (region) {
      region.style.gridTemplateColumns = "1fr";
      region.innerHTML = `<div class="card">${emptyStateHtml("Charts unavailable offline", "The charting library couldn't load (no internet access). Everything else in this app still works fully offline.")}</div>`;
    }
    return;
  }
  const stats = getDashboardStats();
  const palette = ["#8f2a3c", "#2261b0", "#a06a12", "#1e7d4b", "#6b7182", "#b3312c", "#4c3b8f", "#0f766e", "#9a3412", "#334155"];
  Chart.defaults.font.family = "Inter, system-ui, sans-serif";
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = "#6b7182";

  const recCtx = document.getElementById("chart-records-by-tab");
  if (recCtx) {
    activeCharts.push(new Chart(recCtx, {
      type: "bar",
      data: {
        labels: stats.perSheet.map((s) => SHEET_BY_ID[s.id].shortLabel),
        datasets: [{ data: stats.perSheet.map((s) => s.total), backgroundColor: "#8f2a3c", borderRadius: 4, maxBarThickness: 22 }],
      },
      options: baseBarOptions(),
    }));
  }
  const compCtx = document.getElementById("chart-completion-by-tab");
  if (compCtx) {
    const trackable = stats.perSheet.filter((s) => s.sheetStatus !== "untracked");
    activeCharts.push(new Chart(compCtx, {
      type: "bar",
      data: {
        labels: trackable.map((s) => SHEET_BY_ID[s.id].shortLabel),
        datasets: [{ data: trackable.map((s) => s.pct), backgroundColor: "#2261b0", borderRadius: 4, maxBarThickness: 22 }],
      },
      options: { ...baseBarOptions(), scales: { ...baseBarOptions().scales, y: { max: 100, ticks: { callback: (v) => v + "%" } } } },
    }));
  }
  const dxCtx = document.getElementById("chart-diagnosis");
  if (dxCtx) {
    const counts = {};
    for (const cfg of SHEET_CONFIG) {
      if (!cfg.diagnosisLabel) continue;
      counts[cfg.diagnosisLabel] = getSheetStats(cfg.id).total;
    }
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    activeCharts.push(new Chart(dxCtx, {
      type: "doughnut",
      data: { labels: entries.map((e) => e[0]), datasets: [{ data: entries.map((e) => e[1]), backgroundColor: palette, borderWidth: 2, borderColor: "#fff" }] },
      options: { plugins: { legend: { position: "right", labels: { boxWidth: 10, padding: 8 } } }, cutout: "62%" },
    }));
  }
  const dupCtx = document.getElementById("chart-dup-by-tab");
  if (dupCtx) {
    const withDups = stats.perSheet.filter((s) => s.dupCount > 0);
    if (withDups.length) {
      activeCharts.push(new Chart(dupCtx, {
        type: "bar",
        data: { labels: withDups.map((s) => SHEET_BY_ID[s.id].shortLabel), datasets: [{ data: withDups.map((s) => s.dupCount), backgroundColor: "#b3312c", borderRadius: 4, maxBarThickness: 22 }] },
        options: baseBarOptions(),
      }));
    } else {
      dupCtx.parentElement.innerHTML = `<div class="section-title" style="margin-bottom:12px">Duplicate Records by Tab</div>` + emptyStateHtml("No duplicates", "No duplicate records were detected in any tab.");
    }
  }
}
function baseBarOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: "#eceef2" } } },
  };
}

// ============================================================================
// SHEET PAGE (generic, used for every worksheet tab)
// ============================================================================
const sheetPageState = {}; // sheetId -> { search, sort:{field,dir}, page, pageSize }

function getSheetPageState(sheetId) {
  if (!sheetPageState[sheetId]) sheetPageState[sheetId] = { search: "", sort: null, page: 1, pageSize: 25 };
  return sheetPageState[sheetId];
}

function renderSheetPage(cfg) {
  const stats = getSheetStats(cfg.id);
  const dupGroups = getDuplicateGroupsForSheet(cfg.id);
  const untracked = cfg.completion.mode === "manual";

  return `
    <div class="page-header">
      <div>
        <div class="page-title">${esc(cfg.label)}</div>
        <div class="page-subtitle">${esc(sheetDescription(cfg))}</div>
      </div>
      <div class="page-header-actions">
        ${!cfg.isReference ? `<button class="btn" id="btn-completion-criteria">${gearIconSvg()} Completion Criteria</button>` : ""}
        <button class="btn" id="btn-export-sheet">${downloadIconSvg()} Export</button>
        ${!cfg.isReference ? `<a class="btn primary" href="#/import-export?target=${cfg.id}">${uploadIconSvg()} Import Records</a>` : ""}
      </div>
    </div>

    ${!cfg.isReference ? `
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
      ${kpiCard({ label: "Total Records", value: fmtNum(stats.total), icon: "records", sub: cfg.label })}
      ${untracked
        ? kpiCard({ label: "Manually Tracked", value: `${stats.complete}/${stats.total}`, icon: "check", sub: "No source status field" })
        : kpiCard({ label: "Complete", value: fmtNum(stats.complete), icon: "check", sub: `${stats.pct}% of records`, cls: "positive" })}
      ${cfg.completion.mode === "flag-blank-is-complete"
        ? kpiCard({ label: "Needs Attention", value: fmtNum(stats.needsAttention), icon: "records", sub: cfg.completion.label, cls: stats.needsAttention ? "warn" : "positive" })
        : kpiCard({ label: "Remaining", value: fmtNum(stats.remaining), icon: "records", sub: "Not yet complete" })}
      ${kpiCard({ label: "Duplicates", value: fmtNum(stats.dupCount), icon: "copy", sub: stats.dupCount ? "Review in Duplicate Management" : "None found", cls: stats.dupCount ? "warn" : "positive" })}
    </div>` : ""}

    ${dupGroups.length ? `<div class="card" style="padding:12px 16px;margin-bottom:20px;border-color:var(--status-attention-bg);background:var(--status-attention-bg)">
      <span style="color:var(--status-attention);font-weight:600;font-size:13px">⚠ ${dupGroups.reduce((s,g)=>s+g.records.length,0)} record(s) in this tab are part of a duplicate group.</span>
      <a class="link-inline" href="#/duplicates" style="margin-left:8px;font-size:12.5px">Review duplicates →</a>
    </div>` : ""}

    <div id="sheet-table-region"></div>
  `;
}

function sheetDescription(cfg) {
  if (cfg.isReference) return "Reference lookup table from the source workbook — not a patient roster.";
  const c = cfg.completion;
  return c.mode === "manual" ? "No status field exists in the source data for this tab — completion is tracked manually below." : `Completion is derived from: "${c.field}" (${c.label}).`;
}

function wireSheetPage(cfg) {
  renderSheetTable(cfg);
  document.getElementById("btn-export-sheet")?.addEventListener("click", () => exportSheetToExcel(cfg.id));
  document.getElementById("btn-completion-criteria")?.addEventListener("click", () => openCompletionCriteriaModal(cfg));
}

function getSheetColumns(cfg) {
  const headers = RAW_SHEETS[cfg.id]?.headers || [];
  return headers;
}

function renderSheetTable(cfg) {
  const state = getSheetPageState(cfg.id);
  const allRecords = getAllRecords().filter((r) => r.sheetId === cfg.id);
  const columns = getSheetColumns(cfg);

  let filtered = allRecords;
  if (state.search) {
    const q = state.search.toLowerCase();
    const fields = cfg.searchFields || columns;
    filtered = filtered.filter((r) => fields.some((f) => String(r.data[f] || "").toLowerCase().includes(q)));
  }
  if (state.statusFilter) {
    filtered = filtered.filter((r) => r.status === state.statusFilter);
  }
  if (state.sort) {
    const { field, dir } = state.sort;
    filtered = [...filtered].sort((a, b) => {
      const va = field === "__status" ? a.status : a.data[field] || "";
      const vb = field === "__status" ? b.status : b.data[field] || "";
      const da = parseDateLoose(va), db = parseDateLoose(vb);
      let cmp;
      if (da && db) cmp = da - db;
      else cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return dir === "asc" ? cmp : -cmp;
    });
  }

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const pageStart = (state.page - 1) * state.pageSize;
  const pageRows = filtered.slice(pageStart, pageStart + state.pageSize);

  const showStatusCol = !cfg.isReference;
  // Every column from the source sheet is shown — nothing from the original
  // Excel file is hidden or dropped, even on wide sheets (those just scroll
  // horizontally; see .data-table-wrap).
  const displayCols = columns;

  const region = document.getElementById("sheet-table-region");
  region.innerHTML = `
    <div class="table-toolbar">
      <div class="table-search">
        <span class="icon">${searchIconSvg()}</span>
        <input type="text" id="sheet-search-input" placeholder="Search ${esc(cfg.label)}…" value="${esc(state.search)}" />
      </div>
      ${showStatusCol ? `
      <select class="filter-select" id="sheet-status-filter">
        <option value="">All statuses</option>
        ${Object.keys(STATUS_META).map((s) => `<option value="${s}" ${state.statusFilter === s ? "selected" : ""}>${STATUS_META[s].label}</option>`).join("")}
      </select>` : ""}
      <button class="btn sm ghost" id="reset-filters" title="Clear search, filters, and sorting; go back to page 1">${resetIconSvg()} Reset</button>
      <span class="text-muted" style="margin-left:auto;font-size:12.5px">${fmtNum(total)} record${total === 1 ? "" : "s"}</span>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          ${displayCols.map((c) => `<th data-field="${esc(c)}">${esc(c)}${sortArrow(state, c)}</th>`).join("")}
          ${showStatusCol ? `<th data-field="__status">Status${sortArrow(state, "__status")}</th>` : ""}
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map((r) => sheetRowHtml(cfg, r, displayCols, showStatusCol)).join("") : `<tr><td colspan="${displayCols.length + 2}"><div class="empty-state">${emptyIcon()}<div class="title">No records match your filters</div><div class="desc">Try clearing search or status filters.</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${state.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${state.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${state.page + 1}" ${state.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${state.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;

  region.querySelector("#sheet-search-input").addEventListener("input", debounce((e) => {
    state.search = e.target.value;
    state.page = 1;
    renderSheetTable(cfg);
  }, 220));
  region.querySelector("#sheet-status-filter")?.addEventListener("change", (e) => {
    state.statusFilter = e.target.value || null;
    state.page = 1;
    renderSheetTable(cfg);
  });
  region.querySelector("#reset-filters")?.addEventListener("click", () => {
    state.search = ""; state.statusFilter = null; state.sort = null; state.page = 1;
    renderSheetTable(cfg);
    toast("Filters and sorting reset");
  });
  region.querySelectorAll("thead th[data-field]").forEach((th) => {
    th.addEventListener("click", () => {
      const field = th.dataset.field;
      if (state.sort?.field === field) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
      else state.sort = { field, dir: "asc" };
      renderSheetTable(cfg);
    });
  });
  region.querySelectorAll(".pager-btns button").forEach((b) => {
    b.addEventListener("click", () => { state.page = +b.dataset.page; renderSheetTable(cfg); });
  });
  region.querySelectorAll("[data-action='toggle-expand']").forEach((el) => {
    el.addEventListener("click", () => {
      const uid = el.dataset.uid;
      if (expandedRows.has(uid)) expandedRows.delete(uid);
      else expandedRows.add(uid);
      renderSheetTable(cfg);
    });
  });
  region.querySelectorAll("[data-action='edit-record']").forEach((el) => {
    el.addEventListener("click", () => openEditModal(el.dataset.uid, () => renderSheetTable(cfg)));
  });
  region.querySelectorAll("[data-action='mark-complete']").forEach((el) => {
    el.addEventListener("click", () => { setManualStatus(el.dataset.uid, "complete"); toast("Marked complete"); renderSheetTable(cfg); renderSidebar(); });
  });
  region.querySelectorAll("[data-action='mark-pending']").forEach((el) => {
    el.addEventListener("click", () => { setManualStatus(el.dataset.uid, "pending"); toast("Marked pending"); renderSheetTable(cfg); renderSidebar(); });
  });
  region.querySelectorAll("[data-action='delete-record']").forEach((el) => {
    el.addEventListener("click", () => confirmDialog(
      "Archive this record?",
      "It will be hidden from all views but can be restored later. This does not modify the original workbook.",
      () => { softDeleteRecord(el.dataset.uid); toast("Record archived"); renderSheetTable(cfg); renderSidebar(); }
    ));
  });
  region.querySelectorAll(".inline-edit-input").forEach((input) => {
    const commit = () => {
      const uid = input.dataset.uid;
      const field = input.dataset.field;
      const newVal = input.value;
      const rec = getAllRecords().find((r) => r.uid === uid);
      if (!rec || (rec.data[field] || "") === newVal) return;
      updateRecord(uid, { [field]: newVal });
      // editing the field that drives this sheet's completion should let the source field
      // speak for itself again, rather than leaving a stale manual override in place
      if (cfg.completion?.field === field) setManualStatus(uid, null);
      toast(`Saved "${field}"`);
      renderSheetTable(cfg);
      renderSidebar();
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = getAllRecords().find((r) => r.uid === input.dataset.uid)?.data[input.dataset.field] || ""; input.blur(); }
    });
  });
  region.querySelectorAll(".cal-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const textInput = btn.parentElement.querySelector(".inline-edit-input");
      openDatePickerFor(textInput);
    });
  });
}
function sortArrow(state, field) {
  if (state.sort?.field !== field) return "";
  return `<span class="sort-arrow">${state.sort.dir === "asc" ? "▲" : "▼"}</span>`;
}
// Rows expanded to show the "just below it" detail panel (profile/history
// links). Transient — resets on a full page reload, not persisted.
const expandedRows = new Set();

function sheetRowHtml(cfg, r, displayCols, showStatusCol) {
  const dateFieldsSet = new Set(cfg.dateFields || []);
  const totalCols = displayCols.length + (showStatusCol ? 1 : 0) + 1;
  const isExpanded = expandedRows.has(r.uid);

  const mainRow = `<tr data-row-for="${r.uid}">
    ${displayCols.map((c) => {
      const val = r.data[c] || "";
      const isDate = dateFieldsSet.has(c);
      const isNameCol = c === cfg.nameField;
      return `<td class="inline-cell${isNameCol ? " name-col" : ""}">
        <div class="inline-cell-wrap">
          <input type="text" class="inline-edit-input" data-uid="${r.uid}" data-field="${esc(c)}" value="${esc(val)}" placeholder="—" title="${esc(val)}" />
          ${isDate ? `<button type="button" class="cal-btn" data-uid="${r.uid}" data-field="${esc(c)}" title="Pick a date">${calendarIconSvg()}</button>` : ""}
        </div>
      </td>`;
    }).join("")}
    ${showStatusCol ? `<td>${statusBadge(r.status)}</td>` : ""}
    <td class="actions-cell">
      <button class="btn sm ghost" data-action="toggle-expand" data-uid="${r.uid}" title="${isExpanded ? "Hide details" : "View details"}">${isExpanded ? chevronUpSvg() : chevronDownSvg()}</button>
      <button class="btn sm ghost" data-action="edit-record" data-uid="${r.uid}" title="Edit in a form">${editIconSvg()}</button>
      ${!cfg.isReference && r.status !== "complete" ? `<button class="btn sm ghost" data-action="mark-complete" data-uid="${r.uid}" title="Mark complete">${checkIconSvg()}</button>` : ""}
      ${!cfg.isReference && r.status === "complete" ? `<button class="btn sm ghost" data-action="mark-pending" data-uid="${r.uid}" title="Mark pending">${undoIconSvg()}</button>` : ""}
      <button class="btn sm ghost" data-action="delete-record" data-uid="${r.uid}" title="Archive">${trashIconSvg()}</button>
    </td>
  </tr>`;

  if (!isExpanded) return mainRow;

  return mainRow + `<tr class="expand-row" data-expand-for="${r.uid}"><td colspan="${totalCols}">
    <div class="expand-panel">
      <strong>${esc(r.displayName || "This record")}</strong>
      <span class="text-muted" style="margin-left:8px">${esc(cfg.label)}${r.isImported ? " · Imported" : ""}</span>
      <div class="flex gap-3 mt-2" style="flex-wrap:wrap">
        ${r.identityKey ? `<a class="link-inline" href="#/patient/${encodeURIComponent(r.identityKey)}">View full patient profile across all tabs →</a>` : ""}
        <a class="link-inline" href="#/history?uid=${encodeURIComponent(r.uid)}">View change history for this record →</a>
      </div>
    </div>
  </td></tr>`;

// ---------------------------------------------------------------------------
// Shared native date picker — one hidden <input type="date"> reused for every
// calendar button, positioned right under whichever text field was clicked.
// Selecting a date writes "M/D/YYYY" back into that field and fires the same
// blur-triggered save the field already has, so no separate save path is needed.
// ---------------------------------------------------------------------------
let sharedDateInput = null;
function getSharedDateInput() {
  if (sharedDateInput) return sharedDateInput;
  sharedDateInput = document.createElement("input");
  sharedDateInput.type = "date";
  sharedDateInput.className = "shared-date-picker";
  document.body.appendChild(sharedDateInput);
  sharedDateInput.addEventListener("blur", () => sharedDateInput.classList.remove("active"));
  return sharedDateInput;
}
function toISODateInput(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function openDatePickerFor(textInput) {
  if (!textInput) return;
  const picker = getSharedDateInput();
  const rect = textInput.getBoundingClientRect();
  picker.style.left = rect.left + "px";
  picker.style.top = rect.bottom + 4 + "px";
  picker.style.width = Math.max(rect.width, 120) + "px";
  const parsed = parseDateLoose(textInput.value);
  picker.value = parsed ? toISODateInput(parsed) : "";
  picker.onchange = () => {
    if (picker.value) {
      const [y, m, d] = picker.value.split("-");
      textInput.value = `${+m}/${+d}/${y}`;
      textInput.dispatchEvent(new Event("blur"));
    }
    picker.classList.remove("active");
  };
  picker.classList.add("active");
  picker.focus();
  if (typeof picker.showPicker === "function") {
    try { picker.showPicker(); } catch (e) {}
  }
}

function openModal(innerHtml, opts = {}) {
  closeModal();
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.id = "active-modal";
  backdrop.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}">${innerHtml}</div>`;
  document.body.appendChild(backdrop);
  requestAnimationFrame(() => backdrop.classList.add("open"));
  backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", escCloseHandler);
  return backdrop;
}
function escCloseHandler(e) { if (e.key === "Escape") closeModal(); }
function closeModal() {
  const m = document.getElementById("active-modal");
  if (!m) return;
  m.id = ""; // free up the id immediately so a modal opened right after this one is unambiguous during the fade-out
  m.classList.remove("open");
  document.removeEventListener("keydown", escCloseHandler);
  setTimeout(() => m.remove(), 180);
}
function confirmDialog(title, desc, onConfirm) {
  const modal = openModal(`
    <div class="modal-header"><div><h3>${esc(title)}</h3><p>${esc(desc)}</p></div></div>
    <div class="modal-footer">
      <button class="btn" id="confirm-cancel">Cancel</button>
      <button class="btn danger" id="confirm-ok">Confirm</button>
    </div>
  `);
  modal.querySelector("#confirm-cancel").addEventListener("click", closeModal);
  modal.querySelector("#confirm-ok").addEventListener("click", () => { onConfirm(); closeModal(); });
}

  });

function renderRawDataTable() {
  let records = getAllRecords();
  if (rawDataState.groupFilter !== "all") {
    records = records.filter((r) => SHEET_BY_ID[r.sheetId].group === rawDataState.groupFilter);
  }
  if (rawDataState.sourceFilter) {
    records = records.filter((r) => r.sheetId === rawDataState.sourceFilter);
  }
  if (rawDataState.search) {
    const q = rawDataState.search.toLowerCase();
    records = records.filter((r) => {
      const cfg = SHEET_BY_ID[r.sheetId];
      return (cfg.searchFields || Object.keys(r.data)).some((f) => String(r.data[f] || "").toLowerCase().includes(q));
    });
  }
  if (rawDataState.sort) {
    const { field, dir } = rawDataState.sort;
    const valueOf = {
      __name: (r) => r.displayName || "",
      __source: (r) => SHEET_BY_ID[r.sheetId].label,
      __status: (r) => r.status,
    }[field];
    records = [...records].sort((a, b) => {
      const cmp = String(valueOf(a)).localeCompare(String(valueOf(b)), undefined, { numeric: true });
      return dir === "asc" ? cmp : -cmp;
    });
  }

  const sourceOptions = [...new Set(getAllRecords().map((r) => r.sheetId))].filter((id) => rawDataState.groupFilter === "all" || SHEET_BY_ID[id].group === rawDataState.groupFilter);

  const total = records.length;
  const totalPages = Math.max(1, Math.ceil(total / rawDataState.pageSize));
  rawDataState.page = Math.min(rawDataState.page, totalPages);
  const pageRows = records.slice((rawDataState.page - 1) * rawDataState.pageSize, rawDataState.page * rawDataState.pageSize);

  const region = document.getElementById("raw-data-table-region");
  region.innerHTML = `
    <div class="table-toolbar">
      <div class="table-search"><span class="icon">${searchIconSvg()}</span><input type="text" id="raw-search" placeholder="Search all records…" value="${esc(rawDataState.search)}" /></div>
      <select class="filter-select" id="raw-source-filter">
        <option value="">All source tabs</option>
        ${sourceOptions.map((id) => `<option value="${id}" ${rawDataState.sourceFilter === id ? "selected" : ""}>${esc(SHEET_BY_ID[id].label)}</option>`).join("")}
      </select>
      <button class="btn sm ghost" id="reset-raw-filters" title="Clear search, filters, and sorting; go back to page 1">${resetIconSvg()} Reset</button>
      <span class="text-muted" style="margin-left:auto;font-size:12.5px">${fmtNum(total)} records</span>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th data-field="__name">Patient / Record${sortArrow(rawDataState, "__name")}</th>
          <th data-field="__source">Source Tab${sortArrow(rawDataState, "__source")}</th>
          <th>Identifier</th>
          <th data-field="__status">Status${sortArrow(rawDataState, "__status")}</th>
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map(rawRowHtml).join("") : `<tr><td colspan="5"><div class="empty-state">${emptyIcon()}<div class="title">No records match your filters</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${rawDataState.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${rawDataState.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${rawDataState.page - 1}" ${rawDataState.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${rawDataState.page + 1}" ${rawDataState.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${rawDataState.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;
  region.querySelector("#raw-search").addEventListener("input", debounce((e) => { rawDataState.search = e.target.value; rawDataState.page = 1; renderRawDataTable(); }, 220));
  region.querySelector("#raw-source-filter").addEventListener("change", (e) => { rawDataState.sourceFilter = e.target.value; rawDataState.page = 1; renderRawDataTable(); });
  region.querySelector("#reset-raw-filters").addEventListener("click", () => {
    rawDataState.search = ""; rawDataState.sourceFilter = ""; rawDataState.sort = null; rawDataState.page = 1; rawDataState.groupFilter = "all";
    render();
    toast("Filters and sorting reset");
  });
  region.querySelectorAll("thead th[data-field]").forEach((th) => {
    th.addEventListener("click", () => {
      const field = th.dataset.field;
      if (rawDataState.sort?.field === field) rawDataState.sort.dir = rawDataState.sort.dir === "asc" ? "desc" : "asc";
      else rawDataState.sort = { field, dir: "asc" };
      renderRawDataTable();
    });
  });
  region.querySelectorAll(".pager-btns button").forEach((b) => b.addEventListener("click", () => { rawDataState.page = +b.dataset.page; renderRawDataTable(); }));
  wireGenericTableClicks();
}

const historyState = { sheetFilter: "", actionFilter: "", uidFilter: "", page: 1, pageSize: 40 };
const HISTORY_ACTION_LABELS = {
  status: "Status change",
  edit: "Edit",
  archive: "Archive",
  restore: "Restore",
  "completion-criteria": "Completion criteria",
  "duplicate-review": "Duplicate review",
  import: "Import",
};

function renderChangeHistory() {
  const sheetsWithHistory = [...new Set(Store.changeLog.map((e) => e.sheetId).filter(Boolean))];
  return `
    <div class="page-header">
      <div>
        <div class="page-title">Change History</div>
        <div class="page-subtitle">Every status change, edit, import, archive, and duplicate review made in this app, most recent first.</div>
      </div>
    </div>
    <div class="table-toolbar">
      <select class="filter-select" id="hist-sheet-filter">
        <option value="">All tabs</option>
        ${sheetsWithHistory.map((id) => `<option value="${id}" ${historyState.sheetFilter === id ? "selected" : ""}>${esc(SHEET_BY_ID[id]?.label || id)}</option>`).join("")}
      </select>
      <select class="filter-select" id="hist-action-filter">
        <option value="">All change types</option>
        ${Object.entries(HISTORY_ACTION_LABELS).map(([k, v]) => `<option value="${k}" ${historyState.actionFilter === k ? "selected" : ""}>${esc(v)}</option>`).join("")}
      </select>
      <button class="btn sm ghost" id="hist-reset">${resetIconSvg()} Reset</button>
      <span class="text-muted" style="margin-left:auto;font-size:12.5px" id="hist-count"></span>
    </div>
    ${historyState.uidFilter ? `<div class="card" style="padding:10px 14px;margin-bottom:14px;background:var(--accent-soft);border-color:var(--accent-soft-border)">
      Showing history for one record only. <a class="link-inline" href="#/history" id="hist-clear-uid">Show all history →</a>
    </div>` : ""}
    <div id="history-list-region"></div>
  `;
}

function wireChangeHistory() {
  document.getElementById("hist-sheet-filter").addEventListener("change", (e) => { historyState.sheetFilter = e.target.value; historyState.page = 1; renderHistoryList(); });
  document.getElementById("hist-action-filter").addEventListener("change", (e) => { historyState.actionFilter = e.target.value; historyState.page = 1; renderHistoryList(); });
  document.getElementById("hist-reset").addEventListener("click", () => {
    historyState.sheetFilter = ""; historyState.actionFilter = ""; historyState.uidFilter = ""; historyState.page = 1;
    render();
    toast("Filters reset");
  });
  document.getElementById("hist-clear-uid")?.addEventListener("click", () => { historyState.uidFilter = ""; });
  renderHistoryList();
}

function renderHistoryList() {
  let entries = Store.changeLog;
  if (historyState.uidFilter) entries = entries.filter((e) => e.uid === historyState.uidFilter);
  if (historyState.sheetFilter) entries = entries.filter((e) => e.sheetId === historyState.sheetFilter);
  if (historyState.actionFilter) entries = entries.filter((e) => e.action === historyState.actionFilter);

  const total = entries.length;
  const totalPages = Math.max(1, Math.ceil(total / historyState.pageSize));
  historyState.page = Math.min(historyState.page, totalPages);
  const pageRows = entries.slice((historyState.page - 1) * historyState.pageSize, historyState.page * historyState.pageSize);

  document.getElementById("hist-count").textContent = `${fmtNum(total)} change${total === 1 ? "" : "s"}`;

  const region = document.getElementById("history-list-region");
  if (!total) {
    region.innerHTML = `<div class="card">${emptyStateHtml("No changes yet", "Once someone edits a record, marks something complete, imports data, or reviews a duplicate, it'll show up here.")}</div>`;
    return;
  }
  region.innerHTML = `
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr><th>When</th><th>Type</th><th>Tab</th><th>What changed</th></tr></thead>
        <tbody>
          ${pageRows.map((e) => `<tr>
            <td>${esc(formatHistoryTs(e.ts))}</td>
            <td><span class="badge outline">${esc(HISTORY_ACTION_LABELS[e.action] || e.action)}</span></td>
            <td>${e.sheetId ? esc(SHEET_BY_ID[e.sheetId]?.label || e.sheetId) : "—"}</td>
            <td style="white-space:normal;max-width:520px">${esc(e.summary)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${historyState.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${historyState.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${historyState.page - 1}" ${historyState.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${historyState.page + 1}" ${historyState.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${historyState.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;
  region.querySelectorAll(".pager-btns button").forEach((b) => b.addEventListener("click", () => { historyState.page = +b.dataset.page; renderHistoryList(); }));
}
function formatHistoryTs(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return sameDay ? `Today, ${time}` : `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}, ${time}`;
}

function exportSheetToExcel(sheetId) {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const cfg = SHEET_BY_ID[sheetId];
  const rows = getAllRecords().filter((r) => r.sheetId === sheetId).map((r) => r.data);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  XLSX.writeFile(wb, `${cfg.label.replace(/[^\w\- ]/g, "")}.xlsx`);
  toast("Exported " + cfg.label);
}
function exportRawDataToExcel() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  let records = getAllRecords();
  if (rawDataState.groupFilter !== "all") records = records.filter((r) => SHEET_BY_ID[r.sheetId].group === rawDataState.groupFilter);
  if (rawDataState.sourceFilter) records = records.filter((r) => r.sheetId === rawDataState.sourceFilter);
  const rows = records.map((r) => ({ "Source Tab": SHEET_BY_ID[r.sheetId].label, ...r.data, Status: STATUS_META[r.status].label }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Raw Data Export");
  XLSX.writeFile(wb, "raw_data_export.xlsx");
  toast("Exported raw data");
}
function exportAllToExcel() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const wb = XLSX.utils.book_new();
  for (const cfg of SHEET_CONFIG) {
    const rows = getAllRecords().filter((r) => r.sheetId === cfg.id).map((r) => r.data);
    if (!rows.length) continue;
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  }
  XLSX.writeFile(wb, "dg_master_pt_list_export.xlsx");
  toast("Exported full workbook");
}
function exportAllToCsv() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const rows = getAllRecords().map((r) => ({ "Source Tab": SHEET_BY_ID[r.sheetId].label, ...r.data, Status: STATUS_META[r.status].label }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const csv = XLSX.utils.sheet_to_csv(ws);
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dg_master_pt_list_export.csv";
  a.click();
  toast("Exported CSV");
}

// ---------------------------------------------------------------------------
// Import Wizard
// ---------------------------------------------------------------------------
const importWizard = { step: 1, workbook: null, sheetNames: [], selectedSheet: null, targetId: null, incomingHeaders: [], incomingRows: [], mapping: {}, fileName: "" };

function resetWizard() {
  Object.assign(importWizard, { step: 1, workbook: null, sheetNames: [], selectedSheet: null, targetId: null, incomingHeaders: [], incomingRows: [], mapping: {}, fileName: "" });
}

function openImportWizard() {
  resetWizard();
  const { view, query } = parseHash();
  if (query.target) importWizard.targetId = query.target;
  renderWizardModal();
}

function renderWizardModal() {
  const steps = ["Choose File", "Select Sheet & Target", "Map Columns", "Preview & Confirm"];
  const modal = openModal(`
    <div class="modal-header">
      <div><h3>Import Records from Excel</h3><p>Step ${importWizard.step} of 4</p></div>
    </div>
    <div class="modal-body">
      <div class="wizard-steps">
        ${steps.map((s, i) => `
          <div class="wizard-step ${importWizard.step === i + 1 ? "active" : importWizard.step > i + 1 ? "done" : ""}">
            <span class="num">${importWizard.step > i + 1 ? "✓" : i + 1}</span><span>${esc(s)}</span>
          </div>
          ${i < steps.length - 1 ? `<div class="wizard-connector"></div>` : ""}
        `).join("")}
      </div>
      <div id="wizard-step-body"></div>
    </div>
    <div class="modal-footer" id="wizard-footer"></div>
  `, { wide: true });
  renderWizardStep();
}

function renderWizardStep() {
  const body = document.getElementById("wizard-step-body");
  const footer = document.getElementById("wizard-footer");
  if (importWizard.step === 1) {
    body.innerHTML = `
      <div class="dropzone" id="dropzone">
        ${uploadIconIllus()}
        <div style="font-weight:600;color:var(--text-primary);margin-bottom:4px">Click to choose an Excel file</div>
        <div style="font-size:12px">.xlsx or .xls — the file never leaves your browser</div>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none" />
      </div>
      <div id="file-status" class="mt-4"></div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-cancel">Cancel</button><button class="btn primary" id="wiz-next" disabled>Next</button>`;
    footer.querySelector("#wiz-cancel").addEventListener("click", closeModal);
    const dz = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    dz.addEventListener("click", () => fileInput.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag-over"); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener("change", (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

    function handleFile(file) {
      if (typeof XLSX === "undefined") { toast("Excel library did not load (no internet access?)", "error"); return; }
      importWizard.fileName = file.name;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const wb = XLSX.read(ev.target.result, { type: "array", cellDates: true });
          importWizard.workbook = wb;
          importWizard.sheetNames = wb.SheetNames;
          document.getElementById("file-status").innerHTML = `<div class="badge status-complete">✓ ${esc(file.name)} — ${wb.SheetNames.length} worksheet(s) found</div>`;
          footer.querySelector("#wiz-next").disabled = false;
        } catch (err) {
          document.getElementById("file-status").innerHTML = `<div class="badge status-needs-attention">Could not read this file: ${esc(err.message)}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    }
    footer.querySelector("#wiz-next").addEventListener("click", () => { importWizard.step = 2; renderWizardStep(); updateWizardChrome(); });
  }

  else if (importWizard.step === 2) {
    body.innerHTML = `
      <div class="form-group">
        <label>Which worksheet has the data you want to import?</label>
        <select id="wiz-sheet-select">
          <option value="">— choose a worksheet —</option>
          ${importWizard.sheetNames.map((n) => `<option value="${esc(n)}" ${importWizard.selectedSheet === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
        </select>
      </div>
      <div class="form-group">
        <label>Which tab should these records be added to?</label>
        <select id="wiz-target-select">
          <option value="">— choose a destination tab —</option>
          ${SHEET_CONFIG.filter((s) => !s.isReference).map((s) => `<option value="${s.id}" ${importWizard.targetId === s.id ? "selected" : ""}>${esc(s.label)}</option>`).join("")}
        </select>
      </div>
      <div id="wiz-preview-mini"></div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-back">Back</button><button class="btn primary" id="wiz-next" disabled>Next</button>`;
    footer.querySelector("#wiz-back").addEventListener("click", () => { importWizard.step = 1; renderWizardStep(); updateWizardChrome(); });
    const checkReady = () => { footer.querySelector("#wiz-next").disabled = !(importWizard.selectedSheet && importWizard.targetId); };
    document.getElementById("wiz-sheet-select").addEventListener("change", (e) => {
      importWizard.selectedSheet = e.target.value || null;
      if (importWizard.selectedSheet) {
        const ws = importWizard.workbook.Sheets[importWizard.selectedSheet];
        // cellDates:true (set at XLSX.read) turns date-formatted cells into real JS Date
        // objects here instead of raw Excel serial numbers — format them to plain
        // M/D/YYYY text now so nothing downstream ever sees a number like "45932".
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" }).map((row) => {
          const out = {};
          for (const [k, v] of Object.entries(row)) out[k] = v instanceof Date ? formatJsDate(v) : v;
          return out;
        });
        importWizard.incomingRows = rows;
        importWizard.incomingHeaders = rows.length ? Object.keys(rows[0]) : [];
        document.getElementById("wiz-preview-mini").innerHTML = `<p class="form-hint">${rows.length} row(s) found, ${importWizard.incomingHeaders.length} column(s): ${importWizard.incomingHeaders.slice(0, 8).map(esc).join(", ")}${importWizard.incomingHeaders.length > 8 ? "…" : ""}</p>`;
      }
      checkReady();
    });
    document.getElementById("wiz-target-select").addEventListener("change", (e) => { importWizard.targetId = e.target.value || null; checkReady(); });
    checkReady();
    footer.querySelector("#wiz-next").addEventListener("click", () => {
      const targetHeaders = RAW_SHEETS[importWizard.targetId].headers;
      importWizard.mapping = {};
      for (const h of importWizard.incomingHeaders) {
        const exact = targetHeaders.find((t) => t.toLowerCase().trim() === h.toLowerCase().trim());
        importWizard.mapping[h] = exact || "";
      }
      importWizard.step = 3;
      renderWizardStep();
      updateWizardChrome();
    });
  }

  else if (importWizard.step === 3) {
    const targetHeaders = RAW_SHEETS[importWizard.targetId].headers;
    const matchedCount = Object.values(importWizard.mapping).filter(Boolean).length;
    body.innerHTML = `
      <p class="form-hint" style="margin-bottom:12px">${matchedCount} / ${importWizard.incomingHeaders.length} incoming columns matched automatically. Review and adjust below — columns set to "Do not import" are skipped.</p>
      <table class="mapping-table">
        <thead><tr><th>Incoming Column</th><th></th><th>Maps To</th><th>Status</th></tr></thead>
        <tbody>
          ${importWizard.incomingHeaders.map((h) => `
            <tr>
              <td>${esc(h)}</td>
              <td>→</td>
              <td>
                <select data-map-col="${esc(h)}">
                  <option value="">Do not import</option>
                  ${targetHeaders.map((t) => `<option value="${esc(t)}" ${importWizard.mapping[h] === t ? "selected" : ""}>${esc(t)}</option>`).join("")}
                </select>
              </td>
              <td>${importWizard.mapping[h] ? `<span class="badge status-complete">Matched</span>` : `<span class="badge status-not-started">Skipped</span>`}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      <div class="mt-4">
        ${targetHeaders.filter((t) => !Object.values(importWizard.mapping).includes(t)).length ? `<p class="form-hint">Target columns with no incoming match (will stay blank for imported rows): ${targetHeaders.filter((t) => !Object.values(importWizard.mapping).includes(t)).map(esc).join(", ")}</p>` : ""}
      </div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-back">Back</button><button class="btn primary" id="wiz-next">Next: Preview</button>`;
    footer.querySelector("#wiz-back").addEventListener("click", () => { importWizard.step = 2; renderWizardStep(); updateWizardChrome(); });
    body.querySelectorAll("[data-map-col]").forEach((sel) => {
      sel.addEventListener("change", (e) => {
        importWizard.mapping[sel.dataset.mapCol] = e.target.value;
        renderWizardStep();
      });
    });
    footer.querySelector("#wiz-next").addEventListener("click", () => { importWizard.step = 4; renderWizardStep(); updateWizardChrome(); });
  }

  else if (importWizard.step === 4) {
    const cfg = SHEET_BY_ID[importWizard.targetId];
    const mappedRows = importWizard.incomingRows.map((row) => {
      const out = {};
      for (const [src, dest] of Object.entries(importWizard.mapping)) {
        if (dest) out[dest] = String(row[src] ?? "");
      }
      return out;
    });
    const existing = getExistingIdentitySetForSheet(importWizard.targetId);
    let dupCount = 0;
    for (const row of mappedRows) {
      const identity = computeImportRowIdentity(cfg, row);
      if (identity && existing.has(identity)) dupCount++;
    }
    const newCount = mappedRows.length - dupCount;
    body.innerHTML = `
      <div class="import-summary-grid">
        <div class="summary-stat"><div class="num">${mappedRows.length}</div><div class="lbl">Records Found</div></div>
        <div class="summary-stat good"><div class="num">${newCount}</div><div class="lbl">New Records</div></div>
        <div class="summary-stat ${dupCount ? "warn" : ""}"><div class="num">${dupCount}</div><div class="lbl">Potential Duplicates</div></div>
        <div class="summary-stat"><div class="num">${Object.values(importWizard.mapping).filter(Boolean).length}</div><div class="lbl">Columns Matched</div></div>
      </div>
      ${dupCount ? `
      <div class="form-group">
        <label>How should duplicates be handled?</label>
        <select id="dup-handling">
          <option value="skip">Skip exact duplicates (import ${newCount} new only)</option>
          <option value="all">Import all ${mappedRows.length} records anyway</option>
        </select>
      </div>` : ""}
      <p class="form-hint">Preview of the first 5 mapped rows:</p>
      <div class="data-table-wrap" style="max-height:220px">
        <table class="data-table">
          <thead><tr>${Object.values(importWizard.mapping).filter(Boolean).map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>${mappedRows.slice(0, 5).map((r) => `<tr>${Object.values(importWizard.mapping).filter(Boolean).map((h) => `<td>${esc(r[h])}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      </div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-back">Back</button><button class="btn danger" id="wiz-do-cancel">Cancel Import</button><button class="btn primary" id="wiz-confirm">Import ${newCount || mappedRows.length} Record(s)</button>`;
    footer.querySelector("#wiz-back").addEventListener("click", () => { importWizard.step = 3; renderWizardStep(); updateWizardChrome(); });
    footer.querySelector("#wiz-do-cancel").addEventListener("click", closeModal);
    footer.querySelector("#wiz-confirm").addEventListener("click", () => {
      const skipDup = document.getElementById("dup-handling") ? document.getElementById("dup-handling").value === "skip" : true;
      const result = commitImport(importWizard.targetId, mappedRows, { skipDuplicates: skipDup, fileName: importWizard.fileName });
      toast(`Imported ${result.added} record(s)${result.skipped ? `, skipped ${result.skipped} duplicate(s)` : ""}`);
      closeModal();
      render();
    });
  }
}
function updateWizardChrome() {
  const modal = document.querySelector("#active-modal .modal");
  if (!modal) return;
  modal.querySelector(".modal-header p").textContent = `Step ${importWizard.step} of 4`;
  modal.querySelectorAll(".wizard-step").forEach((el, i) => {
    el.classList.toggle("active", importWizard.step === i + 1);
    el.classList.toggle("done", importWizard.step > i + 1);
    el.querySelector(".num").textContent = importWizard.step > i + 1 ? "✓" : String(i + 1);
  });
}
function uploadIconIllus() { return `<div class="icon">${'<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M6 10l6-6 6 6M4 20h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'}</div>`; }

// ============================================================================
// TOP BAR SEARCH
// ============================================================================
document.getElementById("global-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const q = e.target.value.trim();
    if (q) navigate(`search?q=${encodeURIComponent(q)}`);
  }
});
document.getElementById("btn-import-topbar").addEventListener("click", openImportWizard);

// ============================================================================
// BOOT
// ============================================================================
window.navigate = navigate;
window.closeModal = closeModal;

(async function boot() {
  $root.innerHTML = `<div class="empty-state" style="margin-top:120px"><div class="spinner" style="width:28px;height:28px;border-width:3px;margin:0 auto 16px"></div><div class="title">Loading…</div></div>`;
  await bootStore();
  render();
  startWixSync();
})();

  </script>
</body>
</html>
