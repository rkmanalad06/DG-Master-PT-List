function wireDuplicates() {
  document.querySelectorAll("[data-dup-tab]").forEach((b) => b.addEventListener("click", () => { window.__dupTab = b.dataset.dupTab; render(); }));
  renderDupList();
}

function renderDupList() {
  const idx = computeDuplicateIndex();
  const groups = { exact: idx.exactDuplicates, potential: idx.potentialDuplicates, "cross-tab": idx.crossTabGroups }[window.__dupTab] || [];
  const region = document.getElementById("dup-list-region");
  if (!groups.length) {
    region.innerHTML = `<div class="card">${emptyStateHtml("Nothing here", "No groups found in this category.")}</div>`;
    return;
  }
  region.innerHTML = groups.map((g) => dupGroupCard(g)).join("");
  region.querySelectorAll("[data-action='review-group']").forEach((el) => {
    el.addEventListener("click", () => { setGroupReview(el.dataset.key, { reviewed: true }); toast("Marked as reviewed"); render(); });
  });
  region.querySelectorAll("[data-action='unreview-group']").forEach((el) => {
    el.addEventListener("click", () => { setGroupReview(el.dataset.key, { reviewed: false }); render(); });
  });
  region.querySelectorAll("[data-action='view-record']").forEach((el) => el.addEventListener("click", () => openRecordModal(el.dataset.uid)));
  region.querySelectorAll("[data-action='archive-from-group']").forEach((el) => {
    el.addEventListener("click", () => confirmDialog("Archive this record?", "It will be hidden from all views but can be restored later.", () => {
      softDeleteRecord(el.dataset.uid); invalidateDupCache(); toast("Record archived"); render();
    }));
  });
}
function dupGroupCard(g) {

  const label = g.type === "cross-tab" ? `Found in: ${g.sheets.map((s) => SHEET_BY_ID[s].label).join(", ")}` : `${g.records.length} records in ${SHEET_BY_ID[g.sheetId].label}`;

    ? `<div class="text-muted" style="font-size:12px;margin-bottom:10px">Flagged because ${g.matchedFields.length} column(s) matched exactly: ${g.matchedFields.map((f) => `<strong>${esc(f)}</strong>`).join(", ") || "(name only)"}</div>`

      <div>
        <strong>${esc(g.records[0].displayName || "(no name)")}</strong>

    </div>

    <div class="src-field-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      ${g.records.map((r) => `<div class="card" style="padding:10px;background:var(--bg-sunken)">
        <div class="flex justify-between items-center" style="margin-bottom:6px">
          <span class="badge outline">${esc(SHEET_BY_ID[r.sheetId].label)}</span>
          ${statusBadge(r.status)}
        </div>
        <div style="font-size:12px;color:var(--text-secondary)">${r.acct ? "Acct #" + esc(r.acct) : ""} ${r.rawDob ? "· DOB " + esc(r.rawDob) : ""}</div>

          <button class="btn sm ghost" data-action="archive-from-group" data-uid="${r.uid}">Archive</button>

}

const historyState = { sheetFilter: "", actionFilter: "", uidFilter: "", page: 1, pageSize: 40 };
const HISTORY_ACTION_LABELS = {
  status: "Status change",
  edit: "Edit",
  archive: "Archive",
  restore: "Restore",
  "completion-criteria": "Completion criteria",
  column: "Column change",
  "duplicate-review": "Duplicate review",

function renderChangeHistory() {
  const sheetsWithHistory = [...new Set(Store.changeLog.map((e) => e.sheetId).filter(Boolean))];
  return `
    <div class="page-header">
      <div>
        <div class="page-title">Change History</div>
        <div class="page-subtitle">Every status change, edit, import, archive, and duplicate review made in this app, most recent first.</div>
      </div>
    </div>
    <div class="table-toolbar">
      <select class="filter-select" id="hist-sheet-filter">
        <option value="">All tabs</option>
        ${sheetsWithHistory.map((id) => `<option value="${id}" ${historyState.sheetFilter === id ? "selected" : ""}>${esc(SHEET_BY_ID[id]?.label || id)}</option>`).join("")}
      </select>
      <select class="filter-select" id="hist-action-filter">
        <option value="">All change types</option>
        ${Object.entries(HISTORY_ACTION_LABELS).map(([k, v]) => `<option value="${k}" ${historyState.actionFilter === k ? "selected" : ""}>${esc(v)}</option>`).join("")}
      </select>

function wireChangeHistory() {
  document.getElementById("hist-sheet-filter").addEventListener("change", (e) => { historyState.sheetFilter = e.target.value; historyState.page = 1; renderHistoryList(); });
  document.getElementById("hist-action-filter").addEventListener("change", (e) => { historyState.actionFilter = e.target.value; historyState.page = 1; renderHistoryList(); });
  document.getElementById("hist-reset").addEventListener("click", () => {
    historyState.sheetFilter = ""; historyState.actionFilter = ""; historyState.uidFilter = ""; historyState.page = 1;
    render();
    toast("Filters reset");
  });
  document.getElementById("hist-clear-uid")?.addEventListener("click", () => { historyState.uidFilter = ""; });
  renderHistoryList();
}

function renderHistoryList() {
  let entries = Store.changeLog;
  if (historyState.uidFilter) entries = entries.filter((e) => e.uid === historyState.uidFilter);
  if (historyState.sheetFilter) entries = entries.filter((e) => e.sheetId === historyState.sheetFilter);
  if (historyState.actionFilter) entries = entries.filter((e) => e.action === historyState.actionFilter);

  const total = entries.length;
  const totalPages = Math.max(1, Math.ceil(total / historyState.pageSize));
  historyState.page = Math.min(historyState.page, totalPages);
  const pageRows = entries.slice((historyState.page - 1) * historyState.pageSize, historyState.page * historyState.pageSize);

  document.getElementById("hist-count").textContent = `${fmtNum(total)} change${total === 1 ? "" : "s"}`;

  const region = document.getElementById("history-list-region");
  if (!total) {
    region.innerHTML = `<div class="card">${emptyStateHtml("No changes yet", "Once someone edits a record, marks something complete, imports data, or reviews a duplicate, it'll show up here.")}</div>`;
    return;
  }
  region.innerHTML = `
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr><th>When</th><th>Type</th><th>Tab</th><th>What changed</th></tr></thead>
        <tbody>
          ${pageRows.map((e) => `<tr>
            <td>${esc(formatHistoryTs(e.ts))}</td>
            <td><span class="badge outline">${esc(HISTORY_ACTION_LABELS[e.action] || e.action)}</span></td>
            <td>${e.sheetId ? esc(SHEET_BY_ID[e.sheetId]?.label || e.sheetId) : "—"}</td>
            <td style="white-space:normal;max-width:520px">${esc(e.summary)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${historyState.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${historyState.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${historyState.page - 1}" ${historyState.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${historyState.page + 1}" ${historyState.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${historyState.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;
  region.querySelectorAll(".pager-btns button").forEach((b) => b.addEventListener("click", () => { historyState.page = +b.dataset.page; renderHistoryList(); }));
}
function formatHistoryTs(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return sameDay ? `Today, ${time}` : `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}, ${time}`;
}

function exportSheetToExcel(sheetId) {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const cfg = SHEET_BY_ID[sheetId];
  const rows = getAllRecords().filter((r) => r.sheetId === sheetId).map((r) => r.data);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  XLSX.writeFile(wb, `${cfg.label.replace(/[^\w\- ]/g, "")}.xlsx`);
  toast("Exported " + cfg.label);
}
function exportRawDataToExcel() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  let records = getAllRecords();
  if (rawDataState.groupFilter !== "all") records = records.filter((r) => SHEET_BY_ID[r.sheetId].group === rawDataState.groupFilter);
  if (rawDataState.sourceFilter) records = records.filter((r) => r.sheetId === rawDataState.sourceFilter);
  const rows = records.map((r) => ({ "Source Tab": SHEET_BY_ID[r.sheetId].label, ...r.data, Status: STATUS_META[r.status].label }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Raw Data Export");
  XLSX.writeFile(wb, "raw_data_export.xlsx");
  toast("Exported raw data");
}
function exportAllToExcel() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const wb = XLSX.utils.book_new();
  for (const cfg of SHEET_CONFIG) {
    const rows = getAllRecords().filter((r) => r.sheetId === cfg.id).map((r) => r.data);
    if (!rows.length) continue;
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  }
  XLSX.writeFile(wb, "dg_master_pt_list_export.xlsx");
  toast("Exported full workbook");
}
function exportAllToCsv() {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const rows = getAllRecords().map((r) => ({ "Source Tab": SHEET_BY_ID[r.sheetId].label, ...r.data, Status: STATUS_META[r.status].label }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const csv = XLSX.utils.sheet_to_csv(ws);
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dg_master_pt_list_export.csv";
  a.click();
  toast("Exported CSV");
}

// ---------------------------------------------------------------------------
// Import Wizard
// ---------------------------------------------------------------------------
const importWizard = { step: 1, workbook: null, sheetNames: [], selectedSheet: null, targetId: null, incomingHeaders: [], incomingRows: [], mapping: {}, fileName: "" };

function resetWizard() {
  Object.assign(importWizard, { step: 1, workbook: null, sheetNames: [], selectedSheet: null, targetId: null, incomingHeaders: [], incomingRows: [], mapping: {}, fileName: "" });
}

function openImportWizard() {
  resetWizard();
  const { view, query } = parseHash();
  if (query.target) importWizard.targetId = query.target;
  renderWizardModal();
}

function renderWizardModal() {
  const steps = ["Choose File", "Select Sheet & Target", "Map Columns", "Preview & Confirm"];
  const modal = openModal(`
    <div class="modal-header">
      <div><h3>Import Records from Excel</h3><p>Step ${importWizard.step} of 4</p></div>
    </div>
    <div class="modal-body">
      <div class="wizard-steps">
        ${steps.map((s, i) => `
          <div class="wizard-step ${importWizard.step === i + 1 ? "active" : importWizard.step > i + 1 ? "done" : ""}">
            <span class="num">${importWizard.step > i + 1 ? "✓" : i + 1}</span><span>${esc(s)}</span>
          </div>
          ${i < steps.length - 1 ? `<div class="wizard-connector"></div>` : ""}
        `).join("")}
      </div>
      <div id="wizard-step-body"></div>
    </div>
    <div class="modal-footer" id="wizard-footer"></div>
  `, { wide: true });
  renderWizardStep();
}

function renderWizardStep() {
  const body = document.getElementById("wizard-step-body");
  const footer = document.getElementById("wizard-footer");
  if (importWizard.step === 1) {
    body.innerHTML = `
      <div class="dropzone" id="dropzone">
        ${uploadIconIllus()}
        <div style="font-weight:600;color:var(--text-primary);margin-bottom:4px">Click to choose an Excel file</div>
        <div style="font-size:12px">.xlsx or .xls — the file never leaves your browser</div>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none" />
      </div>
      <div id="file-status" class="mt-4"></div>
    `;
    footer.innerHTML = `<button class="btn" id="wiz-cancel">Cancel</button><button class="btn primary" id="wiz-next" disabled>Next</button>`;
    footer.querySelector("#wiz-cancel").addEventListener("click", closeModal);
    const dz = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    dz.addEventListener("click", () => fileInput.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag-over"); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener("change", (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

    function handleFile(file) {
      if (typeof XLSX === "undefined") { toast("Excel library did not load (no internet access?)", "error"); return; }
      importWizard.fileName = file.name;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const wb = XLSX.read(ev.target.result, { type: "array", cellDates: true });
          importWizard.workbook = wb;
          importWizard.sheetNames = wb.SheetNames;

// ---------------------------------------------------------------------------
// Rules
// ---------------------------------------------------------------------------
function callActionKey(raw) {
  const v = String(raw || "").trim().toLowerCase();
  if (!v) return "call";
  if (v.includes("confirm")) return "confirmed";
  if (v.includes("refus")) return "refused";
  if (v.includes("resched")) return "resched";
  if (v.includes("progress")) return "progress";
  return "call";
}
function clToday() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function clDaysFromToday(d) { return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - clToday()) / 86400000); }

  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function clToIso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function clDaysPhrase(days) {
  if (days === 0) return "is today";
  if (days > 0) return `is in ${days} day${days === 1 ? "" : "s"}`;
  return `was ${-days} day${days === -1 ? "" : "s"} ago`;
}

// One place that turns a record's fields into its call status. Needs Attention
// is deliberately never applied once Confirmed / Refused / Resched is recorded.
function callInfo(data) {
  if (clIsTransition()) {
    const assigned = !!String(data[CL.TEAM] || "").trim();
    const scheduled = !!String(data[CL.NEXT] || "").trim();
    return { key: scheduled ? "scheduled" : "letter", done: false, days: null, flagged: false, assigned, scheduled, status: assigned ? "t-assigned" : "t-unassigned" };
  }
  const key = callActionKey(data[CL.ACTION]);
  const done = key === "confirmed" || key === "refused" || key === "resched";
  const nextDate = parseDateLoose(data[CL.NEXT]);
  const days = nextDate ? clDaysFromToday(nextDate) : null;
  const flagged = !done && days !== null && days <= CL.ATTN_DAYS;
  const assigned = !!String(data[CL.TEAM] || "").trim();

  if (key === "confirmed" || key === "refused" || key === "resched") status = key;

  if (info.flagged) return { key: "attention", tone: "attn", label: "Needs Attention" };

}

// Column layout: shared custom columns + per-browser order/width
// ---------------------------------------------------------------------------
function clLayoutLoad() { const l = lsGet(CL.LS_LAYOUT, {}); return { order: l.order || [], widths: l.widths || {} }; }
function clLayoutSave(l) { lsSet(CL.LS_LAYOUT, l); }
function clCustomColumns() {
  try { const c = JSON.parse(Store.editedRows[CL.LAYOUT_UID]?.columns || "[]"); return Array.isArray(c) ? c : []; } catch (e) { return []; }
}
function clSaveCustomColumns(cols) {
  Store.editedRows[CL.LAYOUT_UID] = { ...(Store.editedRows[CL.LAYOUT_UID] || {}), columns: JSON.stringify(cols) };
  saveEditedRows();
  WixBridge.save("editedRow", { uid: CL.LAYOUT_UID, patch: Store.editedRows[CL.LAYOUT_UID] });
}
function clColumns(cfg) {
  const all = (RAW_SHEETS[cfg.id]?.headers || []).slice();
  if (!all.includes(CL.ACTION)) all.push(CL.ACTION);
  clCustomColumns().forEach((c) => { if (!all.includes(c.name)) all.push(c.name); });
  all.push("__status");
  const out = [];
  clLayoutLoad().order.forEach((k) => { if (all.includes(k) && !out.includes(k)) out.push(k); });
  all.forEach((k) => { if (!out.includes(k)) out.push(k); });
  return out;
}
function clColLabel(col) { return col === "__status" ? "Status" : col; }
function clDefaultWidth(cfg, col) {
  if (col === "__status") return 175;
  if (col === CL.ACTION) return 285;
  if (col === cfg.nameField) return 190;
  if (col === CL.TEAM) return 150;
  if (/note/i.test(col)) return 210;
  if (clIsDateCol(cfg, col)) return 140;
  return 140;
}
function clWidth(cfg, col) { return clLayoutLoad().widths[col] || clDefaultWidth(cfg, col); }
const CL_ACTIONS_COL_W = 132;
function clIsDateCol(cfg, col) {
  return (cfg.dateFields || []).includes(col) || clCustomColumns().some((c) => c.name === col && c.type === "date");
}
function clMoveColumn(cfg, from, to, after) {
  const cols = clColumns(cfg);
  const i = cols.indexOf(from);
  if (i < 0 || from === to) return;
  cols.splice(i, 1);
  let j = cols.indexOf(to);
  if (j < 0) return;
  if (after) j++;
  cols.splice(j, 0, from);
  const l = clLayoutLoad(); l.order = cols; clLayoutSave(l);
}

function clSortValue(r, col) {
  if (col === "__status") return CALL_STATUSES.findIndex((s) => s.key === (callInfo(r.data).assigned ? "assigned" : "pending"));
  if (col === CL.ACTION) return callPill(r.data).label;
  return r.data[col] || "";
}
function clFilteredRows(cfg) {
  let rows = clRecords();
  if (clState.search) {
    const q = clState.search.toLowerCase();
    const fields = [...(cfg.searchFields || []), ...clCustomColumns().map((c) => c.name)];
    rows = rows.filter((r) =>
      fields.some((f) => String(r.data[f] || "").toLowerCase().includes(q)) ||
      callPill(r.data).label.toLowerCase().includes(q) ||
      clAssignSt(r.data).label.toLowerCase().includes(q));
  }
  if (clState.statusFilter) rows = rows.filter((r) => clStatusMatch(r.data, clState.statusFilter));
  if (clState.remindFilter) rows = rows.filter((r) => callReminder(r.data)?.state === clState.remindFilter);
  if (clState.sort) {
    const { field, dir } = clState.sort;
    rows = [...rows].sort((a, b) => {
      const va = clSortValue(a, field), vb = clSortValue(b, field);
      let cmp;
      if (typeof va === "number" && typeof vb === "number") cmp = va - vb;
      else {
        const da = parseDateLoose(va), db = parseDateLoose(vb);
        cmp = da && db ? da - db : String(va).localeCompare(String(vb), undefined, { numeric: true });
      }
      return dir === "asc" ? cmp : -cmp;
    });
  }
  return rows;
}

function clStatusBadge(data) {
  const info = callInfo(data);
  const st = clAssignSt(data);
  let title = st.label;
  if (info.status === "attention") title = `Needs Attention: next visit ${clDaysPhrase(info.days)}, no outcome recorded`;
  return `<span class="cl-badge cl-tone-${st.tone}" title="${esc(title)}"><span class="cl-dot"></span>${esc(st.label)}</span>`;
}
function clActionCellHtml(r) {
  if (clIsTransition()) {

  }
  const p = callPill(r.data);
  return `<div class="cl-action-cell">
    <button type="button" class="cl-pill cl-tone-${p.tone}" data-cl-open data-uid="${r.uid}" aria-haspopup="dialog" aria-label="Action: ${esc(p.label)}. Change.">
      <span class="cl-pill-text">${esc(p.label)}</span>${chevronSmallSvg()}

function clRowClass(r) {
  const info = callInfo(r.data);
  return (info.key === "progress" ? "cl-row-progress " : "") + (info.status === "attention" ? "cl-row-attn" : "") + (clSel.has(r.uid) ? " cl-row-sel" : "");
}
function clRowHtml(cfg, r, cols) {
  const isExpanded = expandedRows.has(r.uid);
  const cells = cols.map((c) => {
    if (c === "__status") return `<td data-col="__status">${clStatusBadge(r.data)}</td>`;
    if (c === CL.ACTION) return `<td class="cl-action-td" data-col="${esc(c)}">${clActionCellHtml(r)}</td>`;
    const val = r.data[c] || "";
    const isDate = clIsDateCol(cfg, c);
    return `<td class="inline-cell${c === cfg.nameField ? " name-col" : ""}" data-col="${esc(c)}">
      <div class="inline-cell-wrap">
        <input type="text" class="inline-edit-input" data-uid="${r.uid}" data-field="${esc(c)}" value="${esc(val)}" placeholder="—" title="${esc(val)}" ${c === CL.TEAM ? 'list="cl-team-list"' : ""} />
        ${isDate ? `<button type="button" class="cal-btn" data-uid="${r.uid}" data-field="${esc(c)}" title="Pick a date" aria-label="Pick a date for ${esc(c)}">${calendarIconSvg()}</button>` : ""}
      </div>
    </td>`;
  }).join("");
  const main = `<tr data-row-for="${r.uid}" class="${clRowClass(r)}"><td class="cl-sel-td"><input type="checkbox" class="cl-sel" data-uid="${r.uid}" ${clSel.has(r.uid) ? "checked" : ""} aria-label="Select ${esc(r.displayName || "record")}" /></td>${cells}
    <td class="actions-cell">
      <button class="btn sm ghost" data-action="toggle-expand" data-uid="${r.uid}" title="${isExpanded ? "Hide details" : "View details"}" aria-label="${isExpanded ? "Hide details" : "View details"}">${isExpanded ? chevronUpSvg() : chevronDownSvg()}</button>
      <button class="btn sm ghost" data-action="edit-record" data-uid="${r.uid}" title="Edit in a form" aria-label="Edit in a form">${editIconSvg()}</button>
    </td>
  </tr>`;
  if (!isExpanded) return main;
  return main + `<tr class="expand-row" data-expand-for="${r.uid}"><td colspan="${cols.length + 2}">
    <div class="expand-panel">
      <strong>${esc(r.displayName || "This record")}</strong>
      <span class="text-muted" style="margin-left:8px">${esc(cfg.label)}${r.isImported ? " · Imported" : ""}</span>
      <div class="flex gap-3 mt-2" style="flex-wrap:wrap">
        ${r.identityKey ? `<a class="link-inline" href="#/patient/${encodeURIComponent(r.identityKey)}">View full patient profile across all tabs →</a>` : ""}
        <a class="link-inline" href="#/history?uid=${encodeURIComponent(r.uid)}">View change history for this record →</a>
      </div>
    </div>
  </td></tr>`;
}
function clRefreshRow(uid) {
  const region = document.getElementById("cl-table-region");
  const tr = region && [...region.querySelectorAll("tr[data-row-for]")].find((t) => t.dataset.rowFor === uid);
  const r = clRecord(uid);
  if (!tr || !r) return;
  tr.className = clRowClass(r);
  const st = [...tr.children].find((td) => td.dataset.col === "__status");
  if (st) st.innerHTML = clStatusBadge(r.data);
  const ac = [...tr.children].find((td) => td.dataset.col === CL.ACTION);
  if (ac) ac.innerHTML = clActionCellHtml(r);

function clRenderTable(cfg) {
  const region = document.getElementById("cl-table-region");
  if (!region) return;
  const cols = clColumns(cfg);
  const customNames = new Set(clCustomColumns().map((c) => c.name));
  const everything = clRecords();
  const rows = clFilteredRows(cfg);
  { const okUids = new Set(rows.map((r) => r.uid)); [...clSel].forEach((u) => { if (!okUids.has(u)) clSel.delete(u); }); clSelTotal = rows.length; }
  const total = rows.length;

  const all = clState.pageSize === "all";
  const size = all ? Math.max(total, 1) : clState.pageSize;
  const totalPages = Math.max(1, Math.ceil(total / size));
  clState.page = Math.min(Math.max(1, clState.page), totalPages);
  const start = (clState.page - 1) * size;
  const pageRows = rows.slice(start, start + size);

  const widths = cols.map((c) => clWidth(cfg, c));
  const tableW = widths.reduce((a, b) => a + b, 0) + CL_ACTIONS_COL_W + CL_SEL_COL_W;
  const teams = [...new Set(everything.map((r) => String(r.data[CL.TEAM] || "").trim()).filter(Boolean))].sort();

  const th = (c) => `<th data-col="${esc(c)}" draggable="true" title="Drag to reorder · drag the edge to resize · click to sort">
      <span class="cl-th-label">${esc(clColLabel(c))}</span>${sortArrow(clState.sort ? { sort: clState.sort } : {}, c)}${customNames.has(c) ? `<button type="button" class="cl-col-remove" data-remove-col="${esc(c)}" title="Remove this column" aria-label="Remove column ${esc(c)}">×</button>` : ""}
      <span class="cl-resize" data-col="${esc(c)}" role="separator" aria-orientation="vertical" aria-label="Resize ${esc(clColLabel(c))} column"></span>
    </th>`;

  const emptyMsg = everything.length
    ? `<div class="empty-state">${emptyIcon()}<div class="title">No records match your filters</div><div class="desc">Try clearing the search or status filters.</div></div>`
    : `<div class="empty-state">${emptyIcon()}<div class="title">No patients on this call list yet</div><div class="desc">${clIsTransition() ? "Use Import Records or Add Row to bring in the patients who need a transition." : "Use Import Records to bring in the upcoming-appointment call list."}</div></div>`;

  region.innerHTML = `
    <datalist id="cl-team-list">${teams.map((t) => `<option value="${esc(t)}"></option>`).join("")}</datalist>
    <div class="data-table-wrap cl-table-wrap">
      <table class="data-table cl-table" style="width:${tableW}px">
        <colgroup><col style="width:${CL_SEL_COL_W}px">${cols.map((c, i) => `<col data-col="${esc(c)}" style="width:${widths[i]}px">`).join("")}<col style="width:${CL_ACTIONS_COL_W}px"></colgroup>
        <thead><tr><th class="cl-sel-th" style="cursor:default"><input type="checkbox" class="cl-sel-all" aria-label="Select all" title="Select all" /></th>${cols.map(th).join("")}<th style="cursor:default">Actions</th></tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map((r) => clRowHtml(cfg, r, cols)).join("") : `<tr><td colspan="${cols.length + 2}">${emptyMsg}</td></tr>`}
        </tbody>
      </table>
    </div>
    ${all || totalPages === 1 ? "" : `
    <div class="pagination">
      <span>Page ${clState.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${clState.page === 1 ? "disabled" : ""} aria-label="First page">«</button>
        <button data-page="${clState.page - 1}" ${clState.page === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>
        <button data-page="${clState.page + 1}" ${clState.page === totalPages ? "disabled" : ""} aria-label="Next page">›</button>
        <button data-page="${totalPages}" ${clState.page === totalPages ? "disabled" : ""} aria-label="Last page">»</button>
      </div>
    </div>`}
  `;

  clSyncSel();
  const count = document.getElementById("cl-count");
  if (count) count.textContent = `${fmtNum(total)} record${total === 1 ? "" : "s"}${total !== everything.length ? ` of ${fmtNum(everything.length)}` : ""}`;
  document.querySelectorAll("#cl-rv button").forEach((b) => b.setAttribute("aria-pressed", String(String(clState.pageSize) === b.dataset.size)));
  const fs = document.getElementById("cl-filter-status"); if (fs) fs.value = clState.statusFilter;
  const fr = document.getElementById("cl-filter-remind"); if (fr) fr.value = clState.remindFilter;
}

function clSyncFilters(cfg) {
  clState.page = 1;
  clRenderTable(cfg);
  clRefreshKpi();
}

function wireCallListPage(cfg) {
  clClosePopover();
  clRenderTable(cfg);
  const region = document.getElementById("cl-table-region");

  // --- KPI: click a status tile / reminder chip to filter ---
  document.getElementById("cl-kpi").addEventListener("click", (e) => {
    const st = e.target.closest("[data-cl-status]");
    const rm = e.target.closest("[data-cl-remind]");
    if (st) clState.statusFilter = clState.statusFilter === st.dataset.clStatus ? "" : st.dataset.clStatus;
    else if (rm) clState.remindFilter = clState.remindFilter === rm.dataset.clRemind ? "" : rm.dataset.clRemind;
    else return;
    clSyncFilters(cfg);
  });

  // --- Toolbar ---
  document.getElementById("cl-search").addEventListener("input", debounce((e) => { clState.search = e.target.value; clState.page = 1; clRenderTable(cfg); }, 220));
  document.getElementById("cl-filter-status").addEventListener("change", (e) => { clState.statusFilter = e.target.value; clSyncFilters(cfg); });
  document.getElementById("cl-filter-remind").addEventListener("change", (e) => { clState.remindFilter = e.target.value; clSyncFilters(cfg); });
  document.getElementById("cl-reset").addEventListener("click", () => {
    Object.assign(clState, { search: "", statusFilter: "", remindFilter: "", sort: null, page: 1 });
    document.getElementById("cl-search").value = "";
    clSyncFilters(cfg);
    toast("Filters and sorting reset");
  });
  document.getElementById("cl-add-col").addEventListener("click", () => clOpenAddColumnModal(cfg));
 document.getElementById("cl-selall").addEventListener("change", (e) => clSelectAll(cfg, e.target.checked));
 document.getElementById("cl-del-sel").addEventListener("click", () => clDeleteSelected(cfg));
 region.addEventListener("change", (e) => {
 const cb = e.target;
 if (!cb.classList || !cb.classList.contains) return;
 if (cb.classList.contains("cl-sel-all")) { clSelectAll(cfg, cb.checked); return; }
 if (!cb.classList.contains("cl-sel")) return;
 if (cb.checked) clSel.add(cb.dataset.uid); else clSel.delete(cb.dataset.uid);
 const tr = cb.closest("tr");
 if (tr) tr.classList.toggle("cl-row-sel", cb.checked);
 clSyncSel();
 });
  document.getElementById("cl-add-row")?.addEventListener("click", () => openAddRowModal(cfg)); document.getElementById("cl-export").addEventListener("click", () => clExport(cfg));
  document.getElementById("cl-rv").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-size]");

    const firstIdx = oldSize === Infinity ? 0 : (clState.page - 1) * oldSize;
    clState.pageSize = b.dataset.size === "all" ? "all" : +b.dataset.size;
    clState.page = clState.pageSize === "all" ? 1 : Math.floor(firstIdx / clState.pageSize) + 1;

  });

  // --- Table (delegated; the region itself persists across re-renders) ---
  region.addEventListener("click", (e) => {
    const t = e.target;
    const pager = t.closest(".pager-btns button[data-page]");
    if (pager) { clState.page = +pager.dataset.page; clRenderTable(cfg); return; }
    const rm = t.closest("[data-remove-col]");
    if (rm) {
      const name = rm.dataset.removeCol;
      confirmDialog("Remove this column?", `"${name}" will be hidden for everyone. Values already typed into it stay saved in the records.`, () => {

    if (t.closest(".cl-resize")) return;
    const open = t.closest("[data-cl-open]");
    if (open) { clOpenActionPopover(open.dataset.uid, open); return; }
    const cal = t.closest(".cal-btn");
    if (cal) { openDatePickerFor(cal.parentElement.querySelector(".inline-edit-input")); return; }
    const act = t.closest("[data-action]");
    if (act) {
      const uid = act.dataset.uid;
      if (act.dataset.action === "toggle-expand") { expandedRows.has(uid) ? expandedRows.delete(uid) : expandedRows.add(uid); clRenderTable(cfg); }
      else if (act.dataset.action === "edit-record") openEditModal(uid, () => { clRenderTable(cfg); clRefreshKpi(); });
      else if (act.dataset.action === "delete-record") confirmDialog(
        "Archive this record?",
        "It will be hidden from all views but can be restored later. This does not modify the original workbook.",
        () => { softDeleteRecord(uid); toast("Record archived"); clRenderTable(cfg); clRefreshKpi(); renderSidebar(); });
      return;
    }
    const thEl = t.closest("th[data-col]");
    if (thEl && !clJustResized) {
      const field = thEl.dataset.col;
      clState.sort = clState.sort?.field === field ? { field, dir: clState.sort.dir === "asc" ? "desc" : "asc" } : { field, dir: "asc" };

  // Inline edits: blur is caught in the capture phase so it also fires for the
  // synthetic blur the shared date picker dispatches.
  region.addEventListener("blur", (e) => {
    const input = e.target;
    if (!input.classList?.contains("inline-edit-input")) return;
    const uid = input.dataset.uid, field = input.dataset.field;
    const rec = clRecord(uid);
    if (!rec || (rec.data[field] || "") === input.value) return;
    updateRecord(uid, { [field]: input.value });
    toast(`Saved "${field}"`);
    clRefreshRow(uid);
    clRefreshKpi();
    renderSidebar();
  }, true);
  region.addEventListener("keydown", (e) => {
    const input = e.target;
    if (!input.classList?.contains("inline-edit-input")) return;
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { input.value = clRecord(input.dataset.uid)?.data[input.dataset.field] || ""; input.blur(); }

  // --- Column resize ---
  region.addEventListener("pointerdown", (e) => {
    const h = e.target.closest(".cl-resize");
    if (!h) return;
    e.preventDefault(); e.stopPropagation();
    const col = h.dataset.col;
    const th = h.closest("th");
    const colEl = [...region.querySelectorAll("col[data-col]")].find((c) => c.dataset.col === col);
    const table = region.querySelector("table.cl-table");
    th.draggable = false;
    const startX = e.clientX, startW = th.getBoundingClientRect().width;

      h.removeEventListener("pointerup", up);

  region.addEventListener("dragstart", (e) => {
    const th = e.target.closest?.("th[data-col]");

    const th = e.target.closest?.("th[data-col]");
    if (!th || !dragCol) return;
    e.preventDefault();
    const r = th.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    region.querySelectorAll("th.cl-drop-before, th.cl-drop-after").forEach((t) => t.classList.remove("cl-drop-before", "cl-drop-after"));
    if (th.dataset.col !== dragCol) th.classList.add(after ? "cl-drop-after" : "cl-drop-before");
  });
  region.addEventListener("drop", (e) => {
    const th = e.target.closest?.("th[data-col]");
    if (!th || !dragCol) return;
    e.preventDefault();
    const r = th.getBoundingClientRect();
    clMoveColumn(cfg, dragCol, th.dataset.col, e.clientX > r.left + r.width / 2);
    dragCol = null; clearDrop();
    clRenderTable(cfg);
  });
  region.addEventListener("dragend", () => { dragCol = null; clearDrop(); });
}
let clJustResized = false;

// Background-sync refresh for the call list. Returns true if it handled the refresh.
function clSoftRefresh() {
  const { view, param } = parseHash();
  const region = document.getElementById("cl-table-region");
  if (view !== "sheet" || !isCallSheet(param) || !region) return false;
  clUse(param);
  if (clPopover) return true; // don't pull the menu out from under someone; the next sync catches up
  const wrap = region.querySelector(".cl-table-wrap");
  const pos = wrap ? { top: wrap.scrollTop, left: wrap.scrollLeft } : null;
  const mainTop = $root.scrollTop;
  renderSidebar();
  clRefreshKpi();
  clRenderTable(SHEET_BY_ID[CALL_SHEET_ID]);
  const wrap2 = region.querySelector(".cl-table-wrap");
  if (wrap2 && pos) { wrap2.scrollTop = pos.top; wrap2.scrollLeft = pos.left; }
  $root.scrollTop = mainTop;
  return true;
}

function clExport(cfg) {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const cols = clColumns(cfg).filter((c) => c !== "__status");
  const rows = clFilteredRows(cfg).map((r) => {
    const o = {};
    cols.forEach((c) => { o[c] = c === CL.ACTION ? callPill(r.data).label : r.data[c] || ""; });
    o["Status"] = clAssignSt(r.data).label;
    const rm = callReminder(r.data);
    if (!clIsTransition()) o["Reminder Date"] = rm?.date ? clFmtMDY(rm.date) : "";
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  XLSX.writeFile(wb, `${cfg.label.replace(/[^\w\- ]/g, "")}.xlsx`);
  toast(`Exported ${fmtNum(rows.length)} record${rows.length === 1 ? "" : "s"} (current filters and column order)`);
}

    let msg = "";

let clPopover = null;
let clSuppressOpenUntil = 0;
const CL_CLEAR = { [CL.ATTEMPT]: "", [CL.NOTE]: "", [CL.REMIND]: "", [CL.RESCHED]: "" };

function clFindPill(uid) {
  return [...document.querySelectorAll("#cl-table-region .cl-pill[data-cl-open]")].find((b) => b.dataset.uid === uid && !b.classList.contains("dashed") && b.closest(".cl-action-cell").firstElementChild === b) || null;
}
function clClosePopover(restoreFocus) {
  if (!clPopover) return;
  const { el, onDoc, onKey, onScroll, uid } = clPopover;
  el.remove();
  document.removeEventListener("mousedown", onDoc, true);
  document.removeEventListener("keydown", onKey, true);
  window.removeEventListener("resize", onScroll);
  window.removeEventListener("scroll", onScroll, true);
  clPopover = null;
  if (restoreFocus) clFindPill(uid)?.focus();
}
function clPlacePopover() {
  if (!clPopover) return;
  const a = clFindPill(clPopover.uid);
  if (!a) { clClosePopover(); return; }
  const r = a.getBoundingClientRect(), p = clPopover.el.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left), window.innerWidth - p.width - 8);
  let top = r.bottom + 6;
  if (top + p.height > window.innerHeight - 8) top = Math.max(8, r.top - p.height - 6);
  clPopover.el.style.left = left + "px";
  clPopover.el.style.top = top + "px";
}
function clOpenActionPopover(uid, anchor) {
  if (Date.now() < clSuppressOpenUntil) return;
  clClosePopover();
  const el = document.createElement("div");
  el.className = "cl-popover";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", "Set call action");
  document.body.appendChild(el);
  const onDoc = (e) => {
    if (el.contains(e.target)) return;
    const own = e.target.closest?.("[data-cl-open]");
    if (own && own.dataset.uid === uid) clSuppressOpenUntil = Date.now() + 250; // clicking the same pill again just closes
    clClosePopover();
  };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); clClosePopover(true); } };
  const onScroll = () => clPlacePopover();
  document.addEventListener("mousedown", onDoc, true);
  document.addEventListener("keydown", onKey, true);
  window.addEventListener("resize", onScroll);
  window.addEventListener("scroll", onScroll, true);
  clPopover = { el, uid, onDoc, onKey, onScroll };

  el.addEventListener("click", (e) => {
    const t = e.target;
    const opt = t.closest("[data-cl-act]");
    const att = t.closest("[data-cl-attempt]");
    if (opt) clChooseAction(uid, opt.dataset.clAct);
    else if (att) clApply(uid, { [CL.ATTEMPT]: att.dataset.clAttempt }), clPaintPopover();
    else if (t.closest("[data-cl-cal]")) { clClosePopover(); clOpenReschedModal(uid); }
    else if (t.closest("[data-cl-clear]")) { clApply(uid, { [CL.ACTION]: "", ...CL_CLEAR }, { toast: "Action cleared" }); clPaintPopover(); }
  });
  el.addEventListener("change", (e) => {
    if (e.target.id === "cl-note") {
      const v = e.target.value;
      clApply(uid, v === "For Callback" ? { [CL.NOTE]: v } : { [CL.NOTE]: v, [CL.REMIND]: "" });
      clPaintPopover();
    } else if (e.target.id === "cl-remind") {
      clApply(uid, { [CL.REMIND]: e.target.value }, { toast: e.target.value ? "Reminder saved" : undefined });
      clPaintPopover();
    }
  });
  clPaintPopover(true);
}
function clChooseAction(uid, key) {
  const rec = clRecord(uid);
  if (!rec) return;
  const d = rec.data;
  if (key === "resched") { clClosePopover(); clOpenReschedModal(uid); return; }
  const a = CALL_ACTIONS.find((x) => x.key === key);
  if (key === "progress") {
    clApply(uid, { [CL.ACTION]: a.label, [CL.ATTEMPT]: d[CL.ATTEMPT] || "1", [CL.NOTE]: d[CL.NOTE] || "No Answer", [CL.REMIND]: d[CL.REMIND] || "", [CL.RESCHED]: "" });
  } else {
    clApply(uid, { ...CL_CLEAR, [CL.ACTION]: a.label }, { toast: key === "call" ? undefined : `Marked "${a.label}"` });
  }
  clPaintPopover();
}
function clPaintPopover(initial) {
  if (!clPopover) return;
  const rec = clRecord(clPopover.uid);
  if (!rec) { clClosePopover(); return; }
  const d = rec.data;
  const info = callInfo(d);
  const stored = info.key;
  const hadFocus = document.activeElement?.closest?.(".cl-popover") ? document.activeElement.dataset.f : null;
  const check = `<svg class="cl-check" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let h = `<div class="cl-pop-title">${esc(rec.displayName || "Set action")}</div>`;
  if (info.flagged) h += `<div class="cl-pop-note">Next visit ${clDaysPhrase(info.days)}. Flagged Needs Attention until Confirmed, Refused or Resched is recorded.</div>`;
  h += `<div class="cl-opts" role="group" aria-label="Action">${CALL_ACTIONS.map((a) => `
      <button type="button" class="cl-opt cl-tone-${a.tone}${a.key === stored ? " on" : ""}" data-cl-act="${a.key}" data-f="act-${a.key}" aria-pressed="${a.key === stored}">
        <span class="cl-dot"></span>${esc(a.label)}${a.key === stored ? check : ""}
      </button>`).join("")}</div>`;
  if (stored === "progress") {
    const n = d[CL.ATTEMPT] || "1";
    const note = d[CL.NOTE] || "";
    h += `<div class="cl-pop-sec"><span class="cl-pop-label" id="cl-att-l">Attempt</span>
        <div class="cl-seg" role="group" aria-labelledby="cl-att-l">${["1", "2", "3"].map((v) => `<button type="button" data-cl-attempt="${v}" data-f="att-${v}" aria-pressed="${n === v}">${v}</button>`).join("")}</div></div>

        <select id="cl-note" data-f="note">${note ? "" : `<option value="" selected>Select a note…</option>`}${CALL_NOTES.map((x) => `<option value="${x}" ${x === note ? "selected" : ""}>${x}</option>`).join("")}</select></div>`;
    if (note === "For Callback") {
      h += `<div class="cl-pop-sec"><label class="cl-pop-label" for="cl-remind">Reminder date</label>
        <input type="date" id="cl-remind" data-f="remind" value="${esc(d[CL.REMIND] || "")}" />
        <div class="cl-pop-hint">Due today shows yellow, overdue red, upcoming blue.</div></div>`;
    }
  }
  if (stored === "resched") {
    const rd = clIsoToDate(d[CL.RESCHED]);
    h += `<div class="cl-pop-sec"><span class="cl-pop-label">New date</span>
      <div>${rd ? `<b>${clFmtMDY(rd)}</b> ` : `<span class="text-muted">No date chosen yet </span>`}<button type="button" class="cl-link-btn" data-cl-cal data-f="cal">${rd ? "Change date" : "Pick a date"}</button></div></div>`;
  }
  if (String(d[CL.ACTION] || "").trim()) h += `<div class="cl-pop-foot"><button type="button" class="cl-link-btn muted" data-cl-clear data-f="clear">Clear action</button></div>`;
  clPopover.el.innerHTML = h;
  clPlacePopover();
  const target = hadFocus ? clPopover.el.querySelector(`[data-f="${hadFocus}"]`) : initial ? clPopover.el.querySelector(".cl-opt.on") : null;
  target?.focus();
}

// ---------------------------------------------------------------------------
// Resched: monthly calendar
// ---------------------------------------------------------------------------
function clOpenReschedModal(uid) {
  const rec = clRecord(uid);
  if (!rec) return;
  const existing = clIsoToDate(rec.data[CL.RESCHED]);
  const today = clToday();
  let selected = existing ? clToIso(existing) : "";
  const seed = existing || today;
  let view = new Date(seed.getFullYear(), seed.getMonth(), 1);

  const modal = openModal(`
    <div class="modal-header"><div><h3>${existing ? "Edit reschedule date" : "Reschedule appointment"}</h3><p>${esc(rec.displayName || "Patient")} · choose the new date</p></div></div>
    <div class="modal-body"><div class="cl-cal" id="cl-cal"></div><div class="cl-cal-selected" id="cl-cal-sel" aria-live="polite"></div></div>
    <div class="modal-footer"><button class="btn" id="cl-cal-cancel">Cancel</button><button class="btn primary" id="cl-cal-save" disabled>Save</button></div>`);
  const cal = modal.querySelector("#cl-cal");
  const sel = modal.querySelector("#cl-cal-sel");
  const saveBtn = modal.querySelector("#cl-cal-save");

  const paint = (focusIso) => {
    const y = view.getFullYear(), m = view.getMonth();
    const gridStart = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const iso = clToIso(d);
      const cls = ["cl-cal-day", d.getMonth() !== m ? "dim" : "", iso === clToIso(today) ? "today" : "", iso === selected ? "sel" : ""].join(" ");
      cells += `<button type="button" class="${cls}" data-iso="${iso}" aria-pressed="${iso === selected}" aria-label="${CALL_MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}">${d.getDate()}</button>`;
    }
    cal.innerHTML = `
      <div class="cl-cal-head">
        <div class="cl-cal-title" aria-live="polite">${CALL_MONTHS[m]} ${y}</div>
        <div class="cl-cal-nav">
          <button type="button" data-nav="-1" aria-label="Previous month">‹</button>
          <button type="button" data-nav="today">Today</button>
          <button type="button" data-nav="1" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="cl-cal-grid" role="group" aria-label="Choose a date">
        ${["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map((w) => `<div class="cl-cal-dow" aria-hidden="true">${w}</div>`).join("")}${cells}
      </div>`;
    const sd = clIsoToDate(selected);
    sel.innerHTML = sd ? `Selected: <b>${clFmtMDY(sd)}</b>` : "Select a date";
    saveBtn.disabled = !sd;
    if (focusIso) cal.querySelector(`[data-nav="${focusIso}"]`)?.focus();
  };
  cal.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-nav]");
    const day = e.target.closest("[data-iso]");
    if (nav) {
      const v = nav.dataset.nav;
      view = v === "today" ? new Date(today.getFullYear(), today.getMonth(), 1) : new Date(view.getFullYear(), view.getMonth() + +v, 1);
      paint(v);
    } else if (day) {
      selected = day.dataset.iso;
      const dd = clIsoToDate(selected);
      if (dd.getMonth() !== view.getMonth()) view = new Date(dd.getFullYear(), dd.getMonth(), 1);
      paint();
      cal.querySelector(`[data-iso="${selected}"]`)?.focus();
    }
  });
  modal.querySelector("#cl-cal-cancel").addEventListener("click", closeModal);
  saveBtn.addEventListener("click", () => {
    const sd = clIsoToDate(selected);
    if (!sd) return;
    clApply(uid, { ...CL_CLEAR, [CL.ACTION]: "Resched", [CL.RESCHED]: selected }, { toast: `Rescheduled – ${clFmtMDY(sd)}` });
    closeModal();
  });
  paint();
}

    b.setAttribute('aria-label',o?'Close menu':'Open menu');
  }
  b.addEventListener('click',function(){setOpen(!document.body.classList.contains('sidebar-open'));});
  bd.addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
  var nav=document.getElementById('sidebar-nav');
  if(nav){nav.addEventListener('click',function(){setTimeout(function(){setOpen(false);},80);});}
  window.addEventListener('resize',function(){if(window.innerWidth>1000)setOpen(false);});
})();
</script>
</body>
</html>
