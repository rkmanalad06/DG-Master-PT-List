      }
      else if (act.dataset.action === "edit-record") openEditModal(uid, () => { clRenderTable(cfg); clRefreshKpi(); });
      else if (act.dataset.action === "delete-record") confirmDialog(
        "Archive this record?",
        "It will be hidden from all views but can be restored later. This does not modify the original workbook.",
        () => { softDeleteRecord(uid); toast("Record archived"); clRenderTable(cfg); clRefreshKpi(); renderSidebar(); });
      return;
    }
    const thEl = t.closest("th[data-col]");
    if (thEl && !clJustResized) {
      const field = thEl.dataset.col;
      clState.sort = clState.sort?.field === field ? { field, dir: clState.sort.dir === "asc" ? "desc" : "asc" } : { field, dir: "asc" };
      clRenderTable(cfg);
    }
  });

  // Inline edits: blur is caught in the capture phase so it also fires for the
  // synthetic blur the shared date picker dispatches.
  region.addEventListener("blur", (e) => {
    const input = e.target;
    if (!input.classList?.contains("inline-edit-input")) return;
    const uid = input.dataset.uid, field = input.dataset.field;
    const rec = clRecord(uid);
    if (!rec || (rec.data[field] || "") === input.value) return;
    updateRecord(uid, { [field]: input.value });
    if (clIsGeneric() && SHEET_BY_ID[CALL_SHEET_ID].completion?.field === field && Store.statusOverrides[uid]) setManualStatus(uid, null);
    toast(`Saved "${field}"`);
    if (CALL_SHEET_ID === "dg_pharmacy" && (field === DG_PHARMACY_FIELDS.lastSeen || field === DG_PHARMACY_FIELDS.prednisone || field === DG_PHARMACY_FIELDS.assigned)) {
      clRenderTable(SHEET_BY_ID[CALL_SHEET_ID]); clRefreshKpi(); renderSidebar();
    } else {
      clRefreshRow(uid);
    }
    clRefreshKpi();
    renderSidebar();
  }, true);
  region.addEventListener("keydown", (e) => {
    const input = e.target;
    if (!input.classList?.contains("inline-edit-input")) return;
    if (e.key === "Enter" && !(e.shiftKey && input.tagName === "TEXTAREA")) { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { input.value = clRecord(input.dataset.uid)?.data[input.dataset.field] || ""; input.blur(); }
  });

  // --- Column resize ---
  region.addEventListener("pointerdown", (e) => {
    const h = e.target.closest(".cl-resize");
    if (!h) return;
    e.preventDefault(); e.stopPropagation();
    const col = h.dataset.col;
    const th = h.closest("th");
    const colEl = [...region.querySelectorAll("col[data-col]")].find((c) => c.dataset.col === col);
    const table = region.querySelector("table.cl-table");
    th.draggable = false;
    const startX = e.clientX, startW = th.getBoundingClientRect().width;
    let w = startW;
    h.setPointerCapture(e.pointerId);
    h.classList.add("active");
    document.body.classList.add("cl-resizing");
    const move = (ev) => {
      w = Math.max(70, Math.round(startW + ev.clientX - startX));
      colEl.style.width = w + "px";
      table.style.width = [...table.querySelectorAll("col")].reduce((s, c) => s + parseFloat(c.style.width), 0) + "px";
    };
    const up = () => {
      h.removeEventListener("pointermove", move);
      h.removeEventListener("pointerup", up);
      h.removeEventListener("pointercancel", up);
      h.classList.remove("active");
      document.body.classList.remove("cl-resizing");
      th.draggable = true;
      const l = clLayoutLoad(); l.widths[col] = w; clLayoutSave(l); clGrowAll();
      clJustResized = true; setTimeout(() => { clJustResized = false; }, 0);
    };
    h.addEventListener("pointermove", move);
    h.addEventListener("pointerup", up);
    h.addEventListener("pointercancel", up);
  });

  // --- Column drag to reorder ---
  let dragCol = null;
  const clearDrop = () => region.querySelectorAll("th.cl-drop-before, th.cl-drop-after, th.cl-dragging").forEach((t) => t.classList.remove("cl-drop-before", "cl-drop-after", "cl-dragging"));
  region.addEventListener("dragstart", (e) => {
    const th = e.target.closest?.("th[data-col]");
    if (!th) return;
    dragCol = th.dataset.col;
    th.classList.add("cl-dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragCol);
  });
  region.addEventListener("dragover", (e) => {
    const th = e.target.closest?.("th[data-col]");
    if (!th || !dragCol) return;
    e.preventDefault();
    const r = th.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    region.querySelectorAll("th.cl-drop-before, th.cl-drop-after").forEach((t) => t.classList.remove("cl-drop-before", "cl-drop-after"));
    if (th.dataset.col !== dragCol) th.classList.add(after ? "cl-drop-after" : "cl-drop-before");
  });
  region.addEventListener("drop", (e) => {
    const th = e.target.closest?.("th[data-col]");
    if (!th || !dragCol) return;
    e.preventDefault();
    const r = th.getBoundingClientRect();
    clMoveColumn(cfg, dragCol, th.dataset.col, e.clientX > r.left + r.width / 2);
    dragCol = null; clearDrop();
    clRenderTable(cfg);
  });
  region.addEventListener("dragend", () => { dragCol = null; clearDrop(); });
}
let clJustResized = false;

// Background-sync refresh for the call list. Returns true if it handled the refresh.
function clSoftRefresh() {
  const { view, param } = parseHash();
  const region = document.getElementById("cl-table-region");
  if (view !== "sheet" || !isTableSheet(param) || !region) return false;
  clUse(param);
  if (clPopover) return true; // don't pull the menu out from under someone; the next sync catches up
  const wrap = region.querySelector(".cl-table-wrap");
  const pos = wrap ? { top: wrap.scrollTop, left: wrap.scrollLeft } : null;
  const mainTop = $root.scrollTop;
  renderSidebar();
  clRefreshKpi();
  clRenderTable(SHEET_BY_ID[CALL_SHEET_ID]);
  const wrap2 = region.querySelector(".cl-table-wrap");
  if (wrap2 && pos) { wrap2.scrollTop = pos.top; wrap2.scrollLeft = pos.left; }
  $root.scrollTop = mainTop;
  return true;
}

function clExport(cfg) {
  if (typeof XLSX === "undefined") return toast("Export library did not load (no internet access?)", "error");
  const cols = clColumns(cfg).filter((c) => c !== "__status");
  const rows = clFilteredRows(cfg).map((r) => {
    const o = {};
    cols.forEach((c) => { if (c === "__infusion") o[clColLabel(c)] = gcaOnInfusion(r) ? "Yes" : "No"; else if (c === "__month") { const m = clMonthInfo(r.data); o[clColLabel(c)] = m ? m.label : ""; } else o[clColLabel(c)] = c === CL.ACTION ? callPill(r.data).label : (r.data[c] || (clIsInfusion() && c === CL_CORR_FIELD ? callInfo(r.data).auto : "")) || ""; });
    o["Status"] = clIsGeneric() ? ((STATUS_META[r.status] || {}).label || "") : clAssignSt(r.data).label;
    const rm = callReminder(r.data);
    if (clIsInfusion()) o["Correction Status"] = clCorrLabel(r.data);
    if (CALL_SHEET_ID === "call_list_upcoming") o["Reminder Date"] = rm?.date ? clFmtMDY(rm.date) : "";
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label.slice(0, 31));
  XLSX.writeFile(wb, `${cfg.label.replace(/[^\w\- ]/g, "")}.xlsx`);
  toast(`Exported ${fmtNum(rows.length)} record${rows.length === 1 ? "" : "s"} (current filters and column order)`);
}

function clOpenAddColumnModal(cfg) {

    <div class="modal-header"><div><h3>Add column</h3><p>Adds an editable column to this call list for everyone.</p></div></div>
    <div class="modal-body">
      <div class="form-group"><label for="cl-newcol-name">Column name</label><input type="text" id="cl-newcol-name" maxlength="40" autocomplete="off" /></div>
      <div class="form-group"><label for="cl-newcol-type">Type</label>

    </div>
    <div class="modal-footer"><button class="btn" id="cl-newcol-cancel">Cancel</button><button class="btn primary" id="cl-newcol-save">Add Column</button></div>`);
  const nameEl = modal.querySelector("#cl-newcol-name");
  const err = modal.querySelector("#cl-newcol-err");
  nameEl.focus();
  modal.querySelector("#cl-newcol-cancel").addEventListener("click", closeModal);
  const save = () => {
    const name = nameEl.value.trim().replace(/\s+/g, " ");
    const existing = [...clColumns(cfg).map(clColLabel), ...(RAW_SHEETS[cfg.id]?.headers || []), "Actions", "Status", CL.ATTEMPT, CL.NOTE, CL.RESCHED, CL.REMIND].map((s) => s.toLowerCase());
    let msg = "";
    if (!name) msg = "Give the column a name.";
    else if (existing.includes(name.toLowerCase())) msg = `A column named "${name}" already exists.`;
    else if (name.startsWith("__")) msg = "Column names can't start with two underscores.";
    if (msg) { err.textContent = msg; err.classList.add("cl-err"); nameEl.focus(); return; }
    clSaveCustomColumns([...clCustomColumns(), { name, type: modal.querySelector("#cl-newcol-type").value }]);

// ---------------------------------------------------------------------------
// Action popover
// ---------------------------------------------------------------------------
let clPopover = null;
let clSuppressOpenUntil = 0;
const CL_CLEAR = { [CL.ATTEMPT]: "", [CL.NOTE]: "", [CL.REMIND]: "", [CL.RESCHED]: "" };

function clFindPill(uid) {
  return [...document.querySelectorAll("#cl-table-region .cl-pill[data-cl-open]")].find((b) => b.dataset.uid === uid && !b.classList.contains("dashed") && b.closest(".cl-action-cell").firstElementChild === b) || null;
}
function clClosePopover(restoreFocus) {
  if (!clPopover) return;
  const { el, onDoc, onKey, onScroll, uid } = clPopover;
  el.remove();
  document.removeEventListener("mousedown", onDoc, true);
  document.removeEventListener("keydown", onKey, true);
  window.removeEventListener("resize", onScroll);
  window.removeEventListener("scroll", onScroll, true);
  clPopover = null;
  if (restoreFocus) clFindPill(uid)?.focus();
}
function clPlacePopover() {
  if (!clPopover) return;
  const a = clFindPill(clPopover.uid);
  if (!a) { clClosePopover(); return; }
  const r = a.getBoundingClientRect(), p = clPopover.el.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left), window.innerWidth - p.width - 8);
  let top = r.bottom + 6;
  if (top + p.height > window.innerHeight - 8) top = Math.max(8, r.top - p.height - 6);
  clPopover.el.style.left = left + "px";
  clPopover.el.style.top = top + "px";
}
function clOpenActionPopover(uid, anchor) {
  if (Date.now() < clSuppressOpenUntil) return;
  clClosePopover();
  const el = document.createElement("div");
  el.className = "cl-popover";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", "Set call action");
  document.body.appendChild(el);
  const onDoc = (e) => {
    if (el.contains(e.target)) return;
    const own = e.target.closest?.("[data-cl-open]");
    if (own && own.dataset.uid === uid) clSuppressOpenUntil = Date.now() + 250; // clicking the same pill again just closes
    clClosePopover();
  };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); clClosePopover(true); } };
  const onScroll = () => clPlacePopover();
  document.addEventListener("mousedown", onDoc, true);
  document.addEventListener("keydown", onKey, true);
  window.addEventListener("resize", onScroll);
  window.addEventListener("scroll", onScroll, true);
  clPopover = { el, uid, onDoc, onKey, onScroll, psa: CALL_SHEET_ID === "psa_and_psoriasis" && anchor?.dataset?.psa === "1" };

  el.addEventListener("click", (e) => {
    const t = e.target;
    const opt = t.closest("[data-cl-act]");
    const att = t.closest("[data-cl-attempt]");
    if (opt) {
      if (clPopover?.psa) psaCallChooseStatus(uid, opt.dataset.clAct);
      else clChooseAction(uid, opt.dataset.clAct);
    }
    else if (att) clApply(uid, { [CL.ATTEMPT]: att.dataset.clAttempt }), clPaintPopover();
    else if (t.closest("[data-cl-cal]")) { clClosePopover(); clOpenReschedModal(uid); }
    else if (t.closest("[data-cl-clear]")) { clApply(uid, { [CL.ACTION]: "", ...CL_CLEAR }, { toast: "Action cleared" }); clPaintPopover(); }
  });
  el.addEventListener("change", (e) => {
    if (e.target.id === "cl-note") {
      const v = e.target.value;
      clApply(uid, v === "For Callback" ? { [CL.NOTE]: v } : { [CL.NOTE]: v, [CL.REMIND]: "" });
      clPaintPopover();
    } else if (e.target.id === "cl-remind") {
      clApply(uid, { [CL.REMIND]: e.target.value }, { toast: e.target.value ? "Reminder saved" : undefined });
      clPaintPopover();
    }
  });
  clPaintPopover(true);
}
function psaCallChooseStatus(uid, key) {
  const rec = clRecord(uid);
  if (!rec) return;
  const d = rec.data;
  const a = psaCallStatusOptions().find((x) => x.key === key);
  if (!a) return;
  if (key === "resched") {
    clClosePopover();
    clOpenPsaReschedModal(uid);
    return;
  }
  if (key === "progress") {
    clApply(uid, { [PSA_CALL_STATUS_FIELD]: a.label, [CL.ATTEMPT]: d[CL.ATTEMPT] || "1", [CL.NOTE]: d[CL.NOTE] || "No Answer", [CL.REMIND]: d[CL.REMIND] || "", [CL.RESCHED]: "" });
  } else {
    clApply(uid, { [PSA_CALL_STATUS_FIELD]: a.label, [CL.ATTEMPT]: "", [CL.NOTE]: "", [CL.REMIND]: "", [CL.RESCHED]: "" }, { toast: `Marked "${a.label}"` });
  }
  clPaintPopover();
}
function clOpenPsaReschedModal(uid) {
  // Reuse the existing reschedule calendar but save the result into Call Status.
  const rec = clRecord(uid);
  if (!rec) return;
  const modal = openModal(`<div class="modal-header"><div><h3>Reschedule call</h3><p>Select the new date.</p></div></div><div class="modal-body"><input type="date" id="psa-resched-date" class="ac-in" value="${esc(rec.data[CL.RESCHED] || "")}" /></div><div class="modal-footer"><button class="btn" id="psa-resched-cancel">Cancel</button><button class="btn primary" id="psa-resched-save">Save</button></div>`);
  modal.querySelector("#psa-resched-cancel").addEventListener("click", closeModal);
  modal.querySelector("#psa-resched-save").addEventListener("click", () => {
    const v = modal.querySelector("#psa-resched-date").value;
    const a = psaCallStatusOptions().find((x) => x.key === "resched");
    if (!v || !a) return;
    clApply(uid, { [PSA_CALL_STATUS_FIELD]: a.label, [CL.RESCHED]: v, [CL.ATTEMPT]: "", [CL.NOTE]: "", [CL.REMIND]: "" }, { toast: `Rescheduled – ${clFmtMDY(clIsoToDate(v))}` });
    closeModal();
  });
}
function clChooseAction(uid, key) {
  const rec = clRecord(uid);
  if (!rec) return;
  const d = rec.data;
  if (key === "resched") { clClosePopover(); clOpenReschedModal(uid); return; }
  const a = CALL_ACTIONS.find((x) => x.key === key);
  if (key === "progress") {
    clApply(uid, { [CL.ACTION]: a.label, [CL.ATTEMPT]: d[CL.ATTEMPT] || "1", [CL.NOTE]: d[CL.NOTE] || "No Answer", [CL.REMIND]: d[CL.REMIND] || "", [CL.RESCHED]: "" });
  } else {
    clApply(uid, { ...CL_CLEAR, [CL.ACTION]: a.label }, { toast: key === "call" ? undefined : `Marked "${a.label}"` });
  }
  clPaintPopover();
}
function clPaintPopover(initial) {
  if (!clPopover) return;
  const rec = clRecord(clPopover.uid);
  if (!rec) { clClosePopover(); return; }
  const d = rec.data;
  const isPsa = !!clPopover.psa;
  const info = isPsa ? psaCallStatusInfo(d) : callInfo(d);
  const stored = isPsa ? info.key : info.key;
  const hadFocus = document.activeElement?.closest?.(".cl-popover") ? document.activeElement.dataset.f : null;
  const check = `<svg class="cl-check" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let h = `<div class="cl-pop-title">${esc(rec.displayName || (isPsa ? "Set call status" : "Set action"))}</div>`;
  if (!isPsa && info.flagged) h += `<div class="cl-pop-note">Next visit ${clDaysPhrase(info.days)}. Flagged Needs Attention until Confirmed, Refused or Resched is recorded.</div>`;
  const popOpts = isPsa ? psaCallStatusOptions() : CALL_ACTIONS;
  h += `<div class="cl-opts" role="group" aria-label="${isPsa ? "Call Status" : "Action"}">${popOpts.map((a) => `
      <button type="button" class="cl-opt cl-tone-${a.tone}${a.key === stored ? " on" : ""}" data-cl-act="${a.key}" data-f="act-${a.key}" aria-pressed="${a.key === stored}">
        <span class="cl-dot"></span>${esc(a.label)}${a.key === stored ? check : ""}
      </button>`).join("")}</div>`;
  if (stored === "progress") {
    const n = d[CL.ATTEMPT] || "1";
    const note = d[CL.NOTE] || "";
    h += `<div class="cl-pop-sec"><span class="cl-pop-label" id="cl-att-l">Attempt</span>
        <div class="cl-seg" role="group" aria-labelledby="cl-att-l">${["1", "2", "3"].map((v) => `<button type="button" data-cl-attempt="${v}" data-f="att-${v}" aria-pressed="${n === v}">${v}</button>`).join("")}</div></div>
      <div class="cl-pop-sec"><label class="cl-pop-label" for="cl-note">Notes</label>
        <select id="cl-note" data-f="note">${note ? "" : `<option value="" selected>Select a note…</option>`}${CALL_NOTES.map((x) => `<option value="${x}" ${x === note ? "selected" : ""}>${x}</option>`).join("")}</select></div>`;
    if (note === "For Callback") {
      h += `<div class="cl-pop-sec"><label class="cl-pop-label" for="cl-remind">Reminder date</label>
        <input type="date" id="cl-remind" data-f="remind" value="${esc(d[CL.REMIND] || "")}" />
        <div class="cl-pop-hint">Due today shows yellow, overdue red, upcoming blue.</div></div>`;
    }
  }
  if (stored === "resched") {
    const rd = clIsoToDate(d[CL.RESCHED]);
    h += `<div class="cl-pop-sec"><span class="cl-pop-label">New date</span>
      <div>${rd ? `<b>${clFmtMDY(rd)}</b> ` : `<span class="text-muted">No date chosen yet </span>`}<button type="button" class="cl-link-btn" data-cl-cal data-f="cal">${rd ? "Change date" : "Pick a date"}</button></div></div>`;
  }
  if (String(d[CL.ACTION] || "").trim()) h += `<div class="cl-pop-foot"><button type="button" class="cl-link-btn muted" data-cl-clear data-f="clear">Clear action</button></div>`;
  clPopover.el.innerHTML = h;
  clPlacePopover();
  const target = hadFocus ? clPopover.el.querySelector(`[data-f="${hadFocus}"]`) : initial ? clPopover.el.querySelector(".cl-opt.on") : null;
  target?.focus();
}

// ---------------------------------------------------------------------------
// Resched: monthly calendar
// ---------------------------------------------------------------------------
function clOpenReschedModal(uid) {
  const rec = clRecord(uid);
  if (!rec) return;
  const existing = clIsoToDate(rec.data[CL.RESCHED]);
  const today = clToday();
  let selected = existing ? clToIso(existing) : "";
  const seed = existing || today;
  let view = new Date(seed.getFullYear(), seed.getMonth(), 1);

  const modal = openModal(`
    <div class="modal-header"><div><h3>${existing ? "Edit reschedule date" : "Reschedule appointment"}</h3><p>${esc(rec.displayName || "Patient")} · choose the new date</p></div></div>
    <div class="modal-body"><div class="cl-cal" id="cl-cal"></div><div class="cl-cal-selected" id="cl-cal-sel" aria-live="polite"></div></div>
    <div class="modal-footer"><button class="btn" id="cl-cal-cancel">Cancel</button><button class="btn primary" id="cl-cal-save" disabled>Save</button></div>`);
  const cal = modal.querySelector("#cl-cal");
  const sel = modal.querySelector("#cl-cal-sel");
  const saveBtn = modal.querySelector("#cl-cal-save");

  const paint = (focusIso) => {
    const y = view.getFullYear(), m = view.getMonth();
    const gridStart = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const iso = clToIso(d);
      const cls = ["cl-cal-day", d.getMonth() !== m ? "dim" : "", iso === clToIso(today) ? "today" : "", iso === selected ? "sel" : ""].join(" ");
      cells += `<button type="button" class="${cls}" data-iso="${iso}" aria-pressed="${iso === selected}" aria-label="${CALL_MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}">${d.getDate()}</button>`;
    }
    cal.innerHTML = `
      <div class="cl-cal-head">
        <div class="cl-cal-title" aria-live="polite">${CALL_MONTHS[m]} ${y}</div>
        <div class="cl-cal-nav">
          <button type="button" data-nav="-1" aria-label="Previous month">‹</button>
          <button type="button" data-nav="today">Today</button>
          <button type="button" data-nav="1" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="cl-cal-grid" role="group" aria-label="Choose a date">
        ${["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map((w) => `<div class="cl-cal-dow" aria-hidden="true">${w}</div>`).join("")}${cells}
      </div>`;
    const sd = clIsoToDate(selected);
    sel.innerHTML = sd ? `Selected: <b>${clFmtMDY(sd)}</b>` : "Select a date";
    saveBtn.disabled = !sd;
    if (focusIso) cal.querySelector(`[data-nav="${focusIso}"]`)?.focus();
  };
  cal.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-nav]");
    const day = e.target.closest("[data-iso]");
    if (nav) {
      const v = nav.dataset.nav;
      view = v === "today" ? new Date(today.getFullYear(), today.getMonth(), 1) : new Date(view.getFullYear(), view.getMonth() + +v, 1);
      paint(v);
    } else if (day) {
      selected = day.dataset.iso;
      const dd = clIsoToDate(selected);
      if (dd.getMonth() !== view.getMonth()) view = new Date(dd.getFullYear(), dd.getMonth(), 1);
      paint();
      cal.querySelector(`[data-iso="${selected}"]`)?.focus();
    }
  });
  modal.querySelector("#cl-cal-cancel").addEventListener("click", closeModal);
  saveBtn.addEventListener("click", () => {
    const sd = clIsoToDate(selected);
    if (!sd) return;
    clApply(uid, { ...CL_CLEAR, [CL.ACTION]: "Resched", [CL.RESCHED]: selected }, { toast: `Rescheduled – ${clFmtMDY(sd)}` });
    closeModal();
  });
  paint();
}

// ---------------------------------------------------------------------------
// PIN gate (a deterrent, not real security: the app runs in the visitor's browser)
// ---------------------------------------------------------------------------
async function acHash(pin, salt) {
  const text = salt + ":" + pin;
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { /* fall back below */ }
  let h = 5381;
  for (const ch of text) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0;
  return "x" + h.toString(16);
}
function acUnlocked() {
  const h = String(acRec().pinHash || "");
  if (!h) return false;
  let s = "";
  try { s = sessionStorage.getItem("dg_admin_ok") || ""; } catch (e) { /* ignore */ }
  return (s || acMemOk) === h;
}
function acSetUnlocked(h) { acMemOk = h; try { sessionStorage.setItem("dg_admin_ok", h); } catch (e) { /* ignore */ } }
function acLock() { acMemOk = ""; try { sessionStorage.removeItem("dg_admin_ok"); } catch (e) { /* ignore */ } AC_PREVIEW = false; }

    nameField: t.nameCol || cols[0], dateFields: [],

  if (!force && sig === AC_SIG) return;
  AC_SIG = sig;

  GROUPS.forEach((g) => { if (g.__base === undefined) g.__base = g.label; g.label = (a.groups && a.groups[g.id]) || g.__base; });

  // new tabs
  const wanted = new Set((a.customTabs || []).map((t) => t.id));

    const c = SHEET_CONFIG[i];
    if (c.custom && !wanted.has(c.id)) { SHEET_CONFIG.splice(i, 1); delete SHEET_BY_ID[c.id]; delete ASSIGN_TABS[c.id]; }
  }
  (a.customTabs || []).forEach((t) => {
    let c = SHEET_BY_ID[t.id];

    c.nameField = t.nameCol || (t.cols || [])[0];
    c.completion = { field: t.assignCol, mode: "nonblank", label: (t.assignCol || "Assigned") + " is filled in" };
    c.__base = { label: t.label, shortLabel: t.label, group: t.group || "diagnosis" };
    ASSIGN_TABS[t.id] = t.assignCol;
    const heads = (t.cols || []).slice();
    c.defaultHeaders = heads; c.searchFields = heads.slice(); c.inlineFields = [t.assignCol].filter(Boolean);
    if (RAW_SHEETS[t.id] && Array.isArray(RAW_SHEETS[t.id].headers)) heads.forEach((h) => { if (!RAW_SHEETS[t.id].headers.includes(h)) RAW_SHEETS[t.id].headers.push(h); });
  });

  // names, groups and visibility
  SHEET_CONFIG.forEach((c, i) => {
    if (c.__base === undefined) { c.__base = { label: c.label, shortLabel: c.shortLabel, group: c.group }; c.__i = i; }
    const o = (a.tabs && a.tabs[c.id]) || {};

    c.group = o.group || c.__base.group;

  // option lists
  const opt = a.options || {};
  CALL_ACTIONS.forEach((x) => {
    if (x.__base === undefined) x.__base = { label: x.label, tone: x.tone };
    const o = (opt.actions || {})[x.key] || {};

  const notes = Array.isArray(opt.notes) && opt.notes.length ? opt.notes : CALL_NOTES.__base;
  CALL_NOTES.splice(0, CALL_NOTES.length, ...notes);
  Object.keys(CL_PA_LABELS).forEach((k) => { CL_PA_LABELS[k] = ((opt.pa || {})[k]) || CL_PA_LABELS.__base[k]; });
  invalidateCache();

const BI_DEF = {
  pa: { resubmit: "resubmit, re-submit", approved: "approv", sent: "sent, submitted" },
  corr: { notresolved: "not resolved, not-resolved, not_resolved, notresolved, unresolved", resolved: "resolved", progress: "progress" },
  osteo: { jp: "jp, justin, putz", su: "su, sabahat, usmani", cancel: "cancel" },

  dexa: { col: "dexa", yes: "y, yes", chip: "Add DEXA to appt" },

function biText(g, k) { const o = (((AC().builtin || {})[g]) || {})[k]; return typeof o === "string" && o.trim() ? o.trim() : BI_DEF[g][k]; }
function biList(g, k) { return biText(g, k).split(",").map((x) => x.trim().toLowerCase()).filter(Boolean); }

// mode: has = anywhere in the text, start = at the start of a word, word = a whole word, lead = at the very start
function biRe(words, mode) {

  let re = BI_RE.get(key);

  const alt = words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  if (!alt) re = /(?!)/;
  else if (mode === "word") re = new RegExp("(?:^|[^a-z0-9])(?:" + alt + ")(?![a-z0-9])", "i");
  else if (mode === "start") re = new RegExp("(?:^|[^a-z0-9])(?:" + alt + ")", "i");
  else if (mode === "lead") re = new RegExp("^\\s*(?:" + alt + ")(?![a-z0-9])", "i");

}
function biMatch(g, k, mode, text) { return biRe(biList(g, k), mode).test(String(text == null ? "" : text)); }

function importTargets(sheetId, fallbackHeaders) {

  const keys = base.slice();
  const info = clWith(sheetId, () => ({ custom: clCustomColumns().map((c) => c.name), hidden: new Set(clHiddenCols()) }));
  info.custom.forEach((k) => { if (!keys.includes(k)) keys.push(k); });
  const cc = acColCfg(sheetId);
  return keys.map((k) => {
    const label = colLabelFor(sheetId, k);

function importTargetText(t) {

const impLoose = (x) => String(x == null ? "" : x).toLowerCase().replace(/[^a-z0-9]+/g, "");
function importAutoMap(sheetId, incomingHeaders, fallbackHeaders) {
  const targets = importTargets(sheetId, fallbackHeaders);
  const cfg = SHEET_BY_ID[sheetId];
  const mapping = {}, used = new Set();
  const norm = (x) => String(x == null ? "" : x).toLowerCase().trim();
  const claim = (h, t) => { mapping[h] = t.key; used.add(t.key); };
  const names = (t) => [t.label, t.key, ...t.aliases];
  // exact (current name, original name or an earlier name)
  for (const h of incomingHeaders) {
    const t = targets.find((x) => !used.has(x.key) && names(x).some((n) => norm(n) === norm(h)));
    if (t) claim(h, t);
  }
  // ignoring case, spaces and punctuation ("Acc#" = "Acc #")
  for (const h of incomingHeaders) {
    if (mapping[h] || !impLoose(h)) continue;
    const c = targets.filter((x) => !used.has(x.key) && names(x).some((n) => impLoose(n) === impLoose(h)));
    if (c.length === 1) claim(h, c[0]);
  }
  // headers of the old DG Infusion PAs layout
  if (sheetId === "dg_infusion_pas") {
    const lc = Object.fromEntries(Object.entries(INF_OLD_TO_NEW).map(([o, n]) => [o.toLowerCase().trim(), n]));
    for (const h of incomingHeaders) {
      if (mapping[h]) continue;
      const t = targets.find((x) => !used.has(x.key) && x.key === lc[norm(h)]);
      if (t) claim(h, t);
    }
  }
  // DG Infusion - Other Ins.: common spellings of the two columns every infusion tab shares
  if (sheetId === "dg_infusion_other") {
    const al = { corrections: "Corrections / Notes", correction: "Corrections / Notes", notes: "Corrections / Notes", correctionsnotes: "Corrections / Notes", correctionnotes: "Corrections / Notes", statuscorrectionsnotes: "Corrections / Notes",
      priorauth: "PA Initiated / Done", pa: "PA Initiated / Done", padone: "PA Initiated / Done", painitiated: "PA Initiated / Done", painitiateddone: "PA Initiated / Done", priorauthinitiateddone: "PA Initiated / Done", priorauthinitiated: "PA Initiated / Done" };
    for (const h of incomingHeaders) {
      if (mapping[h]) continue;
      const t = targets.find((x) => !used.has(x.key) && x.key === al[impLoose(h)]);
      if (t) claim(h, t);
    }
  }
  // 0908-0911: the first column is headed with the day ("DG Tuesday patients 9/8") and holds the patient names
  if (cfg && cfg.dayGroups && cfg.nameField && !used.has(cfg.nameField)) {
    const h = incomingHeaders.find((x) => !mapping[x] && /^\s*(?:dg\s+)?(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\s*(?:patients?)?\b/i.test(x));
    if (h) { mapping[h] = cfg.nameField; used.add(cfg.nameField); }
  }
  incomingHeaders.forEach((h) => { if (!mapping[h]) mapping[h] = ""; });
  return mapping;
}

function acWireGate() {
  const pin = document.getElementById("ac-pin"), pin2 = document.getElementById("ac-pin2"), err = document.getElementById("ac-gate-err");

    const has = !!acRec().pinHash;
    const v = pin.value;

      if (v !== (pin2 && pin2.value)) { err.textContent = "The two PINs don't match."; return; }

function acColMove(k, dir) {

// Calculated conditions a row rule can use: [label, operators]
function acVirtDefs(id) {
  return {
    __assigned: ["Assignment status (per the Status rules)", [["yes", "is assigned"], ["no", "is not assigned"]]],
    __corr: ["Correction status", AC_CORR_OPS],
    __pa: ["Prior Auth status (" + colLabelFor(id, CL_PA_FIELD) + ")", acPaOps()],
    __attn: ["Needs Attention (per the Status rules)", [["yes", "is flagged"], ["no", "is not flagged"]]],
    __progress: ["Call in progress", [["yes", "is in progress"], ["no", "is not in progress"]]],
    __high: ["High priority (Built-in rules)", [["yes", "is high priority"], ["no", "is not high priority"]]],
    __aetna: ["Aetna insurance (Built-in rules)", [["yes", "is Aetna"], ["no", "is not Aetna"]]],
  };
}
function acVirtKeys(id, ak) {
  const kind = acKind(id);
  if (kind === "infusion") return ak === "hl" ? ["__pa", "__corr", "__assigned"] : ["__pa"];
  if (ak !== "hl") return [];
  if (id === "psa_and_psoriasis") return ["__assigned", "__high", "__aetna"];
  if (id === "call_list_upcoming") return ["__assigned", "__attn", "__progress"];
  if (id === "dg_osteoporosis_pas") return ["__assigned", "__attn"];
  return kind !== "generic" ? ["__assigned"] : [];
}
function acAlList(d, id, ak) {
  d.alerts = d.alerts || {};
  const o = (d.alerts[id] = d.alerts[id] || {});
  if (!Array.isArray(o[ak])) o[ak] = JSON.parse(JSON.stringify(acAlertsOf(d, id)[ak]));
  return o[ak];
}
function acAlertsHtml() {
  const id = acEnsureSheet();

      <select class="ac-in" data-ac="alc-op" ${at}>${ops.map(([v, l]) => `<option value="${v}" ${cd.op === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>

          : `<div class="form-group"><label>Correction to set</label><input class="ac-in" data-ac="al-name" ${at} value="${esc(r.text || "")}" placeholder="Wrong dates" /></div>`}
        <div class="form-group"><label>&nbsp;</label><div style="display:flex;gap:6px">
          <button class="btn sm ghost" data-ac="al-up" ${at} ${ri === 0 ? "disabled" : ""} aria-label="Move up">\u2191</button>

      </div>
      <div class="ac-cond-h">${ak === "hl" ? "Color the whole row when" : "Add this correction when"} <select class="ac-in ac-sm" data-ac="al-logic" ${at}><option value="all" ${r.logic !== "any" ? "selected" : ""}>ALL</option><option value="any" ${r.logic === "any" ? "selected" : ""}>ANY</option></select> of these are true${has ? ":" : " (add at least one condition):"}</div>
      ${condRows(ak, ri, r.conds)}
      <button class="btn sm" data-ac="alc-add" ${at}>+ Add condition</button>
      <div style="margin-top:12px">${live}</div>
    </div>`;
  };
  const hlCards = al.hl.map((r, i) => box("hl", r, i, al.hl.length)).join("");

// ---------- wiring ----------

  root.addEventListener("click", (e) => { if (parseHash().view === "admin") acOnEvent(e, "click"); });

    case "cx-label": acEdit((d) => { cardOf(d).label = String(v).trim(); }); break;

    case "cx-mcol": acEdit((d) => { cardOf(d).col = v; }); break;

    case "cx-dec": acEdit((d) => { cardOf(d).decimals = +v; }); break;
    case "cd-add": acEdit((d) => { const c = cardOf(d), ck = el.dataset.ck || "conds"; c[ck] = c[ck] || []; c[ck].push({ col: acDataCols(id)[0] || "", op: "filled", val: "" }); }); break;

    case "cd-col": acEdit((d) => { const cd = cardOf(d)[el.dataset.ck || "conds"][di]; cd.col = v; if (v === "__assigned") { cd.op = "yes"; cd.val = ""; } else if (cd.op === "yes" || cd.op === "no") cd.op = "filled"; }); break;
    case "cd-op": acEdit((d) => { const cd = cardOf(d)[el.dataset.ck || "conds"][di]; cd.op = v; if ((v === "dbefore" || v === "dafter") && !acDataCols(id).includes(cd.val)) cd.val = acDataCols(id).find((x) => x !== cd.col) || ""; }); break;
    case "cd-val": acEdit((d) => { cardOf(d)[el.dataset.ck || "conds"][di].val = String(v); }); break;
    // PSA & Psoriasis call status options
    case "psa-status-add": {
      acEdit((d) => {
        d.options = d.options || {};
        const list = Array.isArray(d.options.psaCallStatuses) && d.options.psaCallStatuses.length ? d.options.psaCallStatuses.slice() : PSA_CALL_STATUS_DEFAULTS.map((x) => ({...x}));
        let n = "New status", i = 2;

        const value = String(v).trim();
        if (i < 0 || i >= list.length || !value) return;

        if (i >= 0 && i < list.length) list[i] = { ...list[i], tone: v };

      });
      return;
    }
    // DG Pharmacy status options
    case "dg-status-add": {
      acEdit((d) => {
        d.options = d.options || {};

    case "dg-status-edit": {
      const i = +el.dataset.i;
      acEdit((d) => {
        d.options = d.options || {};
        const list = Array.isArray(d.options.dgPharmacyStatuses) ? d.options.dgPharmacyStatuses.slice() : DG_PHARMACY_DEFAULT_STATUS_OPTIONS.slice();
        if (i < 0 || i >= list.length) return;
        const value = String(v).trim();
        if (!value) return;
        const duplicate = list.findIndex((x, idx) => idx !== i && String(x).trim().toLowerCase() === value.toLowerCase());
        if (duplicate >= 0) return;
        list[i] = value;
        d.options.dgPharmacyStatuses = list;
      });

    }
    case "dg-status-del": {
      const i = +el.dataset.i;

        acRefresh();
      });
      return;
    }
    // options
    case "act-label": case "act-tone": acEdit((d) => {
      const o = ((d.options.actions = d.options.actions || {})[k] = d.options.actions[k] || {}); const x = CALL_ACTIONS.find((a) => a.key === k); const bs = x.__base || x;
      if (act === "act-label") { const s = String(v).trim(); if (s && s !== bs.label) o.label = s; else delete o.label; }
      else { if (v !== bs.tone) o.tone = v; else delete o.tone; }
      if (!Object.keys(o).length) delete d.options.actions[k];
    }); break;
    case "note-edit": case "note-del": case "note-add": acEdit((d) => {
      let n = Array.isArray(d.options.notes) && d.options.notes.length ? d.options.notes.slice() : (CALL_NOTES.__base || CALL_NOTES).slice();
      const i = +el.dataset.i;
      if (act === "note-edit") { const s = String(v).trim(); if (s) n[i] = s; else n.splice(i, 1); }
      if (act === "note-del") n.splice(i, 1);
      if (act === "note-add") n.push("New note");
      if (!n.includes("For Callback")) n.push("For Callback");
      d.options.notes = JSON.stringify(n) === JSON.stringify(CALL_NOTES.__base) ? [] : n;
    }); break;
    case "pa-label": acEdit((d) => { const pa = (d.options.pa = d.options.pa || {}); const s = String(v).trim(); if (s && s !== CL_PA_LABELS.__base[k]) pa[k] = s; else delete pa[k]; }); break;
    // security
    case "changepin": {
      const inp = document.getElementById("ac-newpin"), msg = document.getElementById("ac-pin-msg");
      if (inp.value.length < 4) { msg.textContent = "Use at least 4 characters."; return; }
      const salt = Math.random().toString(36).slice(2, 12);
      acHash(inp.value, salt).then((hash) => { acSaveRec({ pinSalt: salt, pinHash: hash }); acSetUnlocked(hash); logChange({ action: "admin", summary: "Admin PIN changed" }); inp.value = ""; msg.textContent = "PIN changed."; });
      return;
    }
    case "restore": confirmDialog("Load the previous version?", "The version published before the current one becomes your draft. Nothing changes for other users until you publish it.", () => { acSaveRec({ draft: String(acRec().prev || "") }); acApply(true); toast("Previous version loaded into the draft"); acRefresh(); }, { okClass: "primary", okLabel: "Load into draft" }); return;
    case "reset": confirmDialog("Reset the draft?", "The draft goes back to the original app settings (no renamed tabs or columns, no custom cards). Publish it to apply that for everyone.", () => { acSaveRec({ draft: JSON.stringify(acBlank()) }); acApply(true); toast("Draft reset"); acRefresh(); }, { okLabel: "Reset draft" }); return;
    // row highlights & automatic corrections
    case "bi-set": { const g = el.dataset.g; acEdit((d) => { d.builtin = d.builtin || {}; const o = (d.builtin[g] = d.builtin[g] || {}); const t = String(v).trim(); if (t && t !== BI_DEF[g][k]) o[k] = t; else delete o[k]; if (!Object.keys(o).length) delete d.builtin[g]; }); break; }
    case "bi-reset": { const g = el.dataset.g; acEdit((d) => { if (d.builtin) delete d.builtin[g]; }); toast("Original settings restored in the draft"); break; }
    case "bi-gca-tab": acEdit((d) => {

      const all = ["dg_infusion_pas", "dg_infusion_other"];
      const set = new Set(Array.isArray(o.tabs) ? o.tabs : all);
      if (v) set.add(k); else set.delete(k);
      const list = all.filter((x) => set.has(x));
      if (list.length === all.length) delete o.tabs; else o.tabs = list;
      if (!Object.keys(o).length) delete d.builtin.gca;
    }); break;
    case "bi-goto": acUI.section = el.dataset.s; acUI.err = ""; break;
    case "al-add": { const ak = el.dataset.ak; acEdit((d) => { acAlList(d, id, ak).push(ak === "hl" ? { id: "h" + Date.now().toString(36), on: true, label: "New highlight rule", tone: "red", logic: "all", conds: [] } : { id: "a" + Date.now().toString(36), on: true, text: "Wrong dates", logic: "all", conds: [] }); }); break; }
    case "al-del": { const ak = el.dataset.ak, ri = +el.dataset.ri; confirmDialog("Delete this rule?", "It will be removed from the draft.", () => { acEdit((d) => { acAlList(d, id, ak).splice(ri, 1); }); acRefresh(); }, { okLabel: "Delete rule" }); return; }
    case "al-up": case "al-down": { const ak = el.dataset.ak, ri = +el.dataset.ri, j = ri + (act === "al-up" ? -1 : 1); acEdit((d) => { const L = acAlList(d, id, ak); if (j < 0 || j >= L.length) return; const t = L[ri]; L[ri] = L[j]; L[j] = t; }); break; }
    case "al-on": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { acAlList(d, id, ak)[ri].on = !!v; }); break; }
    case "al-name": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { const r = acAlList(d, id, ak)[ri]; if (ak === "hl") r.label = String(v).trim(); else r.text = String(v).trim(); }); break; }
    case "al-style": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { acAlList(d, id, ak)[ri].style = v; }); break; }
    case "al-tone": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { acAlList(d, id, ak)[ri].tone = v; }); break; }
    case "al-logic": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { acAlList(d, id, ak)[ri].logic = v; }); break; }
    case "al-reset": acEdit((d) => { if (d.alerts) delete d.alerts[id]; }); break;
    case "alc-add": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { const r = acAlList(d, id, ak)[ri]; r.conds = r.conds || []; r.conds.push({ col: acDataCols(id)[0] || "", op: "filled", val: "" }); }); break; }
    case "alc-del": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => { acAlList(d, id, ak)[ri].conds.splice(di, 1); }); break; }
    case "alc-col": { const ak = el.dataset.ak, ri = +el.dataset.ri; acEdit((d) => {
      const cd = acAlList(d, id, ak)[ri].conds[di];

    }); break; }

      const cd = acAlList(d, id, ak)[ri].conds[di];

    }); break; }

// Banner shown while the admin previews the draft in the whole app
function acPreviewBanner() {
  let bar = document.getElementById("ac-preview-bar");
  if (!AC_PREVIEW) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "ac-preview-bar";
    bar.innerHTML = `<span><b>Previewing your draft.</b> Only you see this. Other users still see the published version.</span><button class="btn sm" id="ac-prev-back">Back to Admin</button><button class="btn sm" id="ac-prev-exit">Exit preview</button>`;
    document.body.appendChild(bar);
    bar.querySelector("#ac-prev-back").addEventListener("click", () => { location.hash = "#/admin"; });
    bar.querySelector("#ac-prev-exit").addEventListener("click", () => { AC_PREVIEW = false; acApply(true); invalidateCache(); render(); });
  }
}

  await bootStore();
  acApply(true);
  render();
  startWixSync();
})();

<script>
/* Compact menu for mobile and tablet: the sidebar opens as a small floating panel */
(function(){
  if(document.getElementById('menu-toggle'))return;
  var b=document.createElement('button');
  b.id='menu-toggle';b.type='button';b.className='menu-toggle';
  b.setAttribute('aria-label','Open menu');b.setAttribute('aria-expanded','false');
  b.textContent='\u2630';
  document.body.appendChild(b);
  var bd=document.createElement('div');bd.className='sidebar-backdrop';
  document.body.appendChild(bd);
  function setOpen(o){
    document.body.classList.toggle('sidebar-open',o);
    b.textContent=o?'\u2715':'\u2630';
    b.setAttribute('aria-expanded',o?'true':'false');
    b.setAttribute('aria-label',o?'Close menu':'Open menu');
  }
  b.addEventListener('click',function(){setOpen(!document.body.classList.contains('sidebar-open'));});
  bd.addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
  var nav=document.getElementById('sidebar-nav');
  if(nav){nav.addEventListener('click',function(){setTimeout(function(){setOpen(false);},80);});}
  window.addEventListener('resize',function(){if(window.innerWidth>1000)setOpen(false);});
})();
</script>
