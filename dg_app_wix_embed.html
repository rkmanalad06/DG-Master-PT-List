<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DG Master Patient List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root {
  --burgundy-50: #fbf2f3;
  --burgundy-100: #f3dde0;
  --burgundy-200: #e5b7bd;
  --burgundy-500: #8f2a3c;
  --burgundy-600: #7a2233;
  --burgundy-700: #641b29;
  --burgundy-900: #3d0f18;

  --ink-900: #1a1d23;
  --ink-800: #262a33;
  --ink-700: #3a3f4b;
  --ink-600: #565c6a;
  --ink-500: #6b7182;
  --ink-400: #8b90a0;
  --ink-300: #b0b4c0;
  --ink-200: #d8dae1;
  --ink-100: #eceef2;
  --ink-50: #f6f7f9;

  --white: #ffffff;

  --status-complete: #1e7d4b;
  --status-complete-bg: #e5f5ec;
  --status-pending: #a06a12;
  --status-pending-bg: #fbf0dc;
  --status-attention: #b3312c;
  --status-attention-bg: #fbe6e5;
  --status-progress: #2261b0;
  --status-progress-bg: #e6effa;
  --status-neutral: #6b7182;
  --status-neutral-bg: #eceef2;

  --bg-app: #f5f4f6;
  --bg-surface: var(--white);
  --bg-sunken: var(--ink-50);
  --border-subtle: var(--ink-200);
  --border-strong: var(--ink-300);

  --text-primary: var(--ink-900);
  --text-secondary: var(--ink-600);
  --text-tertiary: var(--ink-400);
  --text-on-accent: var(--white);
  --accent: var(--burgundy-600);
  --accent-hover: var(--burgundy-700);
  --accent-soft: var(--burgundy-50);
  --accent-soft-border: var(--burgundy-200);

  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-sm: 0 1px 2px rgba(26, 29, 35, 0.06);
  --shadow-md: 0 4px 16px rgba(26, 29, 35, 0.08), 0 1px 2px rgba(26, 29, 35, 0.06);
  --shadow-lg: 0 12px 32px rgba(26, 29, 35, 0.14), 0 2px 6px rgba(26, 29, 35, 0.08);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  --sidebar-w: 280px;
  --topbar-h: 60px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg-app);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
button { font-family: inherit; }
::selection { background: var(--accent-soft-border); }

a { color: var(--accent); text-decoration: none; }
a.link-inline { text-decoration: underline; }
a.link-inline:hover { color: var(--accent-hover); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-400); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
#app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  height: 100vh;
  grid-template-areas: "sidebar topbar" "sidebar main";
}

.topbar {
  grid-area: topbar;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-5);
  z-index: 5;
}

.topbar-search {
  flex: 1;
  max-width: 520px;
  position: relative;
}
.topbar-search input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-sunken);
  font-size: 13.5px;
  color: var(--text-primary);
  transition: border-color 160ms var(--ease-out), background 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
}
.topbar-search input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.topbar-search .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}

.topbar-right { display: flex; align-items: center; gap: var(--space-3); margin-left: auto; }

.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 140ms var(--ease-out), transform 160ms var(--ease-out), color 140ms var(--ease-out);
  position: relative;
}
.icon-btn:hover { background: var(--ink-100); color: var(--text-primary); }
.icon-btn:active { transform: scale(0.93); }
.icon-btn .badge-dot {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--status-attention);
  border: 1.5px solid var(--bg-surface);
}

.sidebar {
  grid-area: sidebar;
  background: var(--ink-900);
  color: var(--ink-200);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-brand {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-5);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.sidebar-brand .mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--burgundy-500), var(--burgundy-700));
  display: grid; place-items: center;
  color: white; font-weight: 700; font-size: 14px;
  flex-shrink: 0;
}
.sidebar-brand .name { font-weight: 600; font-size: 14.5px; color: white; letter-spacing: -0.01em; }
.sidebar-brand .subname { font-size: 11px; color: var(--ink-400); }

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-3) var(--space-3) var(--space-6);
}

.nav-group { margin-top: var(--space-5); }
.nav-group:first-child { margin-top: var(--space-2); }
.nav-group-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-500);
  padding: 0 var(--space-3);
  margin-bottom: var(--space-2);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 8px var(--space-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-200);
  font-size: 13px;
  transition: background 140ms var(--ease-out), color 140ms var(--ease-out);
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
.nav-item.active {
  background: rgba(143, 42, 60, 0.35);
  color: white;
  border-color: rgba(191, 90, 107, 0.4);
}
.nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
.nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .nav-count {
  font-size: 10.5px;
  color: var(--ink-400);
  background: rgba(255,255,255,0.08);
  padding: 1px 6px;
  border-radius: 20px;
  flex-shrink: 0;
}
.nav-item.active .nav-count { background: rgba(255,255,255,0.18); color: white; }
.nav-item .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

main.content {
  grid-area: main;
  overflow-y: auto;
  padding: var(--space-6) var(--space-8) var(--space-10);
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 12.5px;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
}
.breadcrumbs a { color: var(--text-tertiary); text-decoration: none; cursor: pointer; }
.breadcrumbs a:hover { color: var(--accent); }
.breadcrumbs .sep { color: var(--ink-300); }
.breadcrumbs .current { color: var(--text-secondary); font-weight: 500; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; color: var(--text-primary); }
.page-subtitle { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; max-width: 640px; }
.page-header-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 160ms var(--ease-out), background 140ms var(--ease-out), border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  white-space: nowrap;
}
.btn:hover { background: var(--ink-50); border-color: var(--border-strong); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--status-attention); border-color: var(--status-attention-bg); }
.btn.danger:hover { background: var(--status-attention-bg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--ink-100); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
.btn svg { flex-shrink: 0; }

/* ==========================================================================
   CARDS / KPI
   ========================================================================== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}
@media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

/* Compact summary cards: tightened padding/gaps/type so the summary row takes
   noticeably less vertical space, leaving more of the table below visible
   without scrolling. */
.kpi-card {
  padding: 10px var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: box-shadow 180ms var(--ease-out), transform 180ms var(--ease-out);
}
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.kpi-card .kpi-top { display: flex; align-items: center; justify-content: space-between; }
.kpi-card .kpi-icon {
  width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  flex-shrink: 0;
}
.kpi-card .kpi-icon svg { width: 14px; height: 14px; }
.kpi-card .kpi-label { font-size: 10.5px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.kpi-card .kpi-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.15; }
.kpi-card .kpi-sub { font-size: 11px; color: var(--text-tertiary); }
.kpi-card .kpi-sub.positive { color: var(--status-complete); }
.kpi-card .kpi-sub.warn { color: var(--status-attention); }

.section {
  margin-bottom: var(--space-6);
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}
.section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.section-title .count { color: var(--text-tertiary); font-weight: 500; }

.two-col {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--space-5);
  align-items: start;
}
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }

/* ==========================================================================
   PROGRESS BARS / BADGES
   ========================================================================== */
.progress-track {
  height: 8px;
  background: var(--ink-100);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  border-radius: 20px;
  background: var(--accent);
  transition: width 400ms var(--ease-in-out);
}
.progress-fill.complete { background: var(--status-complete); }
.progress-fill.attention { background: var(--status-attention); }
.progress-fill.progress-mid { background: var(--status-progress); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.badge.status-complete { background: var(--status-complete-bg); color: var(--status-complete); }
.badge.status-pending { background: var(--status-pending-bg); color: var(--status-pending); }
.badge.status-needs-attention { background: var(--status-attention-bg); color: var(--status-attention); }
.badge.status-not-started { background: var(--status-neutral-bg); color: var(--status-neutral); }
.badge.status-in-progress { background: var(--status-progress-bg); color: var(--status-progress); }
.badge.status-needs-review { background: var(--status-attention-bg); color: var(--status-attention); }
.badge.neutral { background: var(--ink-100); color: var(--text-secondary); }
.badge.outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-secondary); }

/* ==========================================================================
   TAB OVERVIEW TABLE (dashboard)
   ========================================================================== */
.tab-overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tab-overview-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  font-weight: 700;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; background: var(--bg-surface);
}
.tab-overview-table td { padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.tab-overview-table tr:last-child td { border-bottom: none; }
.tab-overview-table tr.clickable { cursor: pointer; transition: background 120ms var(--ease-out); }
.tab-overview-table tr.clickable:hover { background: var(--bg-sunken); }
.tab-overview-table .tab-name-cell { font-weight: 600; color: var(--text-primary); }
.tab-overview-table .mini-progress { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.tab-overview-table .mini-progress .progress-track { flex: 1; }
.tab-overview-table .mini-progress .pct-label { font-size: 12px; font-weight: 600; width: 34px; text-align: right; color: var(--text-secondary); }

/* ==========================================================================
   ACTION ITEMS
   ========================================================================== */
.action-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out);
  margin-bottom: var(--space-2);
}
.action-item:last-child { margin-bottom: 0; }
.action-item:hover { background: var(--bg-sunken); border-color: var(--border-strong); }
.action-item .sev-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.action-item .sev-dot.high { background: var(--status-attention); }
.action-item .sev-dot.medium { background: var(--status-pending); }
.action-item .sev-dot.low { background: var(--status-progress); }
.action-item .text { flex: 1; font-size: 13px; color: var(--text-primary); }
.action-item .chevron { color: var(--text-tertiary); flex-shrink: 0; }

/* ==========================================================================
   EMPTY STATES
   ========================================================================== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-10) var(--space-6);
  color: var(--text-secondary);
}
.empty-state .icon { color: var(--ink-300); margin-bottom: var(--space-3); }
.empty-state .title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.empty-state .desc { font-size: 12.5px; color: var(--text-tertiary); max-width: 360px; }

/* ==========================================================================
   DATA TABLE (generic, used across sheet pages / raw data / search)
   ========================================================================== */
.table-toolbar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}
.table-search { position: relative; flex: 1; min-width: 220px; max-width: 340px; }
.table-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  font-size: 13px;
  background: var(--bg-surface);
  transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.table-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.table-search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }

.filter-select {
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  font-size: 12.5px;
  color: var(--text-secondary);
  cursor: pointer;
  max-width: 180px;
}
.filter-select:focus { outline: none; border-color: var(--accent); }

.data-table-wrap {
  overflow: auto;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  max-height: 62vh;
}
table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data-table th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg-sunken);
  text-align: left;
  padding: 7px 10px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-tertiary);
  font-weight: 700;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
table.data-table th:hover { color: var(--text-secondary); }
table.data-table th .sort-arrow { margin-left: 4px; opacity: 0.5; }
table.data-table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-primary);
  white-space: nowrap;
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
}
table.data-table tbody tr { transition: background 100ms var(--ease-out); }
table.data-table tbody tr:hover { background: var(--bg-sunken); }
table.data-table tbody tr:last-child td { border-bottom: none; }
table.data-table td.name-cell { font-weight: 600; cursor: pointer; color: var(--text-primary); }
table.data-table td.name-cell:hover { color: var(--accent); text-decoration: underline; }
table.data-table td.inline-cell { padding: 4px 6px; }
.inline-edit-input {
  width: 100%;
  min-width: 110px;
  border: 1px solid transparent;
  background: transparent;
  font: inherit;
  color: inherit;
  padding: 5px 7px;
  border-radius: var(--radius-sm);
  transition: border-color 140ms var(--ease-out), background 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.inline-edit-input:hover { background: var(--bg-sunken); border-color: var(--border-subtle); }
.inline-edit-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.inline-edit-input.just-saved { animation: inline-save-flash 900ms var(--ease-out); }
@keyframes inline-save-flash {
  0% { background: var(--status-complete-bg); }
  100% { background: transparent; }
}
table.data-table td.actions-cell { white-space: nowrap; }
table.data-table td.actions-cell .btn { padding: 4px 8px; }

/* Inline cell = text input + optional calendar-picker button, side by side */
.inline-cell-wrap { display: flex; align-items: center; gap: 2px; }
.inline-cell-wrap .inline-edit-input { min-width: 90px; }
td.inline-cell.name-col { max-width: 220px; }
td.inline-cell.name-col .inline-edit-input { min-width: 150px; font-weight: 600; }
.cal-btn {
  flex-shrink: 0;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border: none; background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: background 120ms var(--ease-out), color 120ms var(--ease-out);
}
.cal-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* Shared native date input, positioned next to whichever field was clicked */
.shared-date-picker {
  position: fixed;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent);
  box-shadow: var(--shadow-md);
  font: inherit;
  background: var(--bg-surface);
}
.shared-date-picker.active { opacity: 1; pointer-events: auto; }

/* Expand-row "just below it" detail panel — replaces a centered modal for
   quick viewing, so it appears right where the user is already looking. */
tr.expand-row td {
  background: var(--bg-sunken);
  white-space: normal;
  padding: 0;
  border-bottom: 1px solid var(--border-subtle);
}
.expand-panel { padding: 14px 16px; font-size: 12.5px; }

.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-4);
  font-size: 12.5px;
  color: var(--text-secondary);
}
.pagination .pager-btns { display: flex; gap: 6px; }
.pagination button {
  width: 30px; height: 30px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  cursor: pointer;
  transition: background 120ms var(--ease-out);
}
.pagination button:hover:not(:disabled) { background: var(--ink-100); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ==========================================================================
   MODALS
   ========================================================================== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20, 15, 17, 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: var(--space-6);
  opacity: 0;
  transition: opacity 200ms var(--ease-out);
}
.modal-backdrop.open { opacity: 1; }
.modal {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.96);
  opacity: 0;
  transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out);
}
.modal-backdrop.open .modal { transform: scale(1); opacity: 1; }
.modal.wide { max-width: 880px; }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-header p { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.modal-body { padding: var(--space-6); overflow-y: auto; flex: 1; }
.modal-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2);
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.form-group { margin-bottom: var(--space-4); }
.form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  font-size: 13px;
  font-family: inherit;
  background: var(--bg-surface);
  color: var(--text-primary);
  transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.form-hint { font-size: 11.5px; color: var(--text-tertiary); margin-top: 4px; }

/* ==========================================================================
   IMPORT WIZARD
   ========================================================================== */
.wizard-steps {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
}
.wizard-step {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-tertiary); font-weight: 600;
}
.wizard-step .num {
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--ink-100); color: var(--text-tertiary);
  font-size: 11px;
  transition: background 200ms var(--ease-out), color 200ms var(--ease-out);
}
.wizard-step.active .num { background: var(--accent); color: white; }
.wizard-step.done .num { background: var(--status-complete); color: white; }
.wizard-step.active, .wizard-step.done { color: var(--text-primary); }
.wizard-connector { flex: 1; height: 1px; background: var(--border-subtle); }

.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: var(--space-10) var(--space-6);
  text-align: center;
  cursor: pointer;
  transition: border-color 160ms var(--ease-out), background 160ms var(--ease-out);
  color: var(--text-secondary);
}
.dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .icon { color: var(--ink-300); margin-bottom: var(--space-3); }

.mapping-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.mapping-table th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); }
.mapping-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); }
.mapping-table select { width: 100%; }

.import-summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-5); }
.summary-stat { text-align: center; padding: var(--space-4); border-radius: var(--radius-md); background: var(--bg-sunken); }
.summary-stat .num { font-size: 22px; font-weight: 700; }
.summary-stat .lbl { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }
.summary-stat.warn .num { color: var(--status-attention); }
.summary-stat.good .num { color: var(--status-complete); }

/* ==========================================================================
   TOASTS
   ========================================================================== */
#toast-region {
  position: fixed; bottom: var(--space-6); right: var(--space-6);
  display: flex; flex-direction: column; gap: var(--space-2);
  z-index: 200;
}
.toast {
  background: var(--ink-900);
  color: white;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  display: flex; align-items: center; gap: 10px;
  min-width: 260px;
  transform: translateY(100%);
  opacity: 0;
  transition: transform 300ms var(--ease-out), opacity 300ms var(--ease-out);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success .icon { color: #4ade80; }
.toast.error .icon { color: #f87171; }

/* ==========================================================================
   CHARTS
   ========================================================================== */
.chart-card { padding: var(--space-4); min-width: 0; }
.chart-card canvas { max-height: 210px; }
.charts-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-3);
}
@media (max-width: 1300px) { .charts-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px) { .charts-row { grid-template-columns: 1fr; } }

/* ==========================================================================
   PATIENT DETAIL
   ========================================================================== */
.patient-header {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-5);
  margin-bottom: var(--space-5);
}
.patient-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: 18px;
  flex-shrink: 0;
}
.patient-meta-row { display: flex; gap: var(--space-5); margin-top: 4px; flex-wrap: wrap; }
.patient-meta-item { font-size: 12.5px; color: var(--text-secondary); }
.patient-meta-item strong { color: var(--text-primary); font-weight: 600; }

.source-record-card {
  padding: var(--space-4);
  margin-bottom: var(--space-3);
}
.source-record-card .src-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
.src-field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-3); }
.src-field { font-size: 12px; }
.src-field .k { color: var(--text-tertiary); margin-bottom: 2px; }
.src-field .v { color: var(--text-primary); font-weight: 500; }

/* ==========================================================================
   SETTINGS / COMPLETION CRITERIA
   ========================================================================== */
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--border-subtle);
  gap: var(--space-4);
}
.settings-row:last-child { border-bottom: none; }
.settings-row .label { font-size: 13px; font-weight: 600; }
.settings-row .desc { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* ==========================================================================
   UTILITY
   ========================================================================== */
.text-muted { color: var(--text-tertiary); }
.mt-2 { margin-top: var(--space-2); }
.mt-4 { margin-top: var(--space-4); }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); }
.justify-between { justify-content: space-between; }
.hidden { display: none !important; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--ink-200);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ==========================================================================
   CALL LIST – UPCOMING APPOINTMENT (workflow view)
   ========================================================================== */
.cl-tone-blue   { --t-fg:#1d5aa6; --t-bg:#e6effa; --t-bd:#b9d0ee; }
.cl-tone-green  { --t-fg:#1e7d4b; --t-bg:#e5f5ec; --t-bd:#b4dfc7; }
.cl-tone-red    { --t-fg:#b3312c; --t-bg:#fbe6e5; --t-bd:#efbcb9; }
.cl-tone-orange { --t-fg:#9a4a08; --t-bg:#feebd6; --t-bd:#f3c99a; }
.cl-tone-yellow { --t-fg:#6b4d00; --t-bg:#fff2b8; --t-bd:#efd766; }
.cl-tone-attn   { --t-fg:#ffffff; --t-bg:#d9480f; --t-bd:#d9480f; }
.cl-tone-gray   { --t-fg:#565c6a; --t-bg:#eceef2; --t-bd:#d8dae1; }
.cl-tone-violet { --t-fg:#5b3fa8; --t-bg:#efe9fb; --t-bd:#d3c6f1; }

/* --- KPI dashboard (sticky so it stays visible while the table scrolls) --- */
.cl-kpi-wrap {
  position: sticky; top: calc(-1 * var(--space-6)); z-index: 20;
  margin: calc(-1 * var(--space-6)) calc(-1 * var(--space-8)) var(--space-4);
  padding: 10px var(--space-8) 10px;
  background: var(--bg-app);
  border-bottom: 1px solid var(--border-subtle);
}
.cl-kpi-grid { display: grid; grid-template-columns: 1.5fr 0.8fr 1.7fr; gap: var(--space-3); }
.cl-kpi { padding: 8px var(--space-4); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cl-kpi .kpi-label { font-size: 10.5px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.cl-kpi .kpi-sub { font-size: 11px; color: var(--text-tertiary); }
.cl-kpi-row { display: flex; align-items: baseline; gap: 6px; }
.cl-kpi-big { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cl-kpi-unit { font-size: 12px; color: var(--text-secondary); }
.cl-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cl-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px; font: inherit; font-size: 11.5px; font-weight: 600;
  color: var(--t-fg); background: var(--t-bg); border: 1px solid var(--t-bd); cursor: pointer;
  transition: box-shadow 140ms var(--ease-out), transform 140ms var(--ease-out);
}
.cl-chip b { font-variant-numeric: tabular-nums; }
.cl-chip:hover { box-shadow: 0 0 0 3px var(--t-bg); }
.cl-chip:active { transform: scale(0.97); }
.cl-chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--t-fg); }
.cl-stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-2); margin-top: 8px; }
.cl-stat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left;
  padding: 5px 10px; border-radius: var(--radius-md); font: inherit; cursor: pointer; min-width: 0;
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out), transform 140ms var(--ease-out);
}
.cl-stat:hover { border-color: var(--t-bd); box-shadow: 0 0 0 3px var(--t-bg); }
.cl-stat:active { transform: scale(0.98); }
.cl-stat[aria-pressed="true"] { border-color: var(--t-fg); background: var(--t-bg); box-shadow: 0 0 0 1px var(--t-fg); }
.cl-stat-count { font-size: 17px; font-weight: 700; line-height: 1.15; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.cl-stat-label { font-size: 10.5px; font-weight: 600; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.cl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-bg); border: 2px solid var(--t-bd); flex-shrink: 0; box-sizing: border-box; }
.cl-tone-attn .cl-dot, .cl-stat.cl-tone-attn .cl-dot { background: var(--t-bg); border-color: var(--t-bd); }
.cl-stat .cl-dot { background: var(--t-fg); border-color: var(--t-fg); }

@media (max-width: 1100px) {
  .cl-kpi-grid { grid-template-columns: 1fr 1fr; }
  .cl-kpi-grid .cl-kpi:first-child { grid-column: 1 / -1; }
  .cl-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

}
@media (max-width: 560px) { .cl-kpi-grid { grid-template-columns: 1fr; } .cl-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* --- Toolbar extras --- */
.cl-toolbar .cl-toolbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.cl-rv-label { font-size: 12px; color: var(--text-tertiary); font-weight: 600; }
.cl-seg { display: inline-flex; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-surface); }
.cl-seg button {

}
.cl-seg button:last-child { border-right: none; }
.cl-seg button:hover { background: var(--ink-100); }
.cl-seg button[aria-pressed="true"] { background: var(--accent); color: var(--text-on-accent); }

/* --- Table --- */
.cl-table-wrap { max-height: 60vh; }
table.cl-table { table-layout: fixed; min-width: 100%; }
table.cl-table th { position: sticky; padding-right: 14px; overflow: hidden; text-overflow: ellipsis; }
table.cl-table th.cl-dragging { opacity: 0.4; }

.cl-resize:hover::after, .cl-resize.active::after { background: var(--accent); }

.cl-col-remove:hover { color: var(--status-attention); background: var(--status-attention-bg); }
body.cl-resizing, body.cl-resizing * { cursor: col-resize !important; user-select: none !important; }
table.cl-table tbody tr.cl-row-progress { background: #fffbe8; }
table.cl-table tbody tr.cl-row-progress:hover { background: #fff5c9; }

.cl-pill {

}
.cl-pill:hover { box-shadow: 0 0 0 3px var(--t-bg); }
.cl-pill:active { transform: scale(0.97); }
.cl-pill .cl-pill-text { overflow: hidden; text-overflow: ellipsis; }

td.cl-action-td { white-space: normal; }
.cl-action-cell { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.cl-badge {

}
.cl-badge .cl-dot { width: 6px; height: 6px; border-width: 0; background: var(--t-fg); }
.cl-tone-attn.cl-badge .cl-dot { background: #fff; }

/* --- Action popover --- */
.cl-popover {
  position: fixed; z-index: 120; width: 300px; max-width: calc(100vw - 16px);
  background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); padding: 12px; font-size: 12.5px;
  animation: cl-pop-in 140ms var(--ease-out);
}
@keyframes cl-pop-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }
.cl-pop-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-pop-note { padding: 7px 9px; border-radius: var(--radius-sm); background: #fff0e8; color: #9a3412; font-size: 11.5px; margin-bottom: 8px; line-height: 1.4; }
.cl-opts { display: flex; flex-direction: column; gap: 4px; }
.cl-opt {

  padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid transparent; background: var(--bg-sunken); color: var(--text-primary);
  transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out);
}
.cl-opt .cl-dot { background: var(--t-fg); border-color: var(--t-fg); }
.cl-opt:hover { background: var(--t-bg); }
.cl-opt.on { background: var(--t-bg); border-color: var(--t-bd); color: var(--t-fg); }

  <script>
// AUTO-GENERATED from the source workbook. Do not hand-edit; re-run the extraction script instead.
let RAW_SHEETS = {};
function defaultHeadersForSheet(cfg) {
  const out = [];
  const add = (h) => { if (h && typeof h === "string" && !out.includes(h)) out.push(h); };
  add(cfg.nameField); add(cfg.dobField); add(cfg.acctField); add(cfg.phoneField);
  (cfg.dateFields || []).forEach(add);
  add(cfg.completion && cfg.completion.field);
  (cfg.inlineFields || []).forEach(add);
  (cfg.searchFields || []).forEach(add);
  return out;
}

function ensureDefaultSheets() {
  if (!RAW_SHEETS || typeof RAW_SHEETS !== "object") RAW_SHEETS = {};
  for (const cfg of SHEET_CONFIG) {
    const cur = RAW_SHEETS[cfg.id];
    if (!cur) {
      RAW_SHEETS[cfg.id] = { sheetName: cfg.label, headers: defaultHeadersForSheet(cfg), rowCount: 0, rows: [] };
    } else {
      if (!Array.isArray(cur.headers) || !cur.headers.length) cur.headers = defaultHeadersForSheet(cfg);
      if (!Array.isArray(cur.rows)) cur.rows = [];
    }
  }
}

function openAddRowModal(cfg) {
  const base = (RAW_SHEETS[cfg.id] && RAW_SHEETS[cfg.id].headers) || [];
  const isCall = !!(cfg.completion && (cfg.completion.mode === "call-outcome" || cfg.completion.mode === "transition"));
  const skipCol = isCall ? cfg.completion.field : null;
  const fields = base.filter((h) => h && h !== skipCol);
  const dateSet = new Set(cfg.dateFields || []);
  const wideRe = /note|comment|remark/i;
  const inputHtml = (h, i) => {
    const id = "addrow-f" + i;
    const kind = dateSet.has(h) ? "date" : h === cfg.phoneField ? "tel" : "text";
    const span = wideRe.test(h) ? ' style="grid-column:1 / -1;margin:0"' : ' style="margin:0"';
    return `<div class="form-group"${span}><label for="${id}">${esc(h)}</label><input type="${kind}" id="${id}" data-h="${esc(h)}" data-kind="${kind}" autocomplete="off" /></div>`;
  };
  const modal = openModal(`
    <div class="modal-header"><div><h3>Add row</h3><p>Add a record to ${esc(cfg.label)} by hand.</p></div></div>
    <div class="modal-body">
      ${fields.length ? `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${fields.map(inputHtml).join("")}</div>` : `<p class="form-hint">This tab has no columns yet.</p>`}
      <p class="form-hint" id="addrow-err" role="alert" style="margin-top:10px"></p>
    </div>
    <div class="modal-footer"><button class="btn" id="addrow-cancel">Cancel</button><button class="btn" id="addrow-more">Save &amp; add another</button><button class="btn primary" id="addrow-save">Save row</button></div>`, { wide: true });
  const err = modal.querySelector("#addrow-err");
  const collect = () => {
    const row = {};
    modal.querySelectorAll("[data-h]").forEach((el) => {
      let v = String(el.value || "").trim();
      if (el.dataset.kind === "date" && v) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
        if (m) v = `${+m[2]}/${+m[3]}/${m[1]}`;
      }
      row[el.dataset.h] = v;
    });
    return row;
  };
  const save = (again) => {
    const row = collect();
    const idFields = [cfg.nameField, cfg.acctField].filter(Boolean);
    if (idFields.length && !idFields.some((f) => row[f])) { err.textContent = "Enter at least " + idFields.join(" or ") + "."; return; }
    const res = commitImport(cfg.id, [row], { skipDuplicates: true, fileName: "Manual entry" });
    if (!res.added) { err.textContent = "That patient is already in this tab (same account # or name + DOB), so nothing was added."; return; }
    toast("Row added to " + cfg.label);
    closeModal();
    render();
    if (again) setTimeout(() => openAddRowModal(cfg), 220);
  };
  modal.querySelector("#addrow-cancel").addEventListener("click", closeModal);
  modal.querySelector("#addrow-save").addEventListener("click", () => save(false));
  modal.querySelector("#addrow-more").addEventListener("click", () => save(true));
  modal.querySelectorAll("[data-h]").forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(false); } }));
  const first = modal.querySelector("[data-h]");
  if (first) first.focus();
}

//      inside a Wix iframe.
//   2. Embedded on a Wix page (inside an HTML iframe / Custom Element widget):
//      writes are also sent up to the parent Wix page via postMessage, which
//      Velo page code relays to backend .jsw functions that persist to a
//      shared Wix Data collection — so every user sees the same data.
//
// store.js calls WixBridge.save(type, payload) instead of touching
// localStorage directly when WixBridge.enabled is true, and WixBridge.init()
// resolves with the shared server-side state on boot (or null if standalone).
// ============================================================================

  _pending: new Map(),
  _pollHandle: null,

    // (e.g. previewing the raw HTML file inside some other iframe), fall back
    // to plain localStorage rather than hanging forever.
    const state = await Promise.race([
      this._call("wixapp:init", {}),
      new Promise((resolve) => setTimeout(() => resolve(undefined), 2500)),

  // logged and surfaced as a toast, but never block the local UI since the
  // local copy (localStorage) is already the source of truth for this session.
  async save(type, payload) {

// Name / account / date normalization for identity matching

  // fixed instruction ("CALL (has upcoming appt...)") or a shared batch appointment date is
  // the same across dozens of unrelated patients — matching on it says nothing about identity.
  const compareFields = allFields.filter((f) => {
    const vals = records.map((r) => String(r.data[f] || "").trim().toLowerCase()).filter(Boolean);
    if (vals.length < 2) return false;

    ? row[cfg.acctField]
    : cfg.nameFormat === "acct-colon-name"
    ? parseAcctFromColonName(nameRaw)

  let skipped = 0;

  for (const row of rows) {
    const identity = computeImportRowIdentity(cfg, row);
    if (options.skipDuplicates && identity && existing.has(identity)) {
      skipped++;
      continue;
    }
    toAdd.push(row);
    if (identity) existing.add(identity);

    sheetId,
    fileName: options.fileName || "",

  invalidateCache();
  invalidateDupCache();

    sheetId, action: "import",

function getDashboardStats() {

      text: `${unreviewedExact.reduce((s, g) => s + g.records.length, 0)} exact duplicate record(s) across ${unreviewedExact.length} group(s) need review`,
      route: { view: "duplicates" },

  if (unreviewedPotential.length) {
    items.push({
      id: "dup-potential",
      severity: "medium",
      text: `${unreviewedPotential.reduce((s, g) => s + g.records.length, 0)} potential duplicate record(s) across ${unreviewedPotential.length} group(s) need review`,
      route: { view: "duplicates" },

  }

  const specialPendingText = {
    call_list_upcoming: (n) => `${n} patient(s) with an upcoming appointment still need a call outcome`,
    call_list_no_upcoming: (n) => `${n} patient(s) with no upcoming appointment still need a team member assigned`,

        route: { view: "sheet", sheetId: cfg.id },

    if ((cfg.completion.mode === "nonblank" || cfg.completion.mode === "value-not-equal" || cfg.completion.mode === "call-outcome" || cfg.completion.mode === "transition") && stats.remaining > 0) {

        severity: cfg.id === "call_list_upcoming" ? "high" : "medium",
        text,

    }

    const cfg = SHEET_BY_ID[r.sheetId];
    return cfg.phoneField && cfg.nameField && r.displayName && !r.data[cfg.phoneField];

    items.push({
      id: "missing-phone",
      severity: "low",
      text: `${missingPhone.length} patient record(s) are missing a phone number`,

    { label: "Duplicates", value: fmtNum(stats.duplicateRecordCount), icon: "copy", sub: stats.duplicateRecordCount ? "Needs review" : "None found", cls: stats.duplicateRecordCount ? "warn" : "positive" },
    { label: "Overall Completion", value: stats.overallPct + "%", icon: "check", sub: `${fmtNum(stats.recordsRemaining)} records remaining` },
  ];

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-subtitle">Live overview of the DG Master Patient List, computed from the current dataset.</div>
      </div>
      <div class="page-header-actions">
        <a class="btn" href="#/import-export">${uploadIconSvg()} Import Excel</a>
        <a class="btn primary" href="#/raw-data">${dbIconSvg()} Browse Raw Data</a>
      </div>
    </div>

    <div class="kpi-grid">
      ${kpis.map((k) => kpiCard(k)).join("")}
    </div>

    <div class="two-col">
      <div>
        <div class="section">
          <div class="section-header">
            <div class="section-title">Tab Overview <span class="count">— % of work left for each tab</span></div>
          </div>
          <div class="card" style="overflow:auto">
            <table class="tab-overview-table">
              <thead><tr><th>Tab</th><th>Records</th><th>Progress</th><th>Duplicates</th><th>Status</th></tr></thead>
              <tbody>
                ${stats.perSheet.map((s) => tabOverviewRow(s)).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div>
        <div class="section">
          <div class="section-header"><div class="section-title">Action Items <span class="count">${actionItems.length}</span></div></div>
          <div class="card" style="padding:var(--space-3)">
            ${actionItems.length ? actionItems.map(actionItemRow).join("") : emptyStateHtml("All caught up", "No outstanding action items right now.")}
          </div>
        </div>
        <div class="section">
          <div class="section-header"><div class="section-title">Snapshot</div></div>
          <div class="card" style="padding:var(--space-5)">
            <div class="flex justify-between" style="margin-bottom:10px"><span class="text-muted">Completed tabs</span><strong>${stats.completedTabs} / ${stats.totalTabs}</strong></div>
            <div class="flex justify-between" style="margin-bottom:10px"><span class="text-muted">Tabs needing attention</span><strong style="color:var(--status-attention)">${stats.attentionTabs}</strong></div>
            <div class="flex justify-between"><span class="text-muted">Records left to process</span><strong>${fmtNum(stats.recordsRemaining)}</strong></div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title">Visual Analytics</div></div>
      <div class="charts-row" id="charts-region">
        <div class="card chart-card"><div class="section-title" style="margin-bottom:12px">Records by Tab</div><canvas id="chart-records-by-tab"></canvas></div>
        <div class="card chart-card"><div class="section-title" style="margin-bottom:12px">Completion % by Tab</div><canvas id="chart-completion-by-tab"></canvas></div>
        <div class="card chart-card"><div class="section-title" style="margin-bottom:12px">Diagnosis Distribution</div><canvas id="chart-diagnosis"></canvas></div>
        <div class="card chart-card"><div class="section-title" style="margin-bottom:12px">Duplicate Records by Tab</div><canvas id="chart-dup-by-tab"></canvas></div>
      </div>
    </div>
  `;
}
function kpiCard(k) {
  return `<div class="card kpi-card">
    <div class="kpi-top"><span class="kpi-label">${esc(k.label)}</span><span class="kpi-icon">${kpiIconSvg(k.icon)}</span></div>
    <div class="kpi-value">${k.value}</div>
    <div class="kpi-sub ${k.cls || ""}">${esc(k.sub)}</div>
  </div>`;
}
function kpiIconSvg(name) {
  const paths = {
    records: '<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    users: '<circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 8.5a3 3 0 1 1 3.8 2.9M21 20c0-2.5-1.7-4.6-4-5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="2"/>',
    check: '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M8.5 12.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  };
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none">${paths[name] || ""}</svg>`;
}
function uploadIconSvg() { return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M6 10l6-6 6 6M4 20h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function dbIconSvg() { return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="2"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" stroke="currentColor" stroke-width="2"/></svg>`; }

function tabOverviewRow(s) {
  const cfg = SHEET_BY_ID[s.id];
  const untracked = s.sheetStatus === "untracked";
  const barClass = s.pct === 100 ? "complete" : s.pct >= 60 ? "progress-mid" : "";
  return `<tr class="clickable" onclick="navigate('sheet/${s.id}')">
    <td class="tab-name-cell">${esc(cfg.label)}</td>
    <td>${s.total}</td>
    <td>
      <div class="mini-progress">
        <div class="progress-track"><div class="progress-fill ${barClass}" style="width:${untracked ? 0 : s.pct}%"></div></div>
        <span class="pct-label">${untracked ? "—" : s.pct + "%"}</span>
      </div>
    </td>
    <td>${s.dupCount ? `<span class="badge status-needs-attention">${s.dupCount}</span>` : `<span class="text-muted">0</span>`}</td>
    <td>${tabStatusBadge(s.sheetStatus)}</td>
  </tr>`;
}
function tabStatusBadge(status) {
  const map = {
    complete: ["status-complete", "Complete"],
    "in-progress": ["status-in-progress", "In Progress"],
    "needs-attention": ["status-needs-attention", "Needs Attention"],
    untracked: ["status-not-started", "Manual Tracking"],
    reference: ["neutral", "Reference"],
  };
  const [cls, label] = map[status] || map.untracked;
  return `<span class="badge ${cls}">${label}</span>`;
}
function actionItemRow(item) {
  const href = item.route.view === "sheet" ? `#/sheet/${item.route.sheetId}` : `#/${item.route.view}`;
  return `<a class="action-item" href="${href}" style="text-decoration:none">
    <span class="sev-dot ${item.severity}"></span>
    <span class="text">${esc(item.text)}</span>
    <span class="chevron">${chevronSvg()}</span>
  </a>`;
}
function chevronSvg() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function emptyStateHtml(title, desc) {
  return `<div class="empty-state">${emptyIcon()}<div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div></div>`;
}

function initDashboardCharts() {
  if (typeof Chart === "undefined") {
    const region = document.getElementById("charts-region");
    if (region) {
      region.style.gridTemplateColumns = "1fr";
      region.innerHTML = `<div class="card">${emptyStateHtml("Charts unavailable offline", "The charting library couldn't load (no internet access). Everything else in this app still works fully offline.")}</div>`;
    }
    return;
  }
  const stats = getDashboardStats();
  const palette = ["#8f2a3c", "#2261b0", "#a06a12", "#1e7d4b", "#6b7182", "#b3312c", "#4c3b8f", "#0f766e", "#9a3412", "#334155"];
  Chart.defaults.font.family = "Inter, system-ui, sans-serif";
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = "#6b7182";

  const recCtx = document.getElementById("chart-records-by-tab");
  if (recCtx) {
    activeCharts.push(new Chart(recCtx, {
      type: "bar",
      data: {
        labels: stats.perSheet.map((s) => SHEET_BY_ID[s.id].shortLabel),
        datasets: [{ data: stats.perSheet.map((s) => s.total), backgroundColor: "#8f2a3c", borderRadius: 4, maxBarThickness: 22 }],
      },
      options: baseBarOptions(),
    }));
  }
  const compCtx = document.getElementById("chart-completion-by-tab");
  if (compCtx) {
    const trackable = stats.perSheet.filter((s) => s.sheetStatus !== "untracked");
    activeCharts.push(new Chart(compCtx, {
      type: "bar",
      data: {
        labels: trackable.map((s) => SHEET_BY_ID[s.id].shortLabel),
        datasets: [{ data: trackable.map((s) => s.pct), backgroundColor: "#2261b0", borderRadius: 4, maxBarThickness: 22 }],
      },
      options: { ...baseBarOptions(), scales: { ...baseBarOptions().scales, y: { max: 100, ticks: { callback: (v) => v + "%" } } } },
    }));
  }
  const dxCtx = document.getElementById("chart-diagnosis");
  if (dxCtx) {
    const counts = {};
    for (const cfg of SHEET_CONFIG) {
      if (!cfg.diagnosisLabel) continue;
      counts[cfg.diagnosisLabel] = getSheetStats(cfg.id).total;
    }
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    activeCharts.push(new Chart(dxCtx, {
      type: "doughnut",
      data: { labels: entries.map((e) => e[0]), datasets: [{ data: entries.map((e) => e[1]), backgroundColor: palette, borderWidth: 2, borderColor: "#fff" }] },
      options: { plugins: { legend: { position: "right", labels: { boxWidth: 10, padding: 8 } } }, cutout: "62%" },
    }));
  }
  const dupCtx = document.getElementById("chart-dup-by-tab");
  if (dupCtx) {
    const withDups = stats.perSheet.filter((s) => s.dupCount > 0);
    if (withDups.length) {
      activeCharts.push(new Chart(dupCtx, {
        type: "bar",
        data: { labels: withDups.map((s) => SHEET_BY_ID[s.id].shortLabel), datasets: [{ data: withDups.map((s) => s.dupCount), backgroundColor: "#b3312c", borderRadius: 4, maxBarThickness: 22 }] },
        options: baseBarOptions(),
      }));
    } else {
      dupCtx.parentElement.innerHTML = `<div class="section-title" style="margin-bottom:12px">Duplicate Records by Tab</div>` + emptyStateHtml("No duplicates", "No duplicate records were detected in any tab.");
    }
  }
}
function baseBarOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: "#eceef2" } } },
  };
}
function wireDashboard() {}

// ============================================================================
// SHEET PAGE (generic, used for every worksheet tab)
// ============================================================================
const sheetPageState = {}; // sheetId -> { search, sort:{field,dir}, page, pageSize }

function getSheetPageState(sheetId) {
  if (!sheetPageState[sheetId]) sheetPageState[sheetId] = { search: "", sort: null, page: 1, pageSize: 25 };
  return sheetPageState[sheetId];
}

function renderSheetPage(cfg) {
  const stats = getSheetStats(cfg.id);
  const dupGroups = getDuplicateGroupsForSheet(cfg.id);
  const untracked = cfg.completion.mode === "manual";

  return `
    <div class="page-header">
      <div>
        <div class="page-title">${esc(cfg.label)}</div>
        <div class="page-subtitle">${esc(sheetDescription(cfg))}</div>
      </div>
      <div class="page-header-actions">
        ${!cfg.isReference ? `<button class="btn" id="btn-completion-criteria">${gearIconSvg()} Completion Criteria</button>` : ""}
        ${!cfg.isReference ? `<button class="btn" id="btn-add-row">+ Add Row</button>` : ""} <button class="btn" id="btn-export-sheet">${downloadIconSvg()} Export</button>
        ${!cfg.isReference ? `<a class="btn primary" href="#/import-export?target=${cfg.id}">${uploadIconSvg()} Import Records</a>` : ""}
      </div>
    </div>

    ${!cfg.isReference ? `
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
      ${kpiCard({ label: "Total Records", value: fmtNum(stats.total), icon: "records", sub: cfg.label })}
      ${untracked
        ? kpiCard({ label: "Manually Tracked", value: `${stats.complete}/${stats.total}`, icon: "check", sub: "No source status field" })
        : kpiCard({ label: "Complete", value: fmtNum(stats.complete), icon: "check", sub: `${stats.pct}% of records`, cls: "positive" })}
      ${cfg.completion.mode === "flag-blank-is-complete"
        ? kpiCard({ label: "Needs Attention", value: fmtNum(stats.needsAttention), icon: "records", sub: cfg.completion.label, cls: stats.needsAttention ? "warn" : "positive" })
        : kpiCard({ label: "Remaining", value: fmtNum(stats.remaining), icon: "records", sub: "Not yet complete" })}
      ${kpiCard({ label: "Duplicates", value: fmtNum(stats.dupCount), icon: "copy", sub: stats.dupCount ? "Review in Duplicate Management" : "None found", cls: stats.dupCount ? "warn" : "positive" })}
    </div>` : ""}

    ${dupGroups.length ? `<div class="card" style="padding:12px 16px;margin-bottom:20px;border-color:var(--status-attention-bg);background:var(--status-attention-bg)">
      <span style="color:var(--status-attention);font-weight:600;font-size:13px">⚠ ${dupGroups.reduce((s,g)=>s+g.records.length,0)} record(s) in this tab are part of a duplicate group.</span>
      <a class="link-inline" href="#/duplicates" style="margin-left:8px;font-size:12.5px">Review duplicates →</a>
    </div>` : ""}

    <div id="sheet-table-region"></div>
  `;
}

function sheetDescription(cfg) {
  if (cfg.isReference) return "Reference lookup table from the source workbook — not a patient roster.";
  const c = cfg.completion;
  return c.mode === "manual" ? "No status field exists in the source data for this tab — completion is tracked manually below." : `Completion is derived from: "${c.field}" (${c.label}).`;
}

function wireSheetPage(cfg) {
  renderSheetTable(cfg);
  document.getElementById("btn-add-row")?.addEventListener("click", () => openAddRowModal(cfg)); document.getElementById("btn-export-sheet")?.addEventListener("click", () => exportSheetToExcel(cfg.id));
  document.getElementById("btn-completion-criteria")?.addEventListener("click", () => openCompletionCriteriaModal(cfg));
}

function getSheetColumns(cfg) {
  const headers = RAW_SHEETS[cfg.id]?.headers || [];
  return headers;
}

function renderSheetTable(cfg) {
  const state = getSheetPageState(cfg.id);
  const allRecords = getAllRecords().filter((r) => r.sheetId === cfg.id);
  const columns = getSheetColumns(cfg);

  let filtered = allRecords;
  if (state.search) {
    const q = state.search.toLowerCase();
    const fields = cfg.searchFields || columns;
    filtered = filtered.filter((r) => fields.some((f) => String(r.data[f] || "").toLowerCase().includes(q)));
  }
  if (state.statusFilter) {
    filtered = filtered.filter((r) => r.status === state.statusFilter);
  }
  if (state.sort) {
    const { field, dir } = state.sort;
    filtered = [...filtered].sort((a, b) => {
      const va = field === "__status" ? a.status : a.data[field] || "";
      const vb = field === "__status" ? b.status : b.data[field] || "";
      const da = parseDateLoose(va), db = parseDateLoose(vb);
      let cmp;
      if (da && db) cmp = da - db;
      else cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return dir === "asc" ? cmp : -cmp;
    });
  }

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const pageStart = (state.page - 1) * state.pageSize;
  const pageRows = filtered.slice(pageStart, pageStart + state.pageSize);

  const showStatusCol = !cfg.isReference;
  // Every column from the source sheet is shown — nothing from the original
  // Excel file is hidden or dropped, even on wide sheets (those just scroll
  // horizontally; see .data-table-wrap).
  const displayCols = columns;

  const region = document.getElementById("sheet-table-region");
  region.innerHTML = `
    <div class="table-toolbar">
      <div class="table-search">
        <span class="icon">${searchIconSvg()}</span>
        <input type="text" id="sheet-search-input" placeholder="Search ${esc(cfg.label)}…" value="${esc(state.search)}" />
      </div>
      ${showStatusCol ? `
      <select class="filter-select" id="sheet-status-filter">
        <option value="">All statuses</option>
        ${Object.keys(STATUS_META).map((s) => `<option value="${s}" ${state.statusFilter === s ? "selected" : ""}>${STATUS_META[s].label}</option>`).join("")}
      </select>` : ""}
      <button class="btn sm ghost" id="reset-filters" title="Clear search, filters, and sorting; go back to page 1">${resetIconSvg()} Reset</button>
      <span class="text-muted" style="margin-left:auto;font-size:12.5px">${fmtNum(total)} record${total === 1 ? "" : "s"}</span>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          ${displayCols.map((c) => `<th data-field="${esc(c)}">${esc(c)}${sortArrow(state, c)}</th>`).join("")}
          ${showStatusCol ? `<th data-field="__status">Status${sortArrow(state, "__status")}</th>` : ""}
          <th>Actions</th>
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map((r) => sheetRowHtml(cfg, r, displayCols, showStatusCol)).join("") : `<tr><td colspan="${displayCols.length + 2}"><div class="empty-state">${emptyIcon()}<div class="title">No records match your filters</div><div class="desc">Try clearing search or status filters.</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Page ${state.page} of ${totalPages}</span>
      <div class="pager-btns">
        <button data-page="1" ${state.page === 1 ? "disabled" : ""}>«</button>
        <button data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>‹</button>
        <button data-page="${state.page + 1}" ${state.page === totalPages ? "disabled" : ""}>›</button>
        <button data-page="${totalPages}" ${state.page === totalPages ? "disabled" : ""}>»</button>
      </div>
    </div>
  `;

  region.querySelector("#sheet-search-input").addEventListener("input", debounce((e) => {
    state.search = e.target.value;
    state.page = 1;
    renderSheetTable(cfg);
  }, 220));
  region.querySelector("#sheet-status-filter")?.addEventListener("change", (e) => {
    state.statusFilter = e.target.value || null;
    state.page = 1;
    renderSheetTable(cfg);
  });
  region.querySelector("#reset-filters")?.addEventListener("click", () => {
    state.search = ""; state.statusFilter = null; state.sort = null; state.page = 1;
    renderSheetTable(cfg);
    toast("Filters and sorting reset");
  });
  region.querySelectorAll("thead th[data-field]").forEach((th) => {
    th.addEventListener("click", () => {
      const field = th.dataset.field;
      if (state.sort?.field === field) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
      else state.sort = { field, dir: "asc" };
      renderSheetTable(cfg);
    });
  });
  region.querySelectorAll(".pager-btns button").forEach((b) => {
    b.addEventListener("click", () => { state.page = +b.dataset.page; renderSheetTable(cfg); });
  });
  region.querySelectorAll("[data-action='toggle-expand']").forEach((el) => {
    el.addEventListener("click", () => {
      const uid = el.dataset.uid;
      if (expandedRows.has(uid)) expandedRows.delete(uid);
      else expandedRows.add(uid);
      renderSheetTable(cfg);
    });
  });
  region.querySelectorAll("[data-action='edit-record']").forEach((el) => {
    el.addEventListener("click", () => openEditModal(el.dataset.uid, () => renderSheetTable(cfg)));
  });
  region.querySelectorAll("[data-action='mark-complete']").forEach((el) => {
    el.addEventListener("click", () => { setManualStatus(el.dataset.uid, "complete"); toast("Marked complete"); renderSheetTable(cfg); renderSidebar(); });
  });
  region.querySelectorAll("[data-action='mark-pending']").forEach((el) => {
    el.addEventListener("click", () => { setManualStatus(el.dataset.uid, "pending"); toast("Marked pending"); renderSheetTable(cfg); renderSidebar(); });
  });
  region.querySelectorAll("[data-action='delete-record']").forEach((el) => {
    el.addEventListener("click", () => confirmDialog(
      "Archive this record?",
      "It will be hidden from all views but can be restored later. This does not modify the original workbook.",
      () => { softDeleteRecord(el.dataset.uid); toast("Record archived"); renderSheetTable(cfg); renderSidebar(); }
    ));
  });
  region.querySelectorAll(".inline-edit-input").forEach((input) => {
    const commit = () => {
      const uid = input.dataset.uid;
      const field = input.dataset.field;
      const newVal = input.value;
      const rec = getAllRecords().find((r) => r.uid === uid);
      if (!rec || (rec.data[field] || "") === newVal) return;
      updateRecord(uid, { [field]: newVal });
      // editing the field that drives this sheet's completion should let the source field
      // speak for itself again, rather than leaving a stale manual override in place
      if (cfg.completion?.field === field) setManualStatus(uid, null);
      toast(`Saved "${field}"`);
      renderSheetTable(cfg);
      renderSidebar();
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = getAllRecords().find((r) => r.uid === input.dataset.uid)?.data[input.dataset.field] || ""; input.blur(); }
    });
  });
  region.querySelectorAll(".cal-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const textInput = btn.parentElement.querySelector(".inline-edit-input");
      openDatePickerFor(textInput);
    });
  });
}
function sortArrow(state, field) {
  if (state.sort?.field !== field) return "";
  return `<span class="sort-arrow">${state.sort.dir === "asc" ? "▲" : "▼"}</span>`;
}
// Rows expanded to show the "just below it" detail panel (profile/history
// links). Transient — resets on a full page reload, not persisted.
const expandedRows = new Set();

function sheetRowHtml(cfg, r, displayCols, showStatusCol) {
  const dateFieldsSet = new Set(cfg.dateFields || []);
  const totalCols = displayCols.length + (showStatusCol ? 1 : 0) + 1;
  const isExpanded = expandedRows.has(r.uid);

  const mainRow = `<tr data-row-for="${r.uid}">
    ${displayCols.map((c) => {
      const val = r.data[c] || "";
      const isDate = dateFieldsSet.has(c);
      const isNameCol = c === cfg.nameField;
      return `<td class="inline-cell${isNameCol ? " name-col" : ""}">
        <div class="inline-cell-wrap">
          <input type="text" class="inline-edit-input" data-uid="${r.uid}" data-field="${esc(c)}" value="${esc(val)}" placeholder="—" title="${esc(val)}" />
          ${isDate ? `<button type="button" class="cal-btn" data-uid="${r.uid}" data-field="${esc(c)}" title="Pick a date">${calendarIconSvg()}</button>` : ""}
        </div>
      </td>`;
    }).join("")}
    ${showStatusCol ? `<td>${statusBadge(r.status)}</td>` : ""}
    <td class="actions-cell">

// ---------------------------------------------------------------------------
// Shared native date picker — one hidden <input type="date"> reused for every
// calendar button, positioned right under whichever text field was clicked.
// Selecting a date writes "M/D/YYYY" back into that field and fires the same
// blur-triggered save the field already has, so no separate save path is needed.
// ---------------------------------------------------------------------------
let sharedDateInput = null;
function getSharedDateInput() {

function dgCloseCalendar() {
  const el = document.getElementById("dg-cal-pop");
  if (el) el.remove();
  if (window.__dgCalOff) { window.__dgCalOff(); window.__dgCalOff = null; }
}

function openDatePickerFor(textInput) {
  if (!textInput) return;
  dgCloseCalendar();
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const parsed = parseDateLoose(textInput.value);
  const sel = parsed ? new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate()) : null;
  let viewY = (sel || today).getFullYear();
  let viewM = (sel || today).getMonth();
  const pop = document.createElement("div");
  pop.id = "dg-cal-pop";
  pop.className = "dg-cal";
  pop.setAttribute("role", "dialog");
  pop.setAttribute("aria-label", "Choose a date");
  const same = (a, b) => !!a && !!b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const commit = (d) => {
    textInput.value = d ? `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}` : "";
    dgCloseCalendar();
    textInput.dispatchEvent(new Event("blur"));
  };
  const place = () => {
    const rect = textInput.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.min(Math.max(8, rect.left), Math.max(8, window.innerWidth - w - 8));
    let top = rect.bottom + 4;
    if (top + h > window.innerHeight - 8) top = rect.top - h - 4;
    if (top < 8) top = Math.max(8, window.innerHeight - h - 8);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  };
  const draw = () => {
    const first = new Date(viewY, viewM, 1);
    const start = new Date(viewY, viewM, 1 - first.getDay());
    const yMin = Math.min(1900, viewY), yMax = Math.max(today.getFullYear() + 10, viewY);
    let years = "";
    for (let y = yMax; y >= yMin; y--) years += `<option value="${y}"${y === viewY ? " selected" : ""}>${y}</option>`;
    let days = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const cls = ["dg-cal-day"];
      if (d.getMonth() !== viewM) cls.push("other");
      if (same(d, today)) cls.push("today");
      if (same(d, sel)) cls.push("sel");
      days += `<button type="button" class="${cls.join(" ")}" data-ts="${d.getTime()}" aria-label="${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}"${same(d, today) ? ' aria-current="date"' : ""}>${d.getDate()}</button>`;
    }
    pop.innerHTML = `<div class="dg-cal-head"><button type="button" class="dg-cal-nav" data-nav="-1" aria-label="Previous month">&#8249;</button><select data-month aria-label="Month">${MONTHS.map((m, i) => `<option value="${i}"${i === viewM ? " selected" : ""}>${m}</option>`).join("")}</select><select data-year aria-label="Year">${years}</select><button type="button" class="dg-cal-nav" data-nav="1" aria-label="Next month">&#8250;</button></div><div class="dg-cal-grid">${DOW.map((x) => `<div class="dg-cal-dow">${x}</div>`).join("")}${days}</div><div class="dg-cal-foot"><button type="button" data-today="1">Today</button><button type="button" data-clear="1">Clear</button></div>`;
    place();
  };
  pop.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.ts) { commit(new Date(+b.dataset.ts)); return; }
    if (b.dataset.nav) {
      viewM += +b.dataset.nav;
      if (viewM < 0) { viewM = 11; viewY--; } else if (viewM > 11) { viewM = 0; viewY++; }
      draw();
      return;
    }
    if (b.dataset.today) { commit(new Date(today)); return; }
    if (b.dataset.clear) commit(null);
  });
  pop.addEventListener("change", (e) => {
    if (e.target.matches("[data-month]")) viewM = +e.target.value;
    else if (e.target.matches("[data-year]")) viewY = +e.target.value;
    else return;
    draw();
  });
  pop.addEventListener("mousedown", (e) => { if (!e.target.closest("select")) e.preventDefault(); });
  document.body.appendChild(pop);
  draw();
  const onDown = (e) => { if (!pop.contains(e.target) && !(e.target.closest && e.target.closest(".cal-btn"))) dgCloseCalendar(); };
  const onKey = (e) => { if (e.key === "Escape") dgCloseCalendar(); };
  const onScroll = (e) => { if (!pop.contains(e.target)) dgCloseCalendar(); };
  setTimeout(() => {
    if (!document.body.contains(pop)) return;
    document.addEventListener("mousedown", onDown, true);
    document.addEventListener("keydown", onKey, true);
    window.addEventListener("scroll", onScroll, true);
    window.addEventListener("resize", dgCloseCalendar);
    window.addEventListener("hashchange", dgCloseCalendar);
  }, 0);
  window.__dgCalOff = () => {
    document.removeEventListener("mousedown", onDown, true);
    document.removeEventListener("keydown", onKey, true);
    window.removeEventListener("scroll", onScroll, true);
    window.removeEventListener("resize", dgCloseCalendar);
    window.removeEventListener("hashchange", dgCloseCalendar);
  };
}

function openModal(innerHtml, opts = {}) {

  backdrop.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}">${innerHtml}</div>`;
  document.body.appendChild(backdrop);
  requestAnimationFrame(() => backdrop.classList.add("open"));
  backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", escCloseHandler);
  return backdrop;
}
function escCloseHandler(e) { if (e.key === "Escape") closeModal(); }
function closeModal() {
  const m = document.getElementById("active-modal");
  if (!m) return;
  m.id = ""; // free up the id immediately so a modal opened right after this one is unambiguous during the fade-out
  m.classList.remove("open");
  document.removeEventListener("keydown", escCloseHandler);
  setTimeout(() => m.remove(), 180);
}

function renderRawDataTable() {

  if (rawDataState.sourceFilter) {
    records = records.filter((r) => r.sheetId === rawDataState.sourceFilter);

  if (rawDataState.search) {
    const q = rawDataState.search.toLowerCase();
    records = records.filter((r) => {
      const cfg = SHEET_BY_ID[r.sheetId];

      __source: (r) => SHEET_BY_ID[r.sheetId].label,
      __status: (r) => r.status,
    }[field];
    records = [...records].sort((a, b) => {
      const cmp = String(valueOf(a)).localeCompare(String(valueOf(b)), undefined, { numeric: true });

  return `
    <div class="page-header">

      ${kpiCard({ label: "Potential Duplicates", value: fmtNum(idx.potentialDuplicates.length), icon: "copy", sub: fmtNum(idx.potentialDuplicates.reduce((s,g)=>s+g.records.length,0)) + " records" })}
